// Klein "⋯"-menu (weekoverzicht delen, vorige week kopiëren).
function MoreMenu({ items }) {
  const [open, setOpen] = useState(false);
  useBackClose(open, () => setOpen(false));
  return (
    <div className="relative">
      <IconBtn name="more" onClick={() => setOpen(!open)} title="Meer" className="bg-white border border-line" />
      {open && (
        <>
          <div className="fixed inset-0 z-40" onClick={() => setOpen(false)} />
          <div className="absolute right-0 top-11 z-50 w-64 bg-white rounded-2xl border border-line shadow-lift p-1.5">
            {items.map(it => (
              <button key={it.label} onClick={() => { setOpen(false); it.onClick(); }}
                className="w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-sm font-bold text-deep active:bg-mist text-left">
                <span className="w-5 text-center">{it.emoji}</span>{it.label}
              </button>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

// Vandaag-balk bovenaan de week: wat eten we vandaag, gegeten aanvinken (+ oordeel), en wat er nog te doen is.
function TodayBar({ weekStart, weekmenu, recipesById, todo, onOpenMeal, onEaten, onEatenRate, onGo }) {
  const day = DAYS[dayIndexOf(todayISO())];
  const rows = MEALS.map(m => {
    const slot = weekmenu[day][m.key];
    const rs = slotRecipes(slot, recipesById);
    const name = slotSummary(slot, recipesById);
    return { m, slot, rs, name, past: mealIsPast(weekStart, day, m.key) };
  });
  const chips = [
    todo.basket > 0 && { label: `🛒 ${todo.basket} te halen`, go: ['winkel'] },
    todo.choose > 0 && { label: `📝 ${todo.choose} te kiezen`, go: ['shopping'] },
    todo.out > 0 && { label: `🥫 ${todo.out} op in de voorraad`, go: ['keuken', 'voorraad'] },
  ].filter(Boolean);
  return (
    <Card className="mb-4 overflow-hidden">
      <div className="px-4 pt-3 pb-1 flex items-baseline justify-between">
        <span className="text-[15px] font-black text-deep">Vandaag</span>
        <span className="text-[12px] font-bold text-stone-500">{fmtDayLong(weekStart, DAYS.indexOf(day))}</span>
      </div>
      <div className="divide-y divide-line/60">
        {rows.map(({ m, slot, rs, name, past }) => {
          const empty = slotMode(slot) === 'empty';
          const ask = past && rs.length > 0 && !slot.eatenAt;
          return (
            <div key={m.key} className="flex items-center gap-2 px-4 py-2">
              <span className="w-6 text-center">{m.emoji}</span>
              <button onClick={() => onOpenMeal(day, m.key)} className="flex-1 min-w-0 text-left">
                <span className="block text-[11px] font-extrabold text-stone-500 uppercase tracking-wide">{m.label}</span>
                <span className={cx('block text-[14px] font-bold truncate', empty ? 'text-sage' : 'text-ink')}>{empty ? '+ Plan deze maaltijd' : name}</span>
              </button>
              {ask && (
                <span className="flex items-center gap-1 shrink-0">
                  <button onClick={() => onEatenRate(day, m.key, 'up')} aria-label={`${m.label} gegeten, lekker`} className="h-9 px-2.5 rounded-xl bg-mint text-forest text-[13px] font-black">👍</button>
                  <button onClick={() => onEatenRate(day, m.key, 'down')} aria-label={`${m.label} gegeten, minder lekker`} className="h-9 px-2.5 rounded-xl bg-mint text-forest text-[13px] font-black">👎</button>
                  <button onClick={() => onEaten(day, m.key, true)} aria-label={`${m.label} gegeten`} className="h-9 px-2.5 rounded-xl bg-forest text-white text-[12px] font-black">✓ Gegeten</button>
                </span>
              )}
              {slot.eatenAt && <button onClick={() => onEaten(day, m.key, false)} aria-label={`${m.label}: niet gegeten`} className="text-[12px] font-extrabold text-leaf shrink-0">✓ gegeten{slot.feedback === 'up' ? ' 👍' : slot.feedback === 'down' ? ' 👎' : ''}</button>}
            </div>
          );
        })}
      </div>
      {chips.length > 0 && (
        <div className="flex flex-wrap gap-1.5 px-4 pb-3 pt-1">
          {chips.map(c => <button key={c.label} onClick={() => onGo(...c.go)} className="h-8 px-3 rounded-full bg-cream border border-line text-[12px] font-extrabold text-deep active:bg-mint">{c.label} ›</button>)}
        </div>
      )}
    </Card>
  );
}

function PlannerPage({ nav, weekmenu, recipesById, weekLoading, members, selectedDay, setSelectedDay, onOpenMeal, onToggleLock, onFeedback, onEaten, onEatenRate, todo, onGo, aiTargetCount, aiBusy, onAiFill, onCopyPrev, showToast }) {
  const [view, setView] = useState('day');
  const swipeRef = useRef(null);
  const today = todayISO();
  const dayIdx = DAYS.indexOf(selectedDay);
  const dayCarbs = MEALS.reduce((s, m) => s + (slotCarbs(weekmenu[selectedDay][m.key], recipesById) || 0), 0);

  // Snel weekoverzicht om te delen (bv. met een coach): per dag wat er gegeten
  // wordt bij ontbijt/middag/avond, in platte tekst.
  async function shareWeekSummary() {
    const lines = [`📋 Weekmenu — week ${isoWeekNumber(nav.weekStart)} (${fmtWeekRange(nav.weekStart)})`];
    DAYS.forEach((day, i) => {
      lines.push('', `*${fmtDayLong(nav.weekStart, i)}*`);
      MEALS.forEach(m => {
        const summary = slotSummary(weekmenu[day][m.key], recipesById);
        lines.push(`${m.emoji} ${m.label}: ${summary || '—'}`);
      });
    });
    const text = lines.join('\n');
    try {
      if (navigator.share) await navigator.share({ text });
      else { await navigator.clipboard.writeText(text); showToast('Weekoverzicht gekopieerd — plak het in WhatsApp of een bericht'); }
    } catch (e) { /* delen geannuleerd */ }
  }

  return (
    <div>
      <PageHeader eyebrow={`Week ${isoWeekNumber(nav.weekStart)}${nav.isCurrent ? ' · deze week' : ''}`} title={fmtWeekRange(nav.weekStart)}
        right={<><WeekNav nav={nav} /><MoreMenu items={[
          { emoji: '📤', label: 'Weekoverzicht delen (coach)', onClick: shareWeekSummary },
          { emoji: '📋', label: 'Kopieer vorige week', onClick: onCopyPrev },
        ]} /></>} />

      {nav.isCurrent && <TodayBar weekStart={nav.weekStart} weekmenu={weekmenu} recipesById={recipesById} todo={todo}
        onOpenMeal={onOpenMeal} onEaten={onEaten} onEatenRate={onEatenRate} onGo={onGo} />}

      <div className="grid grid-cols-7 gap-1.5 mb-3">
        {DAYS.map((day, i) => {
          const iso = addDays(nav.weekStart, i);
          const sel = view === 'day' && selectedDay === day;
          return (
            <button key={day} onClick={() => { setSelectedDay(day); setView('day'); }}
              className={cx('rounded-2xl pt-2 pb-2 flex flex-col items-center border transition',
                sel ? 'bg-forest border-forest text-white shadow-lift' : 'bg-white border-line text-deep',
                !sel && iso === today && 'ring-2 ring-sage/60')}>
              <span className={cx('text-[10px] font-extrabold uppercase', sel ? 'text-white/70' : 'text-stone-400')}>{DAY_SHORT[i]}</span>
              <span className="text-[17px] font-black leading-none mt-0.5">{parseISODate(iso).getDate()}</span>
              <span className="flex gap-[3px] mt-1.5">
                {MEALS.map(m => {
                  const planned = slotIsPlanned(weekmenu[day][m.key]);
                  return <span key={m.key} className={cx('w-1.5 h-1.5 rounded-full', planned ? (sel ? 'bg-white' : 'bg-sage') : (sel ? 'bg-white/25' : 'bg-stone-200'))} />;
                })}
              </span>
            </button>
          );
        })}
      </div>

      <div className="flex items-center gap-2 mb-4">
        <Segmented className="flex-1" value={view} onChange={setView}
          options={[{ value: 'day', label: 'Dag', icon: 'list' }, { value: 'week', label: 'Hele week', icon: 'grid' }]} />
        {aiTargetCount > 0 && (
          <button onClick={onAiFill} disabled={aiBusy} title={`AI vult de open maaltijden van deze week in (${aiTargetCount}). Vaste maaltijden blijven staan.`}
            className="shrink-0 h-11 px-3.5 rounded-2xl bg-gradient-to-br from-deep to-forest text-white flex items-center gap-1.5 text-sm font-black shadow-card disabled:opacity-50 active:scale-95 transition">
            <Icon name="sparkles" size={16} />{aiBusy ? 'Bezig…' : 'Vul de week'}
          </button>
        )}
      </div>

      {weekLoading && <div className="text-center text-xs font-bold text-sage mb-3">Week laden…</div>}

      {view === 'day' ? (
        <div className="space-y-3"
          onTouchStart={(e) => { const t = e.touches[0]; swipeRef.current = { x: t.clientX, y: t.clientY }; }}
          onTouchEnd={(e) => {
            const st = swipeRef.current; swipeRef.current = null; if (!st) return;
            const t = e.changedTouches[0]; const dx = t.clientX - st.x, dy = t.clientY - st.y;
            if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8) nav.shiftDay(dx < 0 ? 1 : -1);
          }}>
          <div className="flex items-center gap-2">
            <button onClick={() => nav.shiftDay(-1)} aria-label="Vorige dag"
              className="w-11 h-11 shrink-0 rounded-2xl bg-white border border-line text-forest flex items-center justify-center active:scale-95 transition"><Icon name="left" size={20} /></button>
            <div className="flex-1 min-w-0 text-center">
              <h3 className="text-base font-black text-deep truncate">{fmtDayLong(nav.weekStart, dayIdx)}</h3>
              {dayCarbs > 0 && <div className="text-[11px] font-bold text-stone-400">≈ {Math.round(dayCarbs)} g koolhydraten</div>}
            </div>
            <button onClick={() => nav.shiftDay(1)} aria-label="Volgende dag"
              className="w-11 h-11 shrink-0 rounded-2xl bg-white border border-line text-forest flex items-center justify-center active:scale-95 transition"><Icon name="right" size={20} /></button>
          </div>
          {MEALS.map(m => (
            <MealCard key={m.key} meal={m} slot={weekmenu[selectedDay][m.key]} recipesById={recipesById} members={members}
              onOpen={() => onOpenMeal(selectedDay, m.key)} onToggleLock={() => onToggleLock(selectedDay, m.key)}
              onFeedback={(v) => onFeedback(selectedDay, m.key, v)}
              canEat={mealIsPast(nav.weekStart, selectedDay, m.key)} onEaten={(v) => onEaten(selectedDay, m.key, v)} onEatenRate={(v) => onEatenRate(selectedDay, m.key, v)} />
          ))}
        </div>
      ) : (
        <div className="space-y-2.5">
          {DAYS.map((day, i) => (
            <Card key={day} className="overflow-hidden">
              <button onClick={() => { setSelectedDay(day); setView('day'); }} className="w-full flex items-center justify-between px-4 pt-3 pb-1.5">
                <span className="font-black text-deep text-sm">{fmtDayLong(nav.weekStart, i)}</span>
                <Icon name="right" size={16} className="text-stone-300" />
              </button>
              {MEALS.map(m => {
                const s = weekmenu[day][m.key];
                const summary = slotSummary(s, recipesById);
                return (
                  <button key={m.key} onClick={() => onOpenMeal(day, m.key)} className="w-full flex items-center gap-2 px-4 py-2 text-left border-t border-line/60 active:bg-mist">
                    <span className="w-16 text-[11px] font-extrabold text-stone-400 shrink-0">{m.emoji} {m.label}</span>
                    <span className={cx('flex-1 text-[13px] truncate', summary ? 'font-semibold text-ink' : 'text-stone-300')}>{summary || 'Nog niets'}</span>
                    {s.doubleFor && <span className="text-[10px]" title="Dubbel koken">🍲</span>}
                    {s.aiGenerated && <span className="text-[10px]">✨</span>}
                    {s.eatenAt && <Icon name="check" size={12} className="text-sage" />}
                  </button>
                );
              })}
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}

function MealCard({ meal, slot, recipesById, members, onOpen, onFeedback, canEat, onEaten, onEatenRate }) {
  const mode = slotMode(slot);
  const rs = slotRecipes(slot, recipesById);
  const hits = restrictionHits(rs, members);
  const main = slot.recipeId ? recipesById[slot.recipeId] : null;
  const extras = (slot.componentIds || []).map(id => recipesById[id]).filter(Boolean);
  const carbs = slotCarbs(slot, recipesById);
  const idea = (slot.notes || '').includes('\n💡') ? slot.notes.split('\n💡')[1].trim() : '';

  return (
    <Card className="overflow-hidden">
      <div className="flex items-center gap-2 pl-4 pr-2 pt-2.5">
        <span className="text-base">{meal.emoji}</span>
        <span className="font-black text-deep text-sm">{meal.label}</span>
        <span className="text-[11px] text-stone-400 font-bold flex items-center gap-1"><Icon name="users" size={12} />{slot.persons}</span>
        {slot.aiGenerated && <span className="text-[10px] font-black text-sage bg-mist rounded-full px-2 py-0.5">✨ AI</span>}
        <div className="flex-1" />

      </div>

      <button onClick={onOpen} className="w-full text-left px-4 pb-3 pt-1 active:bg-mist/50">
        {mode === 'empty' && (
          <div className="border-2 border-dashed border-line rounded-xl py-3 text-center text-sm font-extrabold text-sage">+ Plan deze maaltijd</div>
        )}
        {mode === 'skip' && <div className="text-sm font-semibold text-stone-400">⏭ Overgeslagen — niets te kopen</div>}
        {mode === 'free' && (
          <div>
            <div className="text-[15px] font-extrabold text-ink leading-snug">✏️ {capFirst((slot.notes || '').trim()) || 'Nog niets genoteerd'}</div>
            <div className="text-[11px] font-bold text-stone-500 mt-1">Snel genoteerd · staat op de boodschappenlijst</div>
          </div>
        )}
        {mode === 'leftovers' && (
          <div>
            <div className="text-sm font-bold text-ink">🍱 Restjes{slot.notes ? <span className="font-semibold text-stone-500"> · {slot.notes.split('\n')[0].replace(/^Restjes: /, '')}</span> : null}</div>
            {idea && <div className="text-xs text-leaf mt-1 line-clamp-2">💡 {idea}</div>}
          </div>
        )}
        {mode === 'recipe' && (
          main ? (
            <div>
              <div className="flex items-start gap-2">
                <div className="flex-1 min-w-0">
                  <div className="text-[15px] font-extrabold text-ink leading-snug">{main.title}</div>
                  <div className="flex items-center gap-2 mt-1"><CatChip category={main.category} small /><Stars value={main.stars} /></div>
                </div>
              </div>
              {extras.length > 0 && <div className="text-xs font-semibold text-stone-500 mt-1.5">+ {extras.map(e => e.title).join(', ')}</div>}
            </div>
          ) : <div className="text-sm font-bold text-stone-400">{catMeta(slot.category).emoji} {catMeta(slot.category).label} — nog te kiezen <span className="font-semibold">(of laat de AI kiezen)</span></div>
        )}
        {mode === 'compose' && (
          extras.length ? (
            <div className="space-y-1">
              {extras.map(r => (
                <div key={r.id} className="flex items-center gap-2">
                  <span className="w-6 text-center">{catMeta(r.category).emoji}</span>
                  <span className="text-[14px] font-bold text-ink flex-1 min-w-0 truncate">{r.title}</span>
                  <Stars value={r.stars} size={10} />
                </div>
              ))}
            </div>
          ) : <div className="text-sm font-bold text-stone-400">🧩 Samenstellen — kies vlees/vis, groenten, bijgerecht…</div>
        )}
        {(slot.doubleFor || hits.length > 0) && (
          <div className="flex flex-wrap gap-1 mt-2">
            {slot.doubleFor && <span className="text-[10px] font-black rounded-full px-2 py-0.5 bg-mist text-forest">🍲 dubbel — restjes {slotLabel(slot.doubleFor)}</span>}
            {hits.slice(0, 3).map((h, i) => (
              <span key={i} className={cx('text-[10px] font-black rounded-full px-2 py-0.5', h.kind === 'allergie' ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-800')}>
                {h.kind === 'allergie' ? '⚠️' : '🙅'} {h.who}: {h.term}
              </span>
            ))}
          </div>
        )}
      </button>

      {rs.length > 0 && (canEat || slot.eatenAt) && (
        <div className={cx('flex items-center gap-2 px-4 py-2 border-t border-line/70', slot.eatenAt ? 'bg-mint/60' : 'bg-mist/70')}>
          {slot.eatenAt ? (
            <button onClick={() => onEaten(false)} aria-label={`${meal.label}: niet gegeten`} className="flex-1 flex items-center gap-2 text-left">
              <span className="w-6 h-6 rounded-full bg-sage text-white flex items-center justify-center shrink-0"><Icon name="check" size={14} stroke={3} /></span>
              <span className="text-[13px] font-extrabold text-deep">Gegeten{slot.feedback === 'up' ? ' · 👍 lekker' : slot.feedback === 'down' ? ' · 👎 minder' : ''}</span>
            </button>
          ) : (
            <>
              <span className="flex-1 text-[13px] font-extrabold text-deep">Gegeten?</span>
              <button onClick={() => onEatenRate('up')} aria-label={`${meal.label} gegeten, lekker`} className="h-9 px-2.5 rounded-xl bg-white border border-line text-[13px] font-black">👍</button>
              <button onClick={() => onEatenRate('down')} aria-label={`${meal.label} gegeten, minder lekker`} className="h-9 px-2.5 rounded-xl bg-white border border-line text-[13px] font-black">👎</button>
              <button onClick={() => onEaten(true)} aria-label={`${meal.label}: gegeten`} className="h-9 px-2.5 rounded-xl bg-forest text-white text-[12px] font-black">✓</button>
            </>
          )}
        </div>
      )}
      {rs.length > 0 && !(canEat || slot.eatenAt) && carbs != null && (
        <div className="px-4 py-1.5 bg-mist/70 border-t border-line/70 text-[11px] font-bold text-stone-500">≈ {Math.round(carbs)} g koolhydraten</div>
      )}
    </Card>
  );
}

// Keuzelijst met zoekveld, gebruikt overal waar je een recept kiest.
function RecipePicker({ recipes, categories, excludeIds = [], onPick, onCreate, showCategory }) {
  const [q, setQ] = useState('');
  const [gf, setGf] = useState(false);
  const list = useMemo(() => recipes
    .filter(r => (!categories || categories.includes(r.category)) && !excludeIds.includes(r.id) && (!gf || r.glutenFree) && (!q || normalize(r.title).includes(normalize(q))))
    .sort((a, b) => (b.stars || 0) - (a.stars || 0) || a.title.localeCompare(b.title)), [recipes, categories, excludeIds, q, gf]);
  return (
    <div>
      <div className="flex items-center gap-2 mb-2">
        <div className="relative flex-1">
          <Icon name="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-300" />
          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Zoek een recept…" className={cx(inputCls, 'pl-9 py-2 bg-cream')} />
        </div>
        <button onClick={() => setGf(!gf)} title="Enkel glutenvrije recepten"
          className={cx('shrink-0 rounded-xl border px-2.5 py-2 text-xs font-extrabold', gf ? 'bg-amber-500 text-white border-amber-500' : 'bg-white text-amber-800 border-amber-300')}>🌾 GV</button>
      </div>
      <div className="max-h-64 overflow-y-auto -mx-1">
        {list.map(r => (
          <button key={r.id} onClick={() => onPick(r.id)} className="w-full flex items-center gap-2.5 px-2 py-2 rounded-xl active:bg-mist text-left">
            <span className="w-9 h-9 rounded-xl bg-cream border border-line flex items-center justify-center text-base shrink-0">{catMeta(r.category).emoji}</span>
            <span className="flex-1 min-w-0">
              <span className="block text-sm font-bold text-ink truncate">{r.title}</span>
              <span className="block text-[11px] text-stone-400">
                {showCategory ? catShort(r.category) + ' · ' : ''}{r.stars ? <Stars value={r.stars} size={10} /> : 'nog geen sterren'}
                {r.carbsPerPortion != null ? ` · ${fmtAmount(r.carbsPerPortion)} g koolh.` : ''}
              </span>
            </span>
            <Icon name="plus" size={18} className="text-sage" />
          </button>
        ))}
        {list.length === 0 && <div className="text-xs text-stone-400 px-2 py-3">Geen recepten gevonden{q ? ` voor "${q}"` : ' in deze categorie'}.</div>}
      </div>
      {onCreate && (
        <button onClick={() => onCreate(q)} className="mt-2 w-full rounded-xl border-2 border-dashed border-sage/40 text-forest text-sm font-extrabold py-2.5">
          + Nieuw recept{categories && categories.length === 1 ? ` (${catShort(categories[0])})` : ''}{q ? ` "${q}"` : ''}
        </button>
      )}
    </div>
  );
}

// Eén rij in "Samenstellen": bv. 🥦 Groenten — gekozen chips + kiezer.
function ComposeRow({ row, ids, recipes, recipesById, open, onToggle, onChange, onOpenRecipe, onCreate }) {
  return (
    <div className={cx('rounded-2xl border bg-white transition', open ? 'border-sage shadow-card' : 'border-line')}>
      <div className="flex items-center gap-2 px-3.5 py-2.5">
        <span className="text-lg">{row.emoji}</span>
        <span className="text-sm font-extrabold text-deep flex-1">{row.label}</span>
        <button onClick={onToggle} className={cx('text-xs font-black rounded-full px-3 py-1.5', open ? 'bg-forest text-white' : 'bg-mist text-forest')}>
          {open ? 'Klaar' : ids.length ? '+ Nog één' : '+ Kies'}
        </button>
      </div>
      {ids.length > 0 && (
        <div className="px-3.5 pb-3 flex flex-wrap gap-1.5">
          {ids.map(id => {
            const r = recipesById[id];
            if (!r) return null;
            return (
              <span key={id} className="inline-flex items-center rounded-full bg-cream border border-line max-w-full">
                <button onClick={() => onOpenRecipe(id)} className="pl-3 pr-1 py-1.5 text-[13px] font-bold text-ink truncate">{r.title}</button>
                <button onClick={() => onChange(ids.filter(x => x !== id))} className="pr-2 pl-1 py-1.5 text-stone-400" aria-label="Verwijderen"><Icon name="x" size={14} /></button>
              </span>
            );
          })}
        </div>
      )}
      {open && (
        <div className="border-t border-line p-2.5">
          <RecipePicker recipes={recipes} categories={row.categories} excludeIds={ids} showCategory={!row.categories}
            onPick={(id) => { onChange([...ids, id]); onToggle(); }}
            onCreate={(q) => onCreate({ category: row.categories && row.categories.length === 1 ? row.categories[0] : '', title: q, onCreated: (id) => { onChange([...ids, id]); onToggle(); } })} />
        </div>
      )}
    </div>
  );
}

// "Kook dubbel voor…": kies een latere maaltijd in dezelfde week die restjes wordt.
function DoubleCookBlock({ day, meal, slot, weekmenu, recipesById, onPick, onUndo }) {
  const [open, setOpen] = useState(false);
  const di = DAYS.indexOf(day), mi = MEALS.findIndex(m => m.key === meal);
  const later = [];
  DAYS.forEach((d, i) => MEALS.forEach((m, j) => { if (i > di || (i === di && j > mi)) later.push({ day: d, meal: m.key, i, m }); }));
  if (slot.doubleFor) {
    return (
      <Card className="p-3.5 flex items-center gap-3">
        <span className="text-2xl">🍲</span>
        <div className="flex-1 min-w-0">
          <div className="text-sm font-extrabold text-deep">Dubbel koken</div>
          <div className="text-xs text-stone-500">Restjes op {slotLabel(slot.doubleFor)} — de boodschappen tellen de extra porties mee.</div>
        </div>
        <Btn variant="secondary" size="sm" onClick={onUndo}>Opheffen</Btn>
      </Card>
    );
  }
  return (
    <div>
      <Btn variant="soft" className="w-full" onClick={() => setOpen(!open)}>🍲 Kook dubbel voor…</Btn>
      {open && (
        <Card className="p-2.5 mt-2">
          {later.length === 0 ? <div className="text-xs text-stone-400 p-2">Geen latere maaltijd meer deze week.</div> : (
            <div className="max-h-64 overflow-y-auto space-y-1">
              {later.map(({ day: d, meal: mk, i, m }) => {
                const s = weekmenu[d][mk];
                const summary = slotSummary(s, recipesById);
                return (
                  <button key={d + mk} onClick={async () => { if (await onPick(d, mk)) setOpen(false); }}
                    className="w-full flex items-center gap-2 px-2.5 py-2 rounded-xl text-left active:bg-mist">
                    <span className="w-28 shrink-0 text-xs font-extrabold text-deep whitespace-nowrap">{DAY_SHORT[i]} · {m.emoji} {m.label}</span>
                    <span className={cx('flex-1 text-xs truncate', summary ? 'text-stone-500' : 'text-stone-300')}>{summary || 'vrij'}</span>
                  </button>
                );
              })}
            </div>
          )}
        </Card>
      )}
    </div>
  );
}

// Lege maaltijd: één veld om een recept te zoeken óf gewoon te noteren wat jullie eten.
// Tik op een recept = ingepland en klaar. Geen recept? "Noteer …" zet het als snelle notitie.
function QuickPick({ recipes, meal, onPickRecipe, onSaveNote }) {
  const [text, setText] = useState('');
  // groep kiezen: Ontbijt, Snack, Hoofdmaaltijd… (standaard volgens de maaltijd)
  const [group, setGroup] = useState(meal === 'Ontbijt' ? 'Ontbijt' : 'Hoofdmaaltijd');
  const qn = normalize(text);
  const groups = useMemo(() => {
    const cnt = (f) => recipes.filter(f).length;
    return [
      { id: 'all', label: 'Alles', emoji: '📚', test: () => true },
      ...(meal === 'Ontbijt' ? ['Ontbijt', 'Snack', ...DISH_CATEGORIES.filter(c => c !== 'Ontbijt' && c !== 'Snack')] : DISH_CATEGORIES).map(c => ({ id: c, label: catMeta(c).label, emoji: catMeta(c).emoji, test: (r) => (r.category || 'Extra') === c })),
      { id: 'parts', label: 'Onderdelen', emoji: '🧩', test: (r) => isComponent(r.category) },
    ].map(g => ({ ...g, n: cnt(g.test) })).filter(g => g.id === 'all' || g.n > 0);
  }, [recipes, meal]);
  const g = groups.find(x => x.id === group) || groups[0];
  const list = useMemo(() => {
    let l = recipes.filter(g.test);
    if (qn) l = l.filter(r => normalize(r.title).includes(qn) || (qn.length >= 3 && (r.ingredients || []).some(i => normalize(i.name).includes(qn))));
    return [...l].sort((a, b) => (qn ? (normalize(b.title).startsWith(qn) - normalize(a.title).startsWith(qn)) : 0)
      || (b.stars || 0) - (a.stars || 0) || a.title.localeCompare(b.title)).slice(0, qn ? 12 : 40);
  }, [recipes, qn, group]); // eslint-disable-line
  const elsewhere = qn && !list.length ? recipes.filter(r => normalize(r.title).includes(qn)).length : 0;
  return (
    <div className="space-y-2 mb-5">
      <label htmlFor="quickpick" className="block text-base font-black text-deep">Wat eten jullie?</label>
      <div className="flex gap-1.5 overflow-x-auto no-scrollbar -mx-5 px-5 pb-0.5">
        {groups.map(x => (
          <button key={x.id} onClick={() => setGroup(x.id)} aria-pressed={group === x.id}
            className={cx('shrink-0 h-9 px-3 rounded-full border text-[13px] font-extrabold whitespace-nowrap active:scale-95 transition',
              group === x.id ? 'bg-forest text-white border-forest' : 'bg-white text-deep border-line')}>
            {x.emoji} {x.label}{x.id !== 'all' ? <span className={cx('ml-1 font-bold', group === x.id ? 'text-white/70' : 'text-stone-400')}>{x.n}</span> : null}
          </button>
        ))}
      </div>
      <div className="relative">
        <Icon name="search" size={17} className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-400" />
        <input id="quickpick" value={text} onChange={(e) => setText(e.target.value)} enterKeyHint="done"
          onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); if (text.trim() && !list.length) onSaveNote(text); else e.target.blur(); } }}
          placeholder="Zoek een recept, of typ bv. hamburger, wortel" className={cx(inputCls, 'pl-9 py-3 text-base')} />
      </div>
      <div className="rounded-2xl border border-line bg-white divide-y divide-line/70 overflow-hidden max-h-[46vh] overflow-y-auto">
        {!qn && list.length > 0 && <div className="px-3.5 pt-2.5 pb-1 text-[11px] font-extrabold uppercase tracking-wide text-stone-500">{g.id === 'all' ? 'Alle recepten' : g.label} · beste eerst</div>}
        {elsewhere > 0 && <button onClick={() => setGroup('all')} className="w-full px-3.5 py-3 text-left text-[13px] font-bold text-amber-800 active:bg-mist">Niets in {g.label} — {elsewhere} gevonden in andere groepen. Toon alles ›</button>}
        {list.map(r => (
          <button key={r.id} onClick={() => onPickRecipe(r)} className="w-full flex items-center gap-3 px-3.5 py-3 text-left active:bg-mist">
            <span className="text-lg w-6 text-center">{catMeta(r.category).emoji}</span>
            <span className="flex-1 min-w-0">
              <span className="block text-[15px] font-bold text-ink truncate">{r.title}</span>
              <span className="block text-[11px] text-stone-500">{catShort(r.category)}{r.stars ? ' · ' + '★'.repeat(r.stars) : ''}</span>
            </span>
            <span className="text-xs font-black text-forest bg-mint rounded-full px-3 py-1.5">Kies</span>
          </button>
        ))}
        {qn && (
          <button onClick={() => onSaveNote(text)} className="w-full flex items-center gap-3 px-3.5 py-3 text-left active:bg-mist">
            <span className="text-lg w-6 text-center">✏️</span>
            <span className="flex-1 min-w-0">
              <span className="block text-[15px] font-bold text-ink truncate">Noteer "{text.trim()}"</span>
              <span className="block text-[11px] text-stone-500">Zonder recept · elk deel komt op de boodschappenlijst</span>
            </span>
          </button>
        )}
      </div>
    </div>
  );
}

// Eén veld om snel te noteren wat jullie eten. Bewaart bij Enter, bij "Noteren" en bij het verlaten van het veld.
function QuickNote({ value, onSave }) {
  const [text, setText] = useState(value || '');
  const dirty = text.trim() !== (value || '').trim();
  return (
    <div className="rounded-2xl border border-line bg-white p-3.5 space-y-2">
      <label htmlFor="quicknote" className="block text-sm font-extrabold text-deep">✏️ Wat eten jullie?</label>
      <div className="flex gap-2">
        <input id="quicknote" value={text} onChange={(e) => setText(e.target.value)}
          onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); onSave(text); e.target.blur(); } }}
          onBlur={() => { if (dirty) onSave(text); }}
          placeholder="bv. hamburger, wortel, patatjes" enterKeyHint="done" className={cx(inputCls, 'text-base')} />
        <Btn onClick={() => onSave(text)} disabled={!text.trim() || !dirty} className="shrink-0">Noteren</Btn>
      </div>
      <div className="text-[11px] text-stone-500">Geen recept nodig. Scheid met komma's: elk deel komt op de boodschappenlijst.</div>
    </div>
  );
}

function MealSheet({ day, meal, dayLabel, slot, weekmenu, recipes, recipesById, aiBusy, members, onChange, onClear, onCookDouble, onUndoDouble, onAiFill, onOpenRecipe, onCreateRecipe, onClose }) {
  const mealDef = MEALS.find(m => m.key === meal);
  const mode = slotMode(slot);
  const [openRow, setOpenRow] = useState(null);
  const [changing, setChanging] = useState(false);   // "iets anders kiezen" vanuit een ingevulde maaltijd
  const reset = { aiGenerated: false, feedback: null };

  function setMode(next) {
    setChanging(false);
    if (next === mode) return;
    setOpenRow(null);
    // een snelle notitie hoort niet mee te verhuizen naar een andere soort maaltijd
    const base = mode === 'free' ? { ...reset, notes: '' } : reset;
    if (next === 'compose') {
      const ids = [...new Set([slot.recipeId, ...slot.componentIds].filter(Boolean))];
      onChange({ ...base, category: TYPE_COMPOSE, recipeId: '', componentIds: ids, locked: ids.length > 0 });
    } else if (next === 'leftovers') onChange({ ...base, category: TYPE_LEFTOVERS, recipeId: '', componentIds: [], locked: true });
    else if (next === 'skip') onChange({ ...base, category: TYPE_SKIP, recipeId: '', componentIds: [], notes: '', locked: true });
    else if (next === 'free') onChange({ ...reset, category: TYPE_FREE, recipeId: '', componentIds: [], notes: '', locked: true });
  }
  function saveNote(text) {
    const v = (text || '').trim();
    if (!v && mode !== 'free') return;
    onChange({ ...reset, category: TYPE_FREE, recipeId: '', componentIds: [], notes: v, locked: true });
  }
  function pickRecipe(r) {
    if (isComponent(r.category)) onChange({ ...reset, category: TYPE_COMPOSE, recipeId: '', componentIds: [r.id], notes: '', locked: true });
    else onChange({ ...reset, category: r.category || 'Hoofdmaaltijd', recipeId: r.id, componentIds: [], notes: '', locked: true });
    setChanging(false);
    onClose();
  }
  // lege maaltijd: AI kiest een recept van het gewone type
  function aiPick() {
    onChange({ ...reset, category: defaultTypeFor(meal), recipeId: '', componentIds: [], notes: '' });
    setTimeout(onAiFill, 0);
  }
  function noteToRecipe() {
    const cat = meal === 'Ontbijt' ? 'Ontbijt' : 'Hoofdmaaltijd';
    onCreateRecipe({ category: cat, title: capFirst((slot.notes || '').trim()),
      ingredients: parseFreeItems(slot.notes).map(name => ({ name, amount: null, unit: '' })),
      onCreated: (id) => onChange({ ...reset, category: cat, recipeId: id, componentIds: [], notes: '', locked: true }) });
  }
  // zelf kiezen = automatisch "vast", zodat de AI het niet overschrijft
  function setComponents(ids) { onChange({ ...reset, componentIds: ids, locked: ids.length > 0 }); }
  const main = slot.recipeId ? recipesById[slot.recipeId] : null;
  const rowIds = (key) => (slot.componentIds || []).filter(id => roleOf(recipesById[id]) === key);
  const setRowIds = (key, ids) => setComponents([...(slot.componentIds || []).filter(id => roleOf(recipesById[id]) !== key), ...ids]);
  const carbs = slotCarbs(slot, recipesById);

  const MODES = [
    { value: 'compose', emoji: '🧩', label: 'Samenstellen' },
    { value: 'recipe', emoji: '📖', label: 'Eén recept' },
    { value: 'leftovers', emoji: '🍱', label: 'Restjes' },
    { value: 'skip', emoji: '⏭', label: 'Overslaan' },
  ];

  return (
    <Sheet title={`${mealDef.emoji} ${mealDef.label}`} subtitle={dayLabel} onClose={onClose} full
      footer={
        <div className="flex items-center gap-2">
          {mode !== 'empty' && <Btn variant="danger" size="md" icon="trash" onClick={onClear}>Leegmaken</Btn>}
          <div className="flex-1" />
          <Btn size="md" onClick={onClose} icon="check">Klaar</Btn>
        </div>
      }>
      <div className="flex items-center justify-between gap-3 mb-4">
        <Stepper value={slot.persons} onChange={(v) => onChange({ persons: v })} label="pers." />
        {slot.aiGenerated && mode !== 'empty' && <span className="text-[11px] font-black text-sage bg-mist rounded-full px-2.5 py-1">✨ door AI gekozen</span>}
      </div>

      {(mode === 'empty' || changing) ? (
        <>
          <QuickPick recipes={recipes} meal={meal} onPickRecipe={pickRecipe} onSaveNote={(t) => { saveNote(t); setChanging(false); onClose(); }} />
          <div className="text-[11px] font-extrabold uppercase tracking-wide text-stone-500 mb-1.5">Of</div>
          <div className="flex flex-wrap gap-1.5 mb-4">
            {[
              { v: 'compose', label: '🧩 Samenstellen', on: () => setMode('compose') },
              { v: 'leftovers', label: '🍱 Restjes', on: () => setMode('leftovers') },
              { v: 'skip', label: '⏭ Overslaan', on: () => { setMode('skip'); onClose(); } },
              mode === 'empty' && { v: 'ai', label: aiBusy ? '✨ AI is bezig…' : '✨ Laat AI kiezen', on: aiPick },
            ].filter(Boolean).map(o => (
              <button key={o.v} onClick={o.on} disabled={o.v === 'ai' && aiBusy}
                className="h-10 px-3.5 rounded-full bg-white border border-line text-[13px] font-extrabold text-deep active:bg-mint disabled:opacity-50">{o.label}</button>
            ))}
          </div>
          {changing && <Btn variant="ghost" size="sm" onClick={() => setChanging(false)}>Annuleren</Btn>}
        </>
      ) : null}

      {!changing && mode === 'free' && (
        <div className="space-y-3">
          <QuickNote value={slot.notes || ''} onSave={saveNote} />
          {(slot.notes || '').trim() && (
            <Btn variant="secondary" className="w-full" icon="book" onClick={noteToRecipe}>Toch bewaren als recept</Btn>
          )}
        </div>
      )}

      {!changing && mode === 'compose' && (
        <div className="space-y-2.5">
          <p className="text-xs text-stone-500 -mt-1 mb-1">Kies per onderdeel een recept. Leeg laten mag — de AI kan het aanvullen.</p>
          {COMPOSE_ROWS.map(row => (
            <ComposeRow key={row.key} row={row} ids={rowIds(row.key)} recipes={recipes} recipesById={recipesById}
              open={openRow === row.key} onToggle={() => setOpenRow(openRow === row.key ? null : row.key)}
              onChange={(ids) => setRowIds(row.key, ids)} onOpenRecipe={onOpenRecipe} onCreate={onCreateRecipe} />
          ))}
        </div>
      )}

      {!changing && mode === 'recipe' && (
        <div className="space-y-3">
          {main ? (
            <Card className="p-3.5">
              <div className="flex items-start gap-3">
                <div className="w-11 h-11 rounded-xl bg-mist flex items-center justify-center text-xl">{catMeta(main.category).emoji}</div>
                <div className="flex-1 min-w-0">
                  <div className="font-extrabold text-ink leading-snug">{main.title}</div>
                  <div className="flex items-center gap-2 mt-1"><Stars value={main.stars} />{main.carbsPerPortion != null && <span className="text-[11px] font-bold text-stone-400">{fmtAmount(main.carbsPerPortion)} g koolh./pers.</span>}</div>
                </div>
                <Btn variant="soft" size="sm" icon="book" onClick={() => onOpenRecipe(main.id)}>Bekijk</Btn>
              </div>
            </Card>
          ) : (
            <Card className="p-3.5 text-sm font-bold text-stone-500">{catMeta(slot.category).emoji} {catMeta(slot.category).label} — nog geen recept. Tik op "Iets anders kiezen" of laat de AI kiezen.</Card>
          )}
          <ComposeRow row={{ key: 'Erbij', label: 'Erbij (groenten, saus, …)', emoji: '➕', categories: COMPONENT_CATEGORIES }}
            ids={slot.componentIds || []} recipes={recipes} recipesById={recipesById}
            open={openRow === 'Erbij'} onToggle={() => setOpenRow(openRow === 'Erbij' ? null : 'Erbij')}
            onChange={(ids) => onChange({ componentIds: ids })} onOpenRecipe={onOpenRecipe} onCreate={onCreateRecipe} />
        </div>
      )}

      {!changing && mode === 'leftovers' && slot.leftoverFrom && (
        <Card className="p-3.5 mb-3 flex items-center gap-3">
          <span className="text-2xl">🍲</span>
          <div className="flex-1 min-w-0">
            <div className="text-sm font-extrabold text-deep">Restjes van {slotLabel(slot.leftoverFrom)}</div>
            <div className="text-xs text-stone-500">Daar wordt dubbel gekookt.</div>
          </div>
          <Btn variant="secondary" size="sm" onClick={onUndoDouble}>Opheffen</Btn>
        </Card>
      )}
      {!changing && mode === 'leftovers' && <RestjesBlock slot={slot} onChange={onChange} />}
      {!changing && mode === 'skip' && <div className="text-center text-sm text-stone-500 py-6">⏭ Geen maaltijd gepland — hiervoor wordt niets ingekocht.</div>}
      {!changing && mode !== 'empty' && (
        <button onClick={() => setChanging(true)} className="w-full mt-3 flex items-center justify-center gap-1.5 rounded-2xl border border-line bg-white py-2.5 text-[13px] font-extrabold text-forest active:bg-mist">
          <Icon name="refresh" size={15} />Iets anders kiezen
        </button>
      )}

      {!changing && (mode === 'compose' || mode === 'recipe') && slotRecipes(slot, recipesById).length > 0 && (() => {
        const hits = restrictionHits(slotRecipes(slot, recipesById), members);
        return (
          <div className="mt-5 space-y-3">
            {hits.length > 0 && (
              <div className="text-xs font-bold rounded-2xl px-3.5 py-2.5 bg-amber-50 border border-amber-200 text-amber-900">
                {hits.map((h, i) => <div key={i}>{h.kind === 'allergie' ? '⚠️ Allergie' : '🙅 Lust niet'} — {h.who}: {h.term}</div>)}
              </div>
            )}
            <DoubleCookBlock day={day} meal={meal} slot={slot} weekmenu={weekmenu} recipesById={recipesById} onPick={onCookDouble} onUndo={onUndoDouble} />
          </div>
        );
      })()}

      {!changing && (mode === 'compose' || mode === 'recipe') && (
        <div className="mt-5 space-y-3">
          {carbs != null &&<div className="text-center text-xs font-bold text-stone-400">≈ {Math.round(carbs)} g koolhydraten voor {slot.persons} personen</div>}
          <Btn variant="secondary" className="w-full" icon="sparkles" disabled={aiBusy} onClick={onAiFill}>
            {aiBusy ? 'AI is bezig…' : mode === 'compose' ? (slot.componentIds.length ? 'Vul ontbrekende onderdelen aan met AI' : 'Laat AI dit bord samenstellen') : (main ? '✨ Laat AI iets anders kiezen' : `Laat AI een ${slot.category.toLowerCase()} kiezen`)}
          </Btn>
        </div>
      )}
    </Sheet>
  );
}

function RestjesBlock({ slot, onChange }) {
  const [input, setInput] = useState(() => (slot.notes || '').split('\n💡')[0].replace(/^Restjes: /, ''));
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const idea = (slot.notes || '').includes('\n💡') ? slot.notes.split('\n💡')[1].trim() : '';

  function save(text, ideaText) {
    const base = text.trim() ? `Restjes: ${text.trim()}` : '';
    onChange({ notes: base + (ideaText ? `\n💡 ${ideaText}` : '') });
  }
  async function askAi() {
    if (!input.trim()) return;
    setLoading(true); setError('');
    try {
      const data = await invokeAi({ task: 'restjes_idea', ingredients: input.split(',').map(s => s.trim()).filter(Boolean) });
      save(input, `${data.title ? data.title + ' — ' : ''}${data.idea || ''}`);
    } catch (e) { setError(e.message); } finally { setLoading(false); }
  }
  return (
    <div className="space-y-3">
      <Field label="Welke restjes heb je?" hint="Geen nieuwe boodschappen nodig voor deze maaltijd.">
        <input value={input} onChange={(e) => setInput(e.target.value)} onBlur={() => save(input, idea)}
          onKeyDown={(e) => { if (e.key === 'Enter') askAi(); }} placeholder="bv. kip, broccoli, halve courgette" className={inputCls} />
      </Field>
      <Btn variant="secondary" className="w-full" icon="sparkles" disabled={loading || !input.trim()} onClick={askAi}>{loading ? 'Even denken…' : 'Wat kan ik hiermee maken?'}</Btn>
      {error && <div className="text-xs text-red-600 bg-red-50 border border-red-200 rounded-xl px-3 py-2">{error}</div>}
      {idea && <div className="text-sm text-deep bg-mist border border-mint rounded-2xl px-4 py-3">💡 {idea}</div>}
    </div>
  );
}

// Items per afdeling groeperen in de volgorde van de winkel.
function groupByAisle(items, order, aisleOf = (i) => i.aisle) {
  const groups = order.map(a => ({ aisle: a, items: [] }));
  const idx = {}; order.forEach((a, i) => { idx[a] = i; });
  items.forEach(i => { const a = aisleOf(i); const g = groups[idx[a] != null ? idx[a] : idx['Overig']]; g.items.push(i); });
  return groups.filter(g => g.items.length);
}

// Lijst — vult zichzelf in vanuit de voorraad:
//   "Controleer even" = enkel twijfelgevallen · "Te kopen" per winkel (hoofdwinkel als standaard) · "In huis" ingeklapt
// Afvinken gebeurt in Winkelen.
function ShoppingPage({ nav, items, stores, storeAisles, online, pendingOps, onSetState, onBulkState, onAssignStore, onAssignAisle, onRemoveItem,
  onAddExtra, onNewRound, onGoShop, showToast }) {
  const [extraName, setExtraName] = useState('');
  const [editItem, setEditItem] = useState(null);
  const [expanded, setExpanded] = useState(null);
  const [open, setOpen] = useState({});

  const check = items.filter(i => !i.state);
  const basket = items.filter(i => i.state === 'buy');
  const have = items.filter(i => i.state === 'have');
  const bought = items.filter(i => i.state === 'cart');
  const visibleAll = items.filter(i => i.state !== 'hidden');

  const byStore = {};
  basket.forEach(i => { const k = i.store && stores.includes(i.store) ? i.store : '__none__'; (byStore[k] = byStore[k] || []).push(i); });
  const storeKeys = [...stores.filter(s => byStore[s]), ...(byStore.__none__ ? ['__none__'] : [])];
  const sortedFor = (s) => {
    const order = aisleOrderFor(s === '__none__' ? '' : s, storeAisles);
    const ai = (i) => { const k = order.indexOf(s === '__none__' ? i.baseAisle : i.aisleFor(s)); return k < 0 ? 999 : k; };
    return [...byStore[s]].sort((a, b) => ai(a) - ai(b) || a.name.localeCompare(b.name));
  };

  function addExtra() { if (onAddExtra(extraName, '')) setExtraName(''); }
  function choose(i, st, msg) {
    onSetState(i, st);
    if (msg) showToast(msg, { label: 'Ongedaan', onClick: () => onSetState(i, i.auto ? null : i.state) });
  }
  function clearAll() {
    if (!visibleAll.length) return;
    onBulkState(visibleAll, 'hidden');
  }

  async function share() {
    const lines = [`🛒 Boodschappen — week ${isoWeekNumber(nav.weekStart)}`];
    storeKeys.forEach(s => {
      lines.push('', `*${s === '__none__' ? 'Zonder winkel' : s}*`);
      sortedFor(s).forEach(i => lines.push(`☐ ${i.name}${i.kind === 'recipe' || i.kind === 'free' ? ' — ' + fmtShopAmount(i) : ''}`));
    });
    const text = lines.join('\n');
    try {
      if (navigator.share) await navigator.share({ text });
      else { await navigator.clipboard.writeText(text); showToast('Lijst gekopieerd — plak hem in WhatsApp of een bericht'); }
    } catch (e) { /* delen geannuleerd */ }
  }

  const sub = (i) => {
    const s = i.kind === 'extra' ? 'zelf toegevoegd' : i.kind === 'staple' ? 'vaste boodschap' : fmtShopAmount(i);
    const uses = (i.kind === 'recipe' || i.kind === 'free') && i.uses && i.uses.length ? ` · ${i.uses.join(', ')}` : '';
    return <>{i.isExtra ? <b className="text-amber-700">extra erbij · </b> : null}{s}{uses}{i.autoNote ? <span className="text-leaf font-bold"> · {i.autoNote}</span> : null}</>;
  };
  const pill = 'h-10 px-3 rounded-xl text-[13px] font-black flex items-center gap-1 active:scale-95 transition shrink-0';

  const StoreChips = ({ i }) => (
    <div className="flex flex-wrap gap-1.5 pt-2">
      {stores.map(s => (
        <button key={s} onClick={() => { onAssignStore(i, s); setExpanded(null); }} aria-label={`${i.name} in ${s}`}
          className={cx('h-9 px-3 rounded-xl text-[13px] font-extrabold border active:scale-95 transition', i.store === s ? 'bg-forest text-white border-forest' : 'bg-white text-deep border-line')}>{s}</button>
      ))}
      <button onClick={() => { setEditItem(i); setExpanded(null); }} className="h-9 px-2 text-[12px] font-extrabold text-stone-500">Afdeling: {i.aisle} ›</button>
    </div>
  );

  return (
    <div>
      <PageHeader eyebrow={`Week ${isoWeekNumber(nav.weekStart)} · ${basket.length} te kopen`} title="Lijst"
        right={<IconBtn name="share" onClick={share} title="Delen" className="bg-white border border-line w-11 h-11" />} />

      <Card className="p-2 mb-3 flex gap-1.5">
        <input value={extraName} onChange={(e) => setExtraName(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') addExtra(); }}
          placeholder="Iets toevoegen, bv. wc-papier" aria-label="Iets toevoegen aan de lijst"
          className="flex-1 min-w-0 bg-transparent px-2 py-2.5 text-base placeholder:text-stone-400 border-0 focus:shadow-none" />
        <button onClick={addExtra} aria-label="Toevoegen" className="w-11 h-11 rounded-xl bg-forest text-white flex items-center justify-center"><Icon name="plus" /></button>
      </Card>

      {(!online || pendingOps > 0) && <div className="text-[12px] font-bold text-amber-800 mb-3 px-1">{online ? '⏳ Wijzigingen worden verstuurd…' : '📴 Offline — wordt later gesynchroniseerd'}</div>}
      {visibleAll.length === 0 && <EmptyState emoji="🧺" title="Je lijst is leeg" text="Plan maaltijden in de week — wat je nodig hebt en niet in de voorraad staat, komt hier vanzelf." />}

      <div className="space-y-3">
        {check.length > 0 && (
          <Card className="overflow-hidden border-amber-300">
            <div className="px-4 py-3 bg-amber-50 flex items-center justify-between gap-2">
              <span className="text-[15px] font-black text-amber-900">Controleer even ({check.length})</span>
              {check.length > 1 && <button onClick={() => onBulkState(check, 'buy')} className="text-[12px] font-extrabold text-forest bg-white rounded-full px-3 py-1.5 border border-line">Alles kopen</button>}
            </div>
            <div className="divide-y divide-line/70">
              {check.map(i => (
                <div key={i.key} className="flex items-center gap-2 px-3.5 py-2.5">
                  <div className="flex-1 min-w-0">
                    <div className="text-[15px] font-bold text-ink truncate">{i.name}</div>
                    <div className="text-[12px] text-stone-500 truncate">{sub(i)}</div>
                  </div>
                  <button onClick={() => choose(i, 'have')} aria-label={`${i.name}: heb ik`} className={cx(pill, 'bg-cream border border-line text-stone-600')}>🏠 Heb ik</button>
                  <button onClick={() => choose(i, 'buy')} aria-label={`${i.name}: kopen`} className={cx(pill, 'bg-forest text-white')}>🛒 Kopen</button>
                </div>
              ))}
            </div>
          </Card>
        )}

        {basket.length > 0 && (
          <Card className="overflow-hidden">
            <div className="px-4 py-3 bg-mist flex items-center justify-between gap-2">
              <span className="text-[15px] font-black text-deep">Te kopen ({basket.length})</span>
              <button onClick={onGoShop} className="text-[12px] font-extrabold text-white bg-forest rounded-full px-3 py-1.5">🛒 Winkelen ›</button>
            </div>
            {storeKeys.map(s => (
              <div key={s} className="border-t border-line/70 first:border-t-0">
                <div className="px-4 pt-2.5 pb-0.5 flex items-center justify-between">
                  <span className="text-[13px] font-black text-deep">{s === '__none__' ? 'Zonder winkel' : `🏪 ${s}`}</span>
                  <span className="text-[12px] font-bold text-stone-500">{byStore[s].length}</span>
                </div>
                <div className="divide-y divide-line/60">
                  {sortedFor(s).map(i => (
                    <div key={i.key} className="px-3.5 py-2">
                      <div className="flex items-center gap-2">
                        <button onClick={() => setExpanded(expanded === i.key ? null : i.key)} aria-label={`${i.name}: winkel kiezen`} className="flex-1 min-w-0 text-left py-0.5">
                          <span className="block text-[15px] font-bold text-ink truncate">{i.name}{i.kind === 'staple' ? ' 📌' : ''}</span>
                          <span className="block text-[12px] text-stone-500 truncate">{sub(i)}</span>
                        </button>
                        <button onClick={() => setExpanded(expanded === i.key ? null : i.key)} aria-label={`Winkel voor ${i.name}`}
                          className="h-9 px-2.5 rounded-xl text-[12px] font-extrabold shrink-0 border bg-white border-line text-forest">{i.store || 'Winkel?'} ▾</button>
                        <button onClick={() => (i.kind === 'extra' ? onRemoveItem(i) : choose(i, 'have', `🏠 ${i.name}: heb ik`))} aria-label={`${i.name}: heb ik al`}
                          className="w-9 h-9 shrink-0 flex items-center justify-center text-stone-400"><Icon name="x" size={16} /></button>
                      </div>
                      {expanded === i.key && <StoreChips i={i} />}
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </Card>
        )}

        {have.length > 0 && (
          <Card className="overflow-hidden">
            <button onClick={() => setOpen({ ...open, have: !open.have })} className="w-full px-4 py-3 flex items-center justify-between text-sm font-extrabold text-stone-600 bg-cream/60">
              <span>🏠 In huis ({have.length})</span><Icon name="down" size={16} className={open.have ? 'rotate-180' : ''} />
            </button>
            {open.have && (
              <div className="divide-y divide-line/70">
                {have.map(i => (
                  <div key={i.key} className="flex items-center gap-3 px-4 py-2.5">
                    <span className="flex-1 min-w-0">
                      <span className="block text-[15px] font-semibold truncate text-stone-600">{i.name}</span>
                      <span className="block text-[12px] text-stone-400 truncate">{i.auto ? (i.autoNote || 'in voorraad') : 'zelf aangeduid'}</span>
                    </span>
                    <button onClick={() => choose(i, 'buy', `🛒 ${i.name} op de lijst`)} className="shrink-0 text-xs font-extrabold text-forest bg-mint rounded-full px-3 py-1.5">Toch kopen</button>
                  </div>
                ))}
              </div>
            )}
          </Card>
        )}

        {bought.length > 0 && (
          <Card className="overflow-hidden">
            <button onClick={() => setOpen({ ...open, cart: !open.cart })} className="w-full px-4 py-3 flex items-center justify-between text-sm font-extrabold text-stone-600 bg-cream/60">
              <span>✓ Afgevinkt in de winkel ({bought.length})</span><Icon name="down" size={16} className={open.cart ? 'rotate-180' : ''} />
            </button>
            {open.cart && (
              <div className="divide-y divide-line/70">
                {bought.map(i => (
                  <div key={i.key} className="flex items-center gap-3 px-4 py-2.5">
                    <span className="flex-1 min-w-0 text-[15px] font-semibold truncate text-stone-400 line-through">{i.name}</span>
                    <button onClick={() => choose(i, 'buy')} className="shrink-0 text-xs font-extrabold text-forest bg-mint rounded-full px-3 py-1.5">Terug</button>
                  </div>
                ))}
              </div>
            )}
          </Card>
        )}
      </div>

      <div className="mt-5 flex flex-wrap gap-2 justify-between items-center px-1">
        {visibleAll.length > 0
          ? <button onClick={clearAll} className="flex items-center gap-1.5 text-[13px] font-extrabold text-stone-600 py-2">🧹 Lijst leegmaken</button>
          : <span />}
        {items.some(i => !i.auto && i.state) && (
          <button onClick={onNewRound} className="flex items-center gap-1.5 text-[13px] font-extrabold text-forest py-2"><Icon name="refresh" size={15} />Opnieuw opbouwen</button>
        )}
      </div>

      {editItem && (
        <ItemEditSheet item={items.find(i => i.key === editItem.key) || editItem} stores={stores} storeAisles={storeAisles}
          onAssignStore={(st) => onAssignStore(editItem, st)} onAssignAisle={(a) => onAssignAisle(editItem, a)}
          onRemove={(editItem.kind === 'extra' || editItem.kind === 'staple') ? () => { onRemoveItem(editItem); setEditItem(null); } : null}
          onClose={() => setEditItem(null)} />
      )}
    </div>
  );
}

function ItemEditSheet({ item, stores, storeAisles, onAssignStore, onAssignAisle, onRemove, onClose }) {
  const aisles = aisleOrderFor(item.store || '', storeAisles);
  return (
    <Sheet title={item.name} subtitle={item.kind === 'recipe' ? 'Wordt onthouden voor volgende weken' : item.kind === 'staple' ? 'Vast item' : 'Los item'} onClose={onClose} z={60}>
      <div className="space-y-4">
        <Field label="Winkel">
          <select value={item.store || ''} onChange={(e) => onAssignStore(e.target.value)} className={inputCls}>
            <option value="">Nog geen winkel</option>
            {stores.map(s => <option key={s} value={s}>{s}</option>)}
          </select>
        </Field>
        <Field label={item.store ? `Afdeling in ${item.store}` : 'Afdeling'}>
          <div className="grid grid-cols-2 gap-1.5">
            {aisles.map(a => (
              <button key={a} onClick={() => onAssignAisle(a)}
                className={cx('rounded-xl border px-2.5 py-2 text-xs font-extrabold text-left', item.aisle === a ? 'bg-forest text-white border-forest' : 'bg-white text-deep border-line')}>{a}</button>
            ))}
          </div>
        </Field>
        {onRemove && <Btn variant="danger" icon="trash" className="w-full" onClick={onRemove}>{item.kind === 'staple' ? 'Deze week niet (vast item uitzetten)' : 'Verwijderen van de lijst'}</Btn>}
        <Btn className="w-full" icon="check" onClick={onClose}>Klaar</Btn>
      </div>
    </Sheet>
  );
}

function AisleEditor({ store, order, isCustom, onChange, onRename, onRemove, onReset }) {
  const [names, setNames] = useState({});
  const [newAisle, setNewAisle] = useState('');
  const move = (i, d) => { const n = [...order]; const j = i + d; if (j < 0 || j >= n.length) return; [n[i], n[j]] = [n[j], n[i]]; onChange(n); };
  const commit = (old) => { const v = names[old]; if (v !== undefined) { if (v.trim() && v.trim() !== old) onRename(old, v.trim()); setNames(({ [old]: _, ...rest }) => rest); } };
  const add = () => {
    const v = newAisle.trim(); if (!v) return;
    if (order.includes(v)) { setNewAisle(''); return; }
    const n = [...order]; const o = n.indexOf('Overig'); n.splice(o >= 0 ? o : n.length, 0, v); onChange(n); setNewAisle('');
  };
  return (
    <div className="space-y-1.5">
      <p className="text-[11px] text-stone-500 px-0.5">Volgorde = hoe je door {store} loopt. Tik op een naam om ze te wijzigen. Splits bv. "Dranken &amp; wijn" in Frisdranken, Water en Alcohol.</p>
      {order.map((a, i) => (
        <div key={a} className="flex items-center gap-1.5 bg-cream rounded-xl pl-2.5 pr-1 py-1">
          <span className="w-5 text-[11px] font-black text-stone-400 shrink-0">{i + 1}</span>
          {a === 'Overig' ? <span className="flex-1 text-xs font-bold text-stone-500 py-2">Overig <span className="font-normal">(vangnet)</span></span> : (
            <input value={names[a] !== undefined ? names[a] : a} onChange={(e) => setNames({ ...names, [a]: e.target.value })} aria-label={`Afdeling ${a}`}
              onBlur={() => commit(a)} onKeyDown={(e) => { if (e.key === 'Enter') e.target.blur(); }}
              className="flex-1 min-w-0 bg-transparent text-xs font-bold text-deep py-2 border-0 focus:shadow-none" />
          )}
          <IconBtn name="up2" size={14} title="Hoger" onClick={() => move(i, -1)} className="w-8 h-8 shrink-0" />
          <IconBtn name="down" size={14} title="Lager" onClick={() => move(i, 1)} className="w-8 h-8 shrink-0" />
          {a !== 'Overig' && <IconBtn name="trash" size={13} title={`${a} verwijderen`} className="w-8 h-8 shrink-0 text-stone-400"
            onClick={() => onRemove(a)} />}
        </div>
      ))}
      <div className="flex gap-1.5 pt-1">
        <input value={newAisle} onChange={(e) => setNewAisle(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') add(); }}
          placeholder="Nieuwe afdeling, bv. Water" aria-label={`Nieuwe afdeling voor ${store}`} className={inputCls} />
        <Btn onClick={add} className="shrink-0 whitespace-nowrap">Voeg toe</Btn>
      </div>
      {isCustom && <button onClick={() => { if (window.confirm(`Afdelingen van ${store} terugzetten naar de standaard?`)) onReset(); }}
        className="text-[11px] font-extrabold text-stone-500 underline px-0.5 py-1">Standaardafdelingen herstellen</button>}
    </div>
  );
}

function StoresSheet({ stores, storeAisles, mainStore, onSetMain, onAdd, onRename, onRemove, onSetAisleOrder, onRenameAisle, onRemoveAisle, onResetAisles, onClose }) {
  const main = stores.includes(mainStore) ? mainStore : stores[0];
  const [names, setNames] = useState({});
  const [newStore, setNewStore] = useState('');
  const [openAisles, setOpenAisles] = useState(null);
  const commit = (old) => { const v = names[old]; if (v !== undefined && v.trim() && v.trim() !== old) onRename(old, v.trim()); };
  const add = () => { if (newStore.trim() && !stores.includes(newStore.trim())) { onAdd(newStore.trim()); setNewStore(''); } };
  return (
    <Sheet title="Winkels & afdelingen" subtitle="Hoofdwinkel = waar producten zonder winkel naartoe gaan. Per winkel: eigen afdelingen in de volgorde van je looproute" onClose={onClose}>
      <div className="space-y-2.5">
        {stores.map(s => (
          <Card key={s} className="p-2.5">
            <div className="flex items-center gap-2">
              <input value={names[s] !== undefined ? names[s] : s} onChange={(e) => setNames({ ...names, [s]: e.target.value })}
                onBlur={() => commit(s)} onKeyDown={(e) => { if (e.key === 'Enter') e.target.blur(); }} className={inputCls} />
              <IconBtn name="trash" title="Verwijderen" onClick={() => { if (window.confirm(`Winkel "${s}" verwijderen?`)) onRemove(s); }} />
            </div>
            <button onClick={() => onSetMain(s)} aria-pressed={main === s}
              className={cx('mt-2 text-[12px] font-extrabold rounded-full px-3 py-1.5', main === s ? 'bg-forest text-white' : 'bg-cream text-stone-600 border border-line')}>
              {main === s ? '⭐ Hoofdwinkel' : '☆ Maak hoofdwinkel'}
            </button>
            <button onClick={() => setOpenAisles(openAisles === s ? null : s)} className="mt-2 w-full flex items-center justify-between px-1 text-xs font-extrabold text-forest">
              <span>Afdelingen ({aisleOrderFor(s, storeAisles).length}){storeAisles[s] && storeAisles[s].some(a => !AISLES.includes(a)) ? ' · eigen indeling' : ''}</span><Icon name="down" size={14} className={openAisles === s ? 'rotate-180' : ''} />
            </button>
            {openAisles === s && <div className="mt-2"><AisleEditor store={s} order={aisleOrderFor(s, storeAisles)} isCustom={!!storeAisles[s]}
              onChange={(o) => onSetAisleOrder(s, o)} onRename={(o, n) => onRenameAisle(s, o, n)} onRemove={(a) => onRemoveAisle(s, a)} onReset={() => onResetAisles(s)} /></div>}
          </Card>
        ))}
        <div className="flex gap-2 pt-2">
          <input value={newStore} onChange={(e) => setNewStore(e.target.value)} placeholder="Nieuwe winkel…" className={inputCls}
            onKeyDown={(e) => { if (e.key === 'Enter') add(); }} />
          <Btn onClick={add}>Voeg toe</Btn>
        </div>
      </div>
    </Sheet>
  );
}

function StaplesSheet({ staples, stores, onAdd, onUpdate, onDelete, onClose }) {
  const [name, setName] = useState('');
  const [store, setStore] = useState('');
  const add = () => { if (!name.trim()) return; onAdd(name, store); setName(''); };
  return (
    <Sheet title="📌 Vaste items" subtitle="Komen elke week vanzelf op de boodschappenlijst" onClose={onClose}>
      <div className="space-y-3">
        <Card className="p-2 flex gap-1.5">
          <input value={name} onChange={(e) => setName(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') add(); }}
            placeholder="bv. melk, brood, wc-papier" className="flex-1 min-w-0 bg-transparent px-2 py-2 text-sm placeholder:text-stone-300 border-0 focus:shadow-none" />
          <select value={store} onChange={(e) => setStore(e.target.value)} className="bg-mist rounded-xl px-2 text-xs font-bold text-forest border-0 max-w-[6.5rem]">
            <option value="">Winkel…</option>
            {stores.map(s => <option key={s} value={s}>{s}</option>)}
          </select>
          <button onClick={add} className="w-10 rounded-xl bg-forest text-white flex items-center justify-center"><Icon name="plus" /></button>
        </Card>
        {staples.length === 0 && <div className="text-center text-sm text-stone-400 py-4">Nog geen vaste items.</div>}
        <div className="space-y-1.5">
          {staples.map(s => (
            <div key={s.id} className="flex items-center gap-2 bg-white border border-line rounded-xl px-2.5 py-2">
              <button onClick={() => onUpdate(s.id, { active: !s.active })} title={s.active ? 'Actief' : 'Uit'}
                className={cx('w-10 h-6 rounded-full relative transition shrink-0', s.active ? 'bg-sage' : 'bg-stone-200')}>
                <span className={cx('absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition', s.active ? 'left-[18px]' : 'left-0.5')} />
              </button>
              <span className={cx('flex-1 min-w-0 truncate text-sm font-bold', s.active ? 'text-ink' : 'text-stone-400')}>{s.name}</span>
              <select value={s.store || ''} onChange={(e) => onUpdate(s.id, { store: e.target.value || null })} className="text-xs font-bold bg-mist text-forest rounded-lg px-1.5 py-1.5 border-0 max-w-[6rem]">
                <option value="">Winkel…</option>
                {stores.map(st => <option key={st} value={st}>{st}</option>)}
              </select>
              <IconBtn name="trash" size={14} title="Verwijderen" onClick={() => { if (window.confirm(`"${s.name}" verwijderen uit vaste items?`)) onDelete(s.id); }} className="w-8 h-8 text-stone-300" />
            </div>
          ))}
        </div>
      </div>
    </Sheet>
  );
}

// Winkelen: los van het lijstje maken. Kies je winkel → afvinklijst zoals Google Keep → afronden = in de kast.
function WinkelPage({ items, stores, onStoreMode, onGoList }) {
  const basket = items.filter(i => i.state === 'buy');
  const done = items.filter(i => i.state === 'cart');
  const forStore = (s) => basket.filter(i => i.store === s || !i.store).length;
  const shops = stores.filter(s => basket.some(i => i.store === s));
  const noStore = basket.filter(i => !i.store).length;
  return (
    <div>
      <PageHeader eyebrow={`${basket.length} te halen${done.length ? ` · ${done.length} afgevinkt` : ''}`} title="Winkelen" />
      {basket.length === 0 && done.length === 0 ? (
        <EmptyState emoji="🛒" title="Je winkelmandje is leeg" text="Maak eerst je lijst: kies per product 🏠 Kast of 🛒 Kopen." />
      ) : (
        <div className="space-y-2.5">
          <div className="text-[13px] font-bold text-stone-600 px-1">In welke winkel ben je?</div>
          {shops.map(s => (
            <button key={s} onClick={() => onStoreMode(s)}
              className="w-full flex items-center gap-3 rounded-2xl bg-white border border-line shadow-card px-4 py-4 text-left active:scale-[.99] transition">
              <span className="w-11 h-11 rounded-xl bg-mint text-forest flex items-center justify-center shrink-0"><Icon name="cart" size={21} /></span>
              <span className="flex-1 text-[17px] font-black text-deep">{s}</span>
              <span className="text-[13px] font-extrabold text-stone-500">{forStore(s)} te halen</span>
              <Icon name="right" size={18} className="text-stone-300" />
            </button>
          ))}
          <button onClick={() => onStoreMode('__all__')}
            className="w-full flex items-center gap-3 rounded-2xl border-2 border-dashed border-line px-4 py-4 text-left active:bg-mist">
            <span className="flex-1 text-[15px] font-extrabold text-forest">Alles in één lijst</span>
            <span className="text-[13px] font-extrabold text-stone-500">{basket.length + done.length}</span>
          </button>
          {noStore > 0 && <p className="text-[12px] text-amber-800 px-1">{noStore === 1 ? '1 item heeft' : `${noStore} items hebben`} nog geen winkel — dat zie je in elke winkel.</p>}
          {done.length > 0 && <p className="text-[12px] text-stone-500 px-1">{done.length} items afgevinkt maar nog niet afgerond — open je winkel en tik op ✓ Afronden.</p>}
          <button onClick={onGoList} className="w-full text-center text-[13px] font-extrabold text-forest py-3">← Lijst aanpassen</button>
        </div>
      )}
    </div>
  );
}

// Winkelmodus — zoals Google Keep: grote vinkzones, afgevinkt zakt naar "In de kar".
function StoreMode({ storeKey, weekLabel, items, storeAisles, online, pendingOps, onToggle, onAddExtra, onFinish, onClose }) {
  useBackClose(true, onClose);
  const [showCart, setShowCart] = useState(true);
  const [finishing, setFinishing] = useState(false);
  async function finish() {
    if (!cart.length) { onClose(); return; }
    setFinishing(true);
    try { await onFinish(); onClose(); } finally { setFinishing(false); }
  }
  const [name, setName] = useState('');
  const wakeSupported = useWakeLock(true);
  useEffect(() => {
    const prev = document.body.style.overflow; document.body.style.overflow = 'hidden';
    return () => { document.body.style.overflow = prev; };
  }, []);
  const all = storeKey === '__all__';
  const mine = items.filter(i => (i.state === 'buy' || i.state === 'cart') && (all || i.store === storeKey || !i.store));
  const todo = mine.filter(i => i.state !== 'cart');
  const cart = mine.filter(i => i.state === 'cart');
  const order = aisleOrderFor(all ? '' : storeKey, storeAisles);
  function add() { if (onAddExtra(name)) setName(''); }

  return (
    <Portal>
      <div className="fixed inset-0 bg-cream flex flex-col" style={{ zIndex: 70 }}>
        <div className="pt-safe bg-forest text-white">
          <div className="max-w-lg mx-auto px-4 py-3 flex items-center gap-3">
            <div className="flex-1 min-w-0">
              <div className="text-[11px] font-bold text-white/70">{weekLabel} · {cart.length} van {mine.length} in de kar</div>
              <div className="text-xl font-black truncate">🛒 {all ? 'Alle winkels' : storeKey}</div>
            </div>
            <button onClick={onClose} aria-label="Sluiten (afvinkingen blijven bewaard)" className="w-10 h-10 rounded-xl bg-white/10 text-white flex items-center justify-center"><Icon name="x" size={18} /></button>
            <button onClick={finish} disabled={finishing} className="rounded-xl bg-white text-forest font-black text-sm px-3.5 py-2 disabled:opacity-60">{finishing ? '…' : '✓ Afronden'}</button>
          </div>
          <div className="h-1.5 bg-white/15"><div className="h-full bg-mint transition-all" style={{ width: `${mine.length ? (cart.length / mine.length) * 100 : 0}%` }} /></div>
        </div>
        {(!online || pendingOps > 0) && (
          <div className="bg-amber-100 text-amber-900 text-xs font-bold text-center py-1.5">{online ? '⏳ Wijzigingen worden verstuurd…' : '📴 Offline — afvinken werkt, wordt later gesynchroniseerd'}</div>
        )}
        <div className="flex-1 overflow-y-auto">
          <div className="max-w-lg mx-auto px-3 pt-3 pb-safe">
            <div className="flex gap-2 mb-3">
              <input value={name} onChange={(e) => setName(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') add(); }}
                placeholder="Snel iets toevoegen…" className={cx(inputCls, 'py-3 text-base')} />
              <button onClick={add} className="w-12 rounded-xl bg-forest text-white flex items-center justify-center shrink-0"><Icon name="plus" size={20} /></button>
            </div>
            {todo.length === 0 && mine.length > 0 && <div className="text-center py-8"><div className="text-4xl">🎉</div><div className="font-black text-deep mt-2">Alles in de kar!</div></div>}
            {mine.length === 0 && <div className="text-center text-stone-400 py-8 font-bold">Niets te halen in deze winkel.</div>}
            {groupByAisle(todo, order, i => (all ? i.baseAisle : i.aisleFor(storeKey))).map(g => (
              <div key={g.aisle} className="mb-3">
                <div className="px-2 pb-1 text-[11px] font-black uppercase tracking-wider text-sage">{g.aisle}</div>
                <div className="bg-white rounded-2xl border border-line divide-y divide-line/70 overflow-hidden">
                  {g.items.map(i => (
                    <button key={i.key} onClick={() => onToggle(i)} className="w-full flex items-center gap-3.5 px-4 py-3.5 text-left active:bg-mint">
                      <span className="w-7 h-7 rounded-full border-2 border-stone-300 shrink-0" />
                      <span className="flex-1 min-w-0">
                        <span className="block text-[17px] font-bold text-ink leading-snug">{i.name}</span>
                        {(i.kind === 'recipe' || i.kind === 'free' || (all && i.store) || (!all && !i.store)) && (
                          <span className="block text-xs text-stone-400">
                            {(i.kind === 'recipe' || i.kind === 'free') ? fmtShopAmount(i) : ''}{all && i.store ? `${(i.kind === 'recipe' || i.kind === 'free') ? ' · ' : ''}${i.store}` : ''}{!all && !i.store ? `${(i.kind === 'recipe' || i.kind === 'free') ? ' · ' : ''}geen winkel gekozen` : ''}
                          </span>
                        )}
                      </span>
                    </button>
                  ))}
                </div>
              </div>
            ))}
            {cart.length > 0 && (
              <div className="mb-6">
                <button onClick={() => setShowCart(!showCart)} className="w-full flex items-center justify-between px-2 py-2 text-xs font-black text-stone-400">
                  <span>✓ Afgevinkt ({cart.length})</span><Icon name="down" size={16} className={showCart ? 'rotate-180' : ''} />
                </button>
                {showCart && (
                  <div className="bg-white/60 rounded-2xl border border-line divide-y divide-line/70 overflow-hidden">
                    {cart.map(i => (
                      <button key={i.key} onClick={() => onToggle(i)} className="w-full flex items-center gap-3.5 px-4 py-3 text-left active:bg-mist">
                        <span className="w-7 h-7 rounded-full bg-sage text-white flex items-center justify-center shrink-0"><Icon name="check" size={16} stroke={3} /></span>
                        <span className="flex-1 text-[16px] font-semibold text-stone-300 line-through">{i.name}</span>
                      </button>
                    ))}
                  </div>
                )}
              </div>
            )}
            {cart.length > 0 && (
              <button onClick={finish} disabled={finishing} className="w-full mb-6 rounded-2xl bg-forest text-white py-3.5 text-[15px] font-black disabled:opacity-60">
                ✓ Winkelen afronden — {cart.length} items naar de kast
              </button>
            )}
            {!wakeSupported && <div className="text-center text-[11px] text-stone-400 pb-4">Tip: dit toestel ondersteunt "scherm aan houden" niet — zet eventueel de automatische schermvergrendeling even langer.</div>}
          </div>
        </div>
      </div>
    </Portal>
  );
}
