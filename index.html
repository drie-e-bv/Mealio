// =================================================================
// 7. Boodschappen
// =================================================================
function ShoppingPage({ nav, items, stores, itemStoreMap, checkedItems, extraItems, pantryStock, onToggle, onAssign, onAddExtra, onToggleExtra, onRemoveExtra, onAssignExtra, onAddStore, onRenameStore, onRemoveStore, onNewRound, showToast }) {
  const [extraName, setExtraName] = useState('');
  const [extraStore, setExtraStore] = useState('');
  const [showStores, setShowStores] = useState(false);
  const [openDone, setOpenDone] = useState({});
  const stockNorm = pantryStock.filter(p => p.inStock).map(p => normalize(p.name));

  const all = [
    ...items.map(i => ({ ...i, checked: !!checkedItems[i.key], store: itemStoreMap[i.key], isExtra: false, inKast: stockNorm.length > 0 && ingredientMatches(i.name, stockNorm) })),
    ...extraItems.map(it => ({ key: `extra:${it.id}`, extraId: it.id, name: it.name, unit: '', hasAmount: false, checked: !!it.checked, store: it.store, isExtra: true, uses: [] })),
  ];
  const groups = {};
  [...stores, '__none__'].forEach(s => { groups[s] = []; });
  all.forEach(i => { (i.store && groups[i.store] ? groups[i.store] : groups.__none__).push(i); });
  Object.values(groups).forEach(list => list.sort((a, b) => a.name.localeCompare(b.name)));
  const total = all.length;
  const done = all.filter(i => i.checked).length;

  function toggle(i) { i.isExtra ? onToggleExtra(i.extraId) : onToggle(i.key); }
  function assign(i, store) { i.isExtra ? onAssignExtra(i.extraId, store) : onAssign(i.key, store); }
  function addExtra() { if (!extraName.trim()) return; onAddExtra(extraName, extraStore); setExtraName(''); }

  async function share() {
    const lines = [`🛒 Boodschappen — week ${isoWeekNumber(nav.weekStart)}`];
    [...stores, '__none__'].forEach(s => {
      const todo = groups[s].filter(i => !i.checked);
      if (!todo.length) return;
      lines.push('', `*${s === '__none__' ? 'Overige' : s}*`);
      todo.forEach(i => lines.push(`☐ ${i.name}${!i.isExtra ? ' — ' + (i.hasAmount ? `${fmtAmount(i.amount)} ${i.unit}` : (i.unit || 'naar smaak')) : ''}`));
    });
    const text = lines.join('\n');
    try {
      if (navigator.share) await navigator.share({ text });
      else { await navigator.clipboard.writeText(text); showToast('Lijst gekopieerd — plak hem in WhatsApp of een bericht'); }
    } catch (e) { /* delen geannuleerd */ }
  }

  return (
    <div>
      <PageHeader eyebrow={`Week ${isoWeekNumber(nav.weekStart)} · ${fmtWeekRange(nav.weekStart)}`} title="Boodschappen"
        right={<><IconBtn name="share" onClick={share} title="Delen" className="bg-white border border-line" /><IconBtn name="settings" onClick={() => setShowStores(true)} title="Winkels" className="bg-white border border-line" /></>} />

      {total > 0 && (
        <Card className="p-4 mb-3">
          <div className="flex items-center justify-between mb-2">
            <span className="text-sm font-extrabold text-deep">{done} van {total} in je mandje</span>
            <button onClick={onNewRound} className="text-xs font-extrabold text-sage flex items-center gap-1"><Icon name="refresh" size={13} />Nieuwe ronde</button>
          </div>
          <div className="h-2 rounded-full bg-mist overflow-hidden"><div className="h-full bg-sage rounded-full transition-all" style={{ width: `${total ? (done / total) * 100 : 0}%` }} /></div>
        </Card>
      )}

      <Card className="p-2 mb-4 flex gap-1.5">
        <input value={extraName} onChange={(e) => setExtraName(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') addExtra(); }}
          placeholder="Iets extra? bv. wc-papier" className="flex-1 min-w-0 bg-transparent px-2 py-2 text-sm placeholder:text-stone-300 border-0 focus:shadow-none" />
        <select value={extraStore} onChange={(e) => setExtraStore(e.target.value)} className="bg-mist rounded-xl px-2 text-xs font-bold text-forest border-0 max-w-[6.5rem]">
          <option value="">Winkel…</option>
          {stores.map(s => <option key={s} value={s}>{s}</option>)}
        </select>
        <button onClick={addExtra} className="w-10 rounded-xl bg-forest text-white flex items-center justify-center"><Icon name="plus" /></button>
      </Card>

      {total === 0 && <EmptyState emoji="🧺" title="Je lijst is nog leeg" text="Plan maaltijden in de Planner — de ingrediënten verschijnen hier vanzelf, per winkel gegroepeerd." />}

      <div className="space-y-3">
        {[...stores, '__none__'].map(s => {
          const list = groups[s];
          if (!list.length) return null;
          const todo = list.filter(i => !i.checked);
          const doneList = list.filter(i => i.checked);
          const isNone = s === '__none__';
          return (
            <Card key={s} className="overflow-hidden">
              <div className={cx('px-4 py-2.5 flex items-center justify-between', isNone ? 'bg-amber-50' : 'bg-mist')}>
                <span className="text-sm font-black text-deep">{isNone ? 'Nog geen winkel' : s}</span>
                <span className="text-[11px] font-bold text-stone-500">{todo.length ? `${todo.length} te halen` : 'alles binnen ✓'}</span>
              </div>
              <div className="divide-y divide-line/70">
                {todo.map(i => <ShoppingRow key={i.key} item={i} stores={stores} showAssign={isNone} onToggle={() => toggle(i)} onAssign={(st) => assign(i, st)} onRemove={() => onRemoveExtra(i.extraId)} />)}
              </div>
              {doneList.length > 0 && (
                <>
                  <button onClick={() => setOpenDone({ ...openDone, [s]: !openDone[s] })} className="w-full px-4 py-2 flex items-center justify-between text-[11px] font-extrabold text-stone-400 border-t border-line/70 bg-cream/60">
                    <span>In je mandje ({doneList.length})</span><Icon name="down" size={14} className={openDone[s] ? 'rotate-180' : ''} />
                  </button>
                  {openDone[s] && <div className="divide-y divide-line/70">{doneList.map(i => <ShoppingRow key={i.key} item={i} stores={stores} onToggle={() => toggle(i)} onRemove={() => onRemoveExtra(i.extraId)} />)}</div>}
                </>
              )}
            </Card>
          );
        })}
      </div>

      {showStores && <StoresSheet stores={stores} onAdd={onAddStore} onRename={onRenameStore} onRemove={onRemoveStore} onClose={() => setShowStores(false)} />}
    </div>
  );
}

function ShoppingRow({ item, stores, showAssign, onToggle, onAssign, onRemove }) {
  return (
    <div className="px-3 py-2.5 flex items-center gap-3">
      <button onClick={onToggle} aria-label="Afvinken"
        className={cx('w-6 h-6 shrink-0 rounded-full border-2 flex items-center justify-center transition', item.checked ? 'bg-sage border-sage text-white' : 'border-stone-300')}>
        {item.checked && <Icon name="check" size={14} stroke={3} />}
      </button>
      <button onClick={onToggle} className="flex-1 min-w-0 text-left">
        <div className={cx('text-sm font-bold', item.checked ? 'line-through text-stone-300' : 'text-ink')}>
          {item.name}
          {item.inKast && !item.checked && <span className="ml-1.5 text-[10px] font-black text-leaf bg-mint rounded-full px-1.5 py-0.5 align-middle">🥫 in kast?</span>}
        </div>
        <div className="text-[11px] text-stone-400 truncate">
          {item.isExtra ? 'los item' : (item.hasAmount ? `${fmtAmount(item.amount)} ${item.unit}` : (item.unit || 'naar smaak'))}
          {!item.isExtra && item.uses && item.uses.length ? ` · ${item.uses.join(', ')}` : ''}
        </div>
      </button>
      {showAssign && !item.checked && (
        <select onChange={(e) => onAssign(e.target.value)} defaultValue="" className="text-xs font-bold bg-amber-50 text-amber-800 rounded-lg px-1.5 py-1.5 border-0 max-w-[6rem]">
          <option value="" disabled>Winkel…</option>
          {stores.map(s => <option key={s} value={s}>{s}</option>)}
        </select>
      )}
      {item.isExtra && <button onClick={onRemove} className="text-stone-300 p-1" aria-label="Verwijderen"><Icon name="x" size={16} /></button>}
    </div>
  );
}

function StoresSheet({ stores, onAdd, onRename, onRemove, onClose }) {
  const [names, setNames] = useState({});
  const [newStore, setNewStore] = useState('');
  const commit = (old) => { const v = names[old]; if (v !== undefined && v.trim() && v.trim() !== old) onRename(old, v.trim()); };
  return (
    <Sheet title="Winkels" subtitle="Hernoem, verwijder of voeg winkels toe" onClose={onClose}>
      <div className="space-y-2">
        {stores.map(s => (
          <div key={s} className="flex items-center gap-2">
            <input value={names[s] !== undefined ? names[s] : s} onChange={(e) => setNames({ ...names, [s]: e.target.value })}
              onBlur={() => commit(s)} onKeyDown={(e) => { if (e.key === 'Enter') e.target.blur(); }} className={inputCls} />
            <IconBtn name="trash" title="Verwijderen" onClick={() => { if (window.confirm(`Winkel "${s}" verwijderen?`)) onRemove(s); }} />
          </div>
        ))}
        <div className="flex gap-2 pt-2">
          <input value={newStore} onChange={(e) => setNewStore(e.target.value)} placeholder="Nieuwe winkel…" className={inputCls}
            onKeyDown={(e) => { if (e.key === 'Enter' && newStore.trim() && !stores.includes(newStore.trim())) { onAdd(newStore.trim()); setNewStore(''); } }} />
          <Btn onClick={() => { if (newStore.trim() && !stores.includes(newStore.trim())) { onAdd(newStore.trim()); setNewStore(''); } }}>Voeg toe</Btn>
        </div>
      </div>
    </Sheet>
  );
}

// Het volledige receptformulier — gedeeld door "nieuw" en "bewerken".

  const updStep = (i, v) => set({ steps: draft.steps.map((x, k) => k === i ? v : x) });
  const fileRef = useRef(null);
  async function pickPhoto(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try { set({ image: await resizeImageFile(file) }); } catch (err) { window.alert(err.message); }
  }
  return (
    <div className="space-y-4">
      <Field label="Foto">
        <input ref={fileRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={pickPhoto} />
        {draft.image ? (
          <div className="relative rounded-2xl overflow-hidden border border-line">

            <div className="absolute top-2 right-2 flex gap-1.5">
              <IconBtn name="camera" title="Andere foto" onClick={() => fileRef.current.click()} className="bg-white/90 backdrop-blur w-9 h-9" />
              <IconBtn name="x" title="Foto verwijderen" onClick={() => set({ image: '' })} className="bg-white/90 backdrop-blur w-9 h-9 text-red-500" />

      <Field label="Categorie" hint={isComponent(draft.category) ? 'Onderdeel: kies je in de planner via 🧩 Samenstellen.' : null}>

      </Field>

        <Field label="Voor # personen"><input type="number" min="1" value={draft.basePortions} onChange={(e) => set({ basePortions: e.target.value })} className={inputCls} /></Field>
        <Field label="Koolh. per pers. (g)"><input type="number" min="0" value={draft.carbsPerPortion} onChange={(e) => set({ carbsPerPortion: e.target.value })} placeholder="optioneel" className={inputCls} /></Field>

            <div key={i} className="flex gap-1.5">

              <input value={ing.amount} onChange={(e) => updIng(i, { amount: e.target.value })} placeholder="#" type="number" inputMode="decimal" className={cx(inputBase, 'w-[4.5rem] shrink-0 py-2 px-2.5')} />
              <input value={ing.unit} onChange={(e) => updIng(i, { unit: e.target.value })} placeholder="eenh." className={cx(inputBase, 'w-[4.5rem] shrink-0 py-2 px-2.5')} />
              <button onClick={() => set({ ingredients: draft.ingredients.filter((_, k) => k !== i) })} className="text-stone-300 px-1" aria-label="Verwijderen"><Icon name="x" size={16} /></button>
            </div>
          ))}

        <Btn variant="ghost" size="sm" icon="plus" className="mt-1" onClick={() => set({ ingredients: [...draft.ingredients, { name: '', amount: '', unit: '' }] })}>Ingrediënt</Btn>
      </div>
      <div>
        <div className="text-[11px] font-extrabold uppercase tracking-wide text-stone-400 mb-1.5">Bereiding</div>
        <div className="space-y-1.5">

            <div key={i} className="flex gap-1.5 items-start">

              <textarea value={s} onChange={(e) => updStep(i, e.target.value)} rows={2} placeholder="Beschrijf deze stap…" className={cx(inputBase, 'flex-1 min-w-0 py-2')} />
              <button onClick={() => set({ steps: draft.steps.filter((_, k) => k !== i) })} className="text-stone-300 px-1 mt-2" aria-label="Verwijderen"><Icon name="x" size={16} /></button>
            </div>
          ))}

      </div>
    </div>
  );
}
function recipeToDraft(r) {
  return {
    title: r.title || '', category: r.category || '', basePortions: r.basePortions || 1,
    carbsPerPortion: r.carbsPerPortion == null ? '' : r.carbsPerPortion,
    ingredients: (r.ingredients && r.ingredients.length ? r.ingredients : [{}]).map(i => ({ name: i.name || '', amount: i.amount == null ? '' : i.amount, unit: i.unit || '' })),
    steps: r.steps && r.steps.length ? [...r.steps] : [''],
    image: r.image || '',
  };
}
function draftToRecipe(d) {
  return {
    title: d.title.trim(), category: d.category, basePortions: Number(d.basePortions) || 1,
    carbsPerPortion: d.carbsPerPortion === '' || d.carbsPerPortion === null ? null : Number(d.carbsPerPortion),
    ingredients: d.ingredients.filter(i => (i.name || '').trim()).map(i => ({ name: i.name.trim(), amount: i.amount === '' || i.amount == null ? null : Number(i.amount), unit: (i.unit || '').trim() })),
    steps: d.steps.map(s => (s || '').trim()).filter(Boolean),
    image: d.image || null,
  };
}

function RecipeSheet({ recipe, startInEdit, onUpdate, onDelete, onPlan, onClose }) {
  const [editing, setEditing] = useState(startInEdit);
  const [draft, setDraft] = useState(() => recipeToDraft(recipe));
  const [persons, setPersons] = useState(recipe.basePortions || 1);
  const ratio = recipe.basePortions ? persons / recipe.basePortions : 1;

  const [saving, setSaving] = useState(false);
  async function save() {
    if (!draft.title.trim()) { window.alert('Geef het recept een titel.'); return; }
    setSaving(true);
    try {
      let image = draft.image;
      if (image && image.startsWith('data:')) image = await uploadRecipePhoto(image);
      onUpdate(draftToRecipe({ ...draft, image }));
      setEditing(false);
    } catch (e) { window.alert(e.message); }
    finally { setSaving(false); }
  }
  return (
    <Sheet z={50} full title={editing ? 'Recept bewerken' : recipe.title}
      subtitle={editing ? recipe.title : <span className="inline-flex items-center gap-2"><CatChip category={recipe.category} small />{recipe.carbsPerPortion != null && `${fmtAmount(recipe.carbsPerPortion)} g koolh./pers.`}</span>}
      onClose={onClose}
      footer={editing ? (
        <div className="flex gap-2">
          <Btn variant="secondary" className="flex-1" onClick={() => { setDraft(recipeToDraft(recipe)); setEditing(false); }}>Annuleren</Btn>
          <Btn className="flex-1" icon="check" disabled={saving} onClick={save}>{saving ? '…' : 'Opslaan'}</Btn>
        </div>
      ) : (
        <div className="flex gap-2">
          <IconBtn name="trash" title="Verwijderen" onClick={onDelete} className="text-red-500 bg-white border border-line w-11 h-11" />
          <Btn variant="secondary" className="flex-1" icon="pencil" onClick={() => { setDraft(recipeToDraft(recipe)); setEditing(true); }}>Bewerken</Btn>
          <Btn className="flex-1" icon="calendar" onClick={onPlan}>Inplannen</Btn>
        </div>
      )}>
      {editing ? <RecipeForm draft={draft} setDraft={setDraft} /> : (
        <div className="space-y-4">
          {recipe.image && <img src={recipe.image} alt="" className="w-full h-40 object-cover rounded-2xl border border-line" />}
          <Card className="p-3.5 flex items-center justify-between gap-3">
            <div>
              <div className="text-[11px] font-extrabold uppercase tracking-wide text-stone-400">Hoe graag?</div>
              <div className="text-[11px] text-stone-500 font-semibold">{recipe.stars ? STAR_LABELS[recipe.stars] : 'nog niet beoordeeld'}</div>
            </div>
            <StarPicker value={recipe.stars} onChange={(n) => onUpdate({ stars: n })} />
          </Card>
          <div className="flex items-center justify-between">
            <span className="text-sm font-extrabold text-deep">Hoeveelheden voor</span>
            <Stepper value={persons} onChange={setPersons} label="pers." />
          </div>
          <RecipeBody recipe={recipe} ratio={ratio} />
        </div>
      )}
    </Sheet>
  );
}

function AddRecipeSheet({ preset, onSave, onClose }) {
  const [mode, setMode] = useState(preset.category || preset.title ? 'manual' : 'url');
  const [draft, setDraft] = useState({ ...recipeToDraft({ title: preset.title || '', category: preset.category || '', basePortions: 1 }) });
  const [url, setUrl] = useState('');
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState('');
  const [pasteIng, setPasteIng] = useState('');
  const [pasteSteps, setPasteSteps] = useState('');
  const [origPortions, setOrigPortions] = useState(2);
  const [filled, setFilled] = useState(false);

  function applyImport({ title, category, ingredients, steps, portions }) {
    const ratio = 1 / (Number(portions) || 1);
    setDraft(d => ({
      ...d,
      title: title || d.title,
      category: CATEGORIES.includes(category) ? category : d.category,
      basePortions: 1,
      ingredients: ingredients && ingredients.length ? ingredients.map(i => scaleIngredient(i, ratio)).map(i => ({ name: i.name || '', amount: i.amount == null ? '' : i.amount, unit: i.unit || '' })) : d.ingredients,
      steps: steps && steps.length ? steps : d.steps,
    }));
    setFilled(true);
  }
  async function importUrl() {
    if (!url.trim()) return;
    setBusy(true); setError('');
    try {
      const data = await invokeAi({ task: 'import_url', url: url.trim() });
      applyImport({ title: data.title, category: data.category, ingredients: data.ingredients, steps: data.steps, portions: data.basePortions || 2 });
    } catch (e) { setError(e.message + ' — probeer eventueel "Plak tekst".'); }
    finally { setBusy(false); }
  }
  function importPaste() {
    applyImport({ ingredients: parseLines(pasteIng).map(parseIngredientLine).filter(Boolean), steps: parseLines(pasteSteps), portions: origPortions });
  }
  const photoRef = useRef(null);
  async function importPhoto(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setBusy(true); setError('');
    try {
      const dataUrl = await resizeImageFile(file);
      setDraft(d => ({ ...d, image: dataUrl }));
      const base64 = dataUrl.split(',')[1];
      const data = await invokeAi({ task: 'import_photo', imageBase64: base64, mimeType: 'image/jpeg' });
      applyImport({ title: data.title, category: data.category, ingredients: data.ingredients, steps: data.steps, portions: data.basePortions || 2 });
    } catch (e) { setError(e.message + ' — vul de rest eventueel zelf aan.'); }
    finally { setBusy(false); }
  }
  async function save() {
    if (!draft.title.trim()) { window.alert('Geef het recept een titel.'); return; }
    if (!draft.category) { window.alert('Kies een categorie.'); return; }
    setBusy(true);
    try {
      let image = draft.image;
      if (image && image.startsWith('data:')) image = await uploadRecipePhoto(image);
      await onSave(draftToRecipe({ ...draft, image }));
    } catch (e) { window.alert(e.message); }
    finally { setBusy(false); }
  }

  return (
    <Sheet z={60} full title="Nieuw recept" subtitle={preset.category ? `Categorie: ${catMeta(preset.category).label}` : 'Van een website, een foto, geplakte tekst of zelf ingevuld'} onClose={onClose}
      footer={<Btn size="lg" className="w-full" icon="check" disabled={busy} onClick={save}>Recept opslaan</Btn>}>
      <Segmented className="mb-4" value={mode} onChange={setMode}
        options={[{ value: 'url', label: 'Van URL', icon: 'link' }, { value: 'photo', label: 'Foto', icon: 'camera' }, { value: 'paste', label: 'Plak tekst' }, { value: 'manual', label: 'Zelf', icon: 'pencil' }]} />

      {mode === 'photo' && (
        <Card className="p-3.5 mb-4 space-y-2">
          <input ref={photoRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={importPhoto} />
          {draft.image ? (
            <div className="relative rounded-2xl overflow-hidden border border-line">
              <img src={draft.image} alt="" className="w-full h-40 object-cover" />
              <div className="absolute top-2 right-2">
                <IconBtn name="camera" title="Andere foto" onClick={() => photoRef.current.click()} className="bg-white/90 backdrop-blur w-9 h-9" />
              </div>
              {busy && <div className="absolute inset-0 bg-white/70 flex items-center justify-center text-sm font-extrabold text-deep">Recept wordt gelezen…</div>}
            </div>
          ) : (
            <Btn className="w-full" icon="camera" disabled={busy} onClick={() => photoRef.current.click()}>{busy ? '…' : 'Foto nemen van recept'}</Btn>
          )}
          <p className="text-[11px] text-stone-400">Bv. een receptenkaart, kookboekpagina of tijdschriftknipsel. De AI leest de tekst en vult het recept hieronder in — de foto wordt meteen als receptfoto bewaard.</p>
          {error && <p className="text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded-xl px-3 py-2">{error}</p>}
        </Card>
      )}
      {mode === 'url' && (
        <Card className="p-3.5 mb-4 space-y-2">
          <Field label="Link naar een recept">
            <div className="flex gap-2">
              <input value={url} onChange={(e) => setUrl(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') importUrl(); }} placeholder="https://…" className={inputCls} />
              <Btn disabled={busy || !url.trim()} onClick={importUrl}>{busy ? '…' : 'Ophalen'}</Btn>
            </div>
          </Field>
          <p className="text-[11px] text-stone-400">Werkt bij de meeste receptensites; de AI vult aan waar nodig. Alles wordt omgerekend naar 1 persoon.</p>
          {error && <p className="text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded-xl px-3 py-2">{error}</p>}
        </Card>
      )}
      {mode === 'paste' && (
        <Card className="p-3.5 mb-4 space-y-3">
          <Field label="Ingrediënten (één per regel)"><textarea value={pasteIng} onChange={(e) => setPasteIng(e.target.value)} rows={4} placeholder={'500 g kipfilet\n1 courgette\n2 el olijfolie'} className={inputCls} /></Field>
          <Field label="Bereiding (één stap per regel)"><textarea value={pasteSteps} onChange={(e) => setPasteSteps(e.target.value)} rows={3} placeholder={'Snijd de courgette in blokjes\nBak de kip…'} className={inputCls} /></Field>
          <div className="flex items-center justify-between gap-2">
            <span className="text-xs font-bold text-stone-500">Origineel voor</span>
            <Stepper value={Number(origPortions) || 1} onChange={setOrigPortions} label="pers." />
          </div>
          <Btn variant="soft" className="w-full" onClick={importPaste}>Invullen & omrekenen naar 1 persoon</Btn>
        </Card>
      )}
      {filled && <div className="text-xs font-bold text-leaf bg-mist rounded-xl px-3 py-2 mb-3">✓ Ingevuld en omgerekend naar 1 persoon — kijk het hieronder even na{!draft.category ? ' en kies een categorie' : ''}.</div>}
      <RecipeForm draft={draft} setDraft={setDraft} />
    </Sheet>
  );
}

// =================================================================
// 9. Kast
// =================================================================
function KastPage({ pantryStock, recipes, onAdd, onToggle, onRemove, onAddToShopping, onOpenRecipe, onAiSuggest, aiSuggesting }) {
  const [view, setView] = useState('voorraad');
  const [input, setInput] = useState('');
  const [extra, setExtra] = useState([]);
  const [extraInput, setExtraInput] = useState('');
  const [matchMode, setMatchMode] = useState('any');
  const inStock = pantryStock.filter(p => p.inStock).sort((a, b) => a.name.localeCompare(b.name));
  const outStock = pantryStock.filter(p => !p.inStock).sort((a, b) => a.name.localeCompare(b.name));
  const sources = [...inStock.map(p => p.name), ...extra];
  const results = useMemo(() => matchRecipesToPantry(recipes, sources, matchMode), [recipes, sources.join('|'), matchMode]); // eslint-disable-line

  function add() { input.split(',').map(s => s.trim()).filter(Boolean).forEach(onAdd); setInput(''); }
  function addExtra() {
    const parts = extraInput.split(',').map(s => s.trim()).filter(Boolean);
    setExtra([...extra, ...parts.filter(p => !sources.some(s => normalize(s) === normalize(p)))]); setExtraInput('');
  }

  return (
    <div>
      <PageHeader eyebrow={`${inStock.length} items in huis`} title="Kast" />
      <Segmented className="mb-4" value={view} onChange={setView}
        options={[{ value: 'voorraad', label: 'Voorraad', icon: 'box' }, { value: 'maken', label: 'Wat kan ik maken?', icon: 'search' }]} />

      {view === 'voorraad' ? (
        <div className="space-y-4">
          <Card className="p-2 flex gap-1.5">
            <input value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') add(); }}
              placeholder="Toevoegen: eieren, rijst, passata…" className="flex-1 min-w-0 bg-transparent px-2 py-2 text-sm placeholder:text-stone-300 border-0 focus:shadow-none" />
            <button onClick={add} className="w-10 rounded-xl bg-forest text-white flex items-center justify-center"><Icon name="plus" /></button>
          </Card>

          <button onClick={onAiSuggest} disabled={aiSuggesting || !inStock.length}
            className="w-full rounded-2xl bg-gradient-to-br from-deep to-forest text-white p-3.5 flex items-center gap-3 text-left shadow-card disabled:opacity-50">
            <div className="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center"><Icon name="sparkles" size={20} /></div>
            <div className="flex-1">
              <div className="text-sm font-black">{aiSuggesting ? 'AI bedenkt recepten…' : 'Bedenk recepten met mijn voorraad'}</div>
              <div className="text-[11px] text-white/70">Voorstellen verschijnen bij Recepten om goed te keuren.</div>
            </div>
          </button>

          {pantryStock.length === 0 && <EmptyState emoji="🥫" title="Je kast is nog leeg" text="Houd bij wat je meestal in huis hebt. Is iets op? Tik het af en zet het met één tik op je boodschappenlijst." />}

          {inStock.length > 0 && (
            <div>
              <div className="text-[11px] font-extrabold uppercase tracking-wide text-stone-400 mb-1.5 px-1">In huis ({inStock.length})</div>
              <Card className="divide-y divide-line/70 overflow-hidden">
                {inStock.map(p => (
                  <div key={p.id} className="flex items-center gap-3 px-3 py-2.5">
                    <button onClick={() => onToggle(p.id)} className="w-6 h-6 rounded-full bg-sage text-white flex items-center justify-center shrink-0" aria-label="Markeer als op"><Icon name="check" size={14} stroke={3} /></button>
                    <span className="flex-1 text-sm font-bold text-ink">{p.name}</span>
                    <button onClick={() => onToggle(p.id)} className="text-[11px] font-extrabold text-stone-400 px-2 py-1 rounded-lg active:bg-mist">Op</button>
                  </div>
                ))}
              </Card>
            </div>
          )}
          {outStock.length > 0 && (
            <div>
              <div className="text-[11px] font-extrabold uppercase tracking-wide text-stone-400 mb-1.5 px-1">Op / aan te vullen ({outStock.length})</div>
              <Card className="divide-y divide-line/70 overflow-hidden">
                {outStock.map(p => (
                  <div key={p.id} className="flex items-center gap-2 px-3 py-2.5">
                    <button onClick={() => onToggle(p.id)} className="w-6 h-6 rounded-full border-2 border-stone-300 shrink-0" aria-label="Weer in huis" />
                    <span className="flex-1 text-sm font-semibold text-stone-400">{p.name}</span>
                    <button onClick={() => onAddToShopping(p.name)} className="flex items-center gap-1 text-[11px] font-extrabold text-forest bg-mist rounded-lg px-2 py-1"><Icon name="cart" size={12} />Op lijst</button>
                    <IconBtn name="trash" size={14} title="Verwijderen" onClick={() => onRemove(p.id)} className="w-8 h-8 text-stone-300" />
                  </div>
                ))}
              </Card>
            </div>
          )}
        </div>
      ) : (
        <div className="space-y-3">
          <Card className="p-3.5 space-y-3">
            <div className="text-xs text-stone-500">We gebruiken je voorraad ({inStock.length}). Iets extra dat niet in je kast-lijst staat?</div>
            <div className="flex gap-2">
              <input value={extraInput} onChange={(e) => setExtraInput(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') addExtra(); }} placeholder="bv. kip, spinazie" className={inputCls} />
              <Btn variant="soft" onClick={addExtra}>+</Btn>
            </div>
            {extra.length > 0 && (
              <div className="flex flex-wrap gap-1.5">
                {extra.map(x => <span key={x} className="inline-flex items-center gap-1 bg-mist text-forest rounded-full pl-2.5 pr-1 py-1 text-xs font-bold">{x}<button onClick={() => setExtra(extra.filter(e => e !== x))}><Icon name="x" size={12} /></button></span>)}
              </div>
            )}
            <Segmented value={matchMode} onChange={setMatchMode} options={[{ value: 'any', label: 'Minstens 1 match' }, { value: 'full', label: 'Volledig in huis' }]} />
            <div className="text-[11px] text-stone-400">Zout, peper, olie, boter en water tellen we als altijd in huis.</div>
          </Card>
          {!sources.length ? <EmptyState emoji="🧺" title="Nog niets om mee te zoeken" text="Zet eerst wat in je voorraad of typ hierboven wat je hebt." />
            : results.length === 0 ? <EmptyState emoji="🤷" title="Geen passende recepten" text={matchMode === 'full' ? 'Geen enkel recept kan je volledig maken — probeer "Minstens 1 match".' : 'Geen enkel recept gebruikt deze ingrediënten.'} />
            : (
              <Card className="divide-y divide-line/70 overflow-hidden">
                {results.slice(0, 40).map(({ recipe, matched, total, missing, pct }) => (
                  <button key={recipe.id} onClick={() => onOpenRecipe(recipe.id)} className="w-full text-left px-3.5 py-3 active:bg-mist">
                    <div className="flex items-center gap-2">
                      <span className="text-base">{catMeta(recipe.category).emoji}</span>
                      <span className="flex-1 text-sm font-extrabold text-ink truncate">{recipe.title}</span>
                      <span className={cx('text-[11px] font-black rounded-full px-2 py-0.5', missing.length === 0 ? 'bg-sage text-white' : 'bg-amber-100 text-amber-800')}>{missing.length === 0 ? 'Alles ✓' : `${matched}/${total}`}</span>
                    </div>
                    <div className="h-1.5 rounded-full bg-mist mt-2 overflow-hidden"><div className="h-full bg-sage rounded-full" style={{ width: `${Math.round(pct * 100)}%` }} /></div>
                    {missing.length > 0 && <div className="text-[11px] text-stone-400 mt-1.5 truncate">Nog nodig: {missing.join(', ')}</div>}
                  </button>
                ))}
              </Card>
            )}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
  }
</script>
</body>
</html>
