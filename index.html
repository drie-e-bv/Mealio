// =================================================================
// 1. Categorieën & vaste waarden
// =================================================================
// Twee soorten recepten:
//  - "Gerechten": een volledige maaltijd op zich (lasagne, salade, …)
//  - "Onderdelen": één deel van een bord (kip, broccoli, aardappelen, saus)
//    waarmee je in het weekmenu een maaltijd samenstelt.
const DISH_CATEGORIES = ['Hoofdmaaltijd', 'Salade', 'Ontbijt', 'Snack', 'Dessert', 'Extra'];
const COMPONENT_ROLES = ['Eiwit', 'Groenten', 'Bijgerecht', 'Saus'];
const COMPONENT_CATEGORIES = [...COMPONENT_ROLES, 'Onderdeel'];
const CATEGORIES = [...DISH_CATEGORIES, ...COMPONENT_CATEGORIES];

  Salade:        { label: 'Salade', emoji: '🥗', chip: 'bg-lime-100 text-lime-800' },
  Ontbijt:       { label: 'Ontbijt', emoji: '🍳', chip: 'bg-amber-100 text-amber-800' },
  Snack:         { label: 'Snack', emoji: '🥜', chip: 'bg-sky-100 text-sky-800' },
  Dessert:       { label: 'Dessert', emoji: '🍓', chip: 'bg-pink-100 text-pink-800' },

  Onderdeel:     { label: 'Overig onderdeel', short: 'Overig', emoji: '🧩', chip: 'bg-orange-100 text-orange-800' },
};
function catMeta(c) { return CAT[c] || { label: c || 'Geen categorie', emoji: '📄', chip: 'bg-stone-100 text-stone-600' }; }
function catShort(c) { const m = catMeta(c); return m.short || m.label; }

const DAYS = ['Maandag', 'Dinsdag', 'Woensdag', 'Donderdag', 'Vrijdag', 'Zaterdag', 'Zondag'];
const DAY_SHORT = ['Ma', 'Di', 'Wo', 'Do', 'Vr', 'Za', 'Zo'];
const MEALS = [
  { key: 'Ontbijt', label: 'Ontbijt', emoji: '☀️', defaultPersons: 2 },
  { key: 'Middag', label: 'Middag', emoji: '🌤️', defaultPersons: 2 },

const TYPE_COMPOSE = 'Samenstellen';
const TYPE_LEFTOVERS = 'Restjes';
const TYPE_SKIP = 'Overslaan';
const NO_RECIPE_TYPES = [TYPE_LEFTOVERS, TYPE_SKIP];
const STAR_LABELS = {
  1: '± 1x per maand', 2: 'af en toe', 3: 'regelmatig', 4: 'graag vaak', 5: 'mag elke week',
};
// Rijen in de "Samenstellen"-editor. "Overig" vangt al de rest op (ook oude
// recepten met categorie "Onderdeel" of een volledig gerecht als onderdeel).
const COMPOSE_ROWS = [
  ...COMPONENT_ROLES.map(r => ({ key: r, label: CAT[r].label, emoji: CAT[r].emoji, categories: [r] })),
  { key: 'Overig', label: 'Overig (elk recept)', emoji: '🧩', categories: null },
];
function roleOf(recipe) { return recipe && COMPONENT_ROLES.includes(recipe.category) ? recipe.category : 'Overig'; }
// Basisingrediënten die we bij "Wat kan ik maken?" als altijd-in-huis beschouwen.
const PANTRY_BASICS = ['zout', 'peper', 'water', 'olijfolie', 'olie', 'boter'];

// =================================================================
// 2. Helpers
// =================================================================
function cx(...a) { return a.filter(Boolean).join(' '); }
function fmtAmount(n) {
  if (n === null || n === undefined || n === '') return '';
  return String(Math.round(n * 100) / 100).replace('.', ',');
}
function normalize(s) { return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim(); }
function ingredientMatches(ingName, pantryNorm) {
  const n = normalize(ingName);
  return pantryNorm.some(p => p && (n.includes(p) || (n.length >= 4 && p.includes(n))));
}
function matchRecipesToPantry(recipes, pantryList, mode) {
  const userNorm = pantryList.map(normalize).filter(Boolean);
  const basicNorm = PANTRY_BASICS.map(normalize);
  if (userNorm.length === 0) return [];
  return recipes.map(r => {
    const ings = (r.ingredients || []).filter(i => i.name);
    const missing = [];
    let matched = 0, fromUser = 0;
    ings.forEach(ing => {
      if (ingredientMatches(ing.name, userNorm)) { matched++; fromUser++; }
      else if (ingredientMatches(ing.name, basicNorm)) matched++;
      else missing.push(ing.name);
    });
    return { recipe: r, matched, fromUser, total: ings.length, missing, pct: ings.length ? matched / ings.length : 0 };
  }).filter(x => x.fromUser > 0 && (mode !== 'full' || x.missing.length === 0))
    .sort((a, b) => b.pct - a.pct || b.matched - a.matched || a.recipe.title.localeCompare(b.recipe.title));
}

// --- ingrediënten herkennen uit geplakte tekst ---
const UNIT_ALIASES = {
  g: 'g', gram: 'g', gr: 'g', kg: 'kg', kilogram: 'kg', ml: 'ml', cl: 'cl', l: 'l', liter: 'l',
  el: 'el', eetlepel: 'el', eetlepels: 'el', tbsp: 'el', tl: 'tl', theelepel: 'tl', theelepels: 'tl', tsp: 'tl',
  stuk: 'stuks', stuks: 'stuks', teentje: 'teentje', teentjes: 'teentje', snufje: 'snufje', snuifje: 'snufje',
  kopje: 'kopje', blik: 'blik', blikje: 'blikje', bosje: 'bosje', plakje: 'plakje', plakjes: 'plakje', handje: 'handje',
};
const UNICODE_FRACTIONS = { '½': 0.5, '⅓': 0.333, '⅔': 0.667, '¼': 0.25, '¾': 0.75, '⅛': 0.125 };
function parseIngredientLine(raw) {
  let line = (raw || '').trim();
  if (!line) return null;
  line = line.replace(/^[-•*]\s*/, '');
  Object.entries(UNICODE_FRACTIONS).forEach(([ch, val]) => { line = line.split(ch).join(` ${val} `); });
  line = line.replace(/\s+/g, ' ').trim();
  const m = line.match(/^(\d+\/\d+|\d+[.,]?\d*)\s*([a-zA-Zà-ÿ]*)\s+(.+)$/);
  if (m) {
    let [, amtRaw, unitRaw, name] = m;
    let amt;
    if (amtRaw.includes('/')) { const [a, b] = amtRaw.split('/').map(Number); amt = b ? a / b : null; }
    else amt = parseFloat(amtRaw.replace(',', '.'));
    const unitKey = unitRaw.toLowerCase();
    let unit;
    if (UNIT_ALIASES[unitKey]) unit = UNIT_ALIASES[unitKey];
    else if (unitKey) { name = `${unitRaw} ${name}`; unit = 'stuks'; }
    else unit = 'stuks';
    return { name: name.trim(), amount: isNaN(amt) ? null : amt, unit };
  }
  return { name: line, amount: null, unit: '' };
}
function parseLines(text) {
  return (text || '').split('\n').map(s => s.replace(/^\s*(\d+[\.\)]|[-•*])\s*/, '').trim()).filter(Boolean);
}
function scaleIngredient(ing, ratio) {
  return { ...ing, amount: ing.amount != null && ing.amount !== '' ? Math.round(Number(ing.amount) * ratio * 100) / 100 : null };
}

// --- datums (lokale tijd — géén toISOString, die schuift in België een dag op) ---
function toISODate(dt) {
  return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
}
function parseISODate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); }
function mondayOf(d) {
  const dt = new Date(d); dt.setHours(12, 0, 0, 0);
  const day = dt.getDay();
  dt.setDate(dt.getDate() + ((day === 0 ? -6 : 1) - day));
  return toISODate(dt);
}
function addDays(ws, n) { const dt = parseISODate(ws); dt.setDate(dt.getDate() + n); return toISODate(dt); }
function todayISO() { return toISODate(new Date()); }
function dayIndexOf(iso) { return (parseISODate(iso).getDay() + 6) % 7; }
function fmtWeekRange(ws) {
  const opts = { day: 'numeric', month: 'short' };
  return `${parseISODate(ws).toLocaleDateString('nl-BE', opts)} – ${parseISODate(addDays(ws, 6)).toLocaleDateString('nl-BE', opts)}`;
}
function fmtDayLong(ws, i) {
  const s = parseISODate(addDays(ws, i)).toLocaleDateString('nl-BE', { weekday: 'long', day: 'numeric', month: 'long' });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function isoWeekNumber(ws) {
  const d = parseISODate(ws);
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - yearStart) / 86400000 + 1) / 7);
}

// --- maaltijd-slots ---
function emptySlot(mealKey) {
  const m = MEALS.find(x => x.key === mealKey);
  return { persons: m ? m.defaultPersons : 2, category: '', recipeId: '', locked: false, feedback: null, notes: '', componentIds: [], aiGenerated: false };
}
function entryToSlot(e) {
  return { persons: e.persons, category: e.type || '', recipeId: e.recipeId || '', locked: !!e.locked, feedback: e.feedback || null,
    notes: e.notes || '', componentIds: e.componentIds || [], aiGenerated: !!e.aiGenerated };
}
function buildWeekmenu(entries) {
  const wm = {};
  DAYS.forEach(d => { wm[d] = {}; MEALS.forEach(m => { wm[d][m.key] = emptySlot(m.key); }); });
  entries.forEach(e => { if (wm[e.day] && wm[e.day][e.meal]) wm[e.day][e.meal] = entryToSlot(e); });
  return wm;
}
function slotMode(slot) {
  if (slot.category === TYPE_COMPOSE) return 'compose';
  if (slot.category === TYPE_LEFTOVERS) return 'leftovers';
  if (slot.category === TYPE_SKIP) return 'skip';
  if (slot.category) return 'recipe';
  return 'empty';
}
function slotRecipes(slot, byId) {
  return [slot.recipeId, ...(slot.componentIds || [])].filter(Boolean).map(id => byId[id]).filter(Boolean);
}
function slotCarbs(slot, byId) {
  let t = 0, known = false;
  slotRecipes(slot, byId).forEach(r => { if (r.carbsPerPortion != null) { t += r.carbsPerPortion * slot.persons; known = true; } });
  return known ? t : null;
}
function slotIsPlanned(slot) {
  const mode = slotMode(slot);
  if (mode === 'skip' || mode === 'leftovers') return true;
  if (mode === 'recipe') return !!slot.recipeId;
  if (mode === 'compose') return (slot.componentIds || []).length > 0;
  return false;
}
function slotSummary(slot, byId) {
  const mode = slotMode(slot);
  if (mode === 'skip') return 'Overgeslagen';
  if (mode === 'leftovers') return '🍱 Restjes' + (slot.notes ? ': ' + slot.notes.split('\n')[0].replace(/^Restjes: /, '') : '');
  const titles = slotRecipes(slot, byId).map(r => r.title);
  if (titles.length) return titles.join(' + ');
  if (mode === 'compose') return 'Samenstellen — nog leeg';
  if (mode === 'recipe') return `${catMeta(slot.category).label} — nog te kiezen`;
  return '';
}

// Foto van een recept opslaan in de 'recipe-photos' bucket; geeft de publieke URL terug.
async function uploadRecipePhoto(dataUrl) {
  const m = /^data:([^;]+);base64,(.*)$/.exec(dataUrl || '');
  if (!m) return null;
  const mimeType = m[1];
  const bytes = Uint8Array.from(atob(m[2]), c => c.charCodeAt(0));
  const ext = mimeType.split('/')[1] || 'jpg';
  const path = `${crypto.randomUUID()}.${ext}`;
  const { error } = await sb.storage.from('recipe-photos').upload(path, bytes, { contentType: mimeType, upsert: false });
  if (error) throw new Error('Foto uploaden mislukt: ' + error.message);
  return sb.storage.from('recipe-photos').getPublicUrl(path).data.publicUrl;
}
// Foto verkleinen naar een redelijke resolutie zodat de upload/AI-aanroep snel blijft.
function resizeImageFile(file, maxDim = 1600, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Foto lezen mislukt'));
    reader.onload = () => { img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        const scale = maxDim / Math.max(width, height);
        width = Math.round(width * scale); height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    }; img.onerror = () => reject(new Error('Foto laden mislukt')); img.src = reader.result; };
    reader.readAsDataURL(file);
  });
}
function weekmenuOut(row) {
  return { weekStart: row.week_start, day: row.day, meal: row.meal, persons: row.persons, type: row.type || '',
    recipeId: row.recipe_id || '', locked: !!row.locked, feedback: row.feedback || null, notes: row.notes || '',
    componentIds: row.component_ids || [], aiGenerated: !!row.ai_generated };

function pantryOut(row) { return { id: row.id, name: row.ingredient_name, inStock: !!row.in_stock }; }
function suggestionOut(row) {

    ingredients: row.ingredients || [], steps: row.steps || [], basedOn: row.based_on_ingredients || [] };
}
function throwIfError({ data, error }) { if (error) throw new Error(error.message); return data; }

// Eén centrale AI-aanroep die de échte foutmelding van de Edge Function toont
// (i.p.v. het nietszeggende "non-2xx status code").
async function invokeAi(body) {
  const { data, error } = await sb.functions.invoke('ai-assist', { body });
  if (error) {
    let detail = error.message || 'AI-aanroep mislukt';
    if (error.context && typeof error.context.json === 'function') {
      try { const b = await error.context.json(); if (b && b.error) detail = b.error; } catch (e) {}
    }
    if (/503|high demand|UNAVAILABLE|overloaded/i.test(detail)) detail = 'Gemini is even overbelast — probeer het over een minuutje opnieuw.';
    throw new Error(detail);
  }
  if (data && data.error) throw new Error(data.error);
  return data;
}

  link: <><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" /><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" /></>,

};
function Icon({ name, size = 18, className = '', stroke = 2 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={stroke}
      strokeLinecap="round" strokeLinejoin="round" className={cx('shrink-0', className)} aria-hidden="true">
      {ICONS[name]}
    </svg>
  );
}

function Btn({ variant = 'primary', size = 'md', icon, children, className = '', ...props }) {
  const variants = {
    primary: 'bg-forest text-white shadow-card active:bg-deep',
    secondary: 'bg-white text-forest border border-line active:bg-mist',
    soft: 'bg-mist text-forest active:bg-mint',
    ghost: 'text-forest active:bg-mist',
    danger: 'text-red-600 active:bg-red-50',
  };
  const sizes = { sm: 'text-xs px-3 py-1.5 rounded-xl gap-1.5', md: 'text-sm px-4 py-2.5 rounded-xl gap-2', lg: 'text-[15px] px-5 py-3 rounded-2xl gap-2' };
  return (
    <button {...props} className={cx('inline-flex items-center justify-center font-extrabold transition disabled:opacity-50 disabled:pointer-events-none', variants[variant], sizes[size], className)}>
      {icon && <Icon name={icon} size={size === 'sm' ? 14 : 16} />}
      {children}
    </button>
  );
}
function IconBtn({ name, onClick, title, className = '', size = 18, active }) {
  return (
    <button onClick={onClick} title={title} aria-label={title}
      className={cx('w-9 h-9 rounded-xl flex items-center justify-center transition', active ? 'bg-mint text-forest' : 'text-stone-500 active:bg-mist', className)}>
      <Icon name={name} size={size} />
    </button>
  );
}
function Card({ children, className = '' }) {
  return <div className={cx('bg-white rounded-2xl border border-line shadow-card', className)}>{children}</div>;
}
function CatChip({ category, small }) {
  const m = catMeta(category);
  return <span className={cx('inline-flex items-center gap-1 rounded-full font-bold whitespace-nowrap', small ? 'text-[10px] px-1.5 py-0.5' : 'text-[11px] px-2 py-0.5', m.chip)}>{m.emoji} {catShort(category)}</span>;
}
function Segmented({ options, value, onChange, className = '' }) {
  return (
    <div className={cx('flex bg-mist rounded-xl p-1 gap-1', className)}>
      {options.map(o => (
        <button key={o.value} onClick={() => onChange(o.value)}
          className={cx('flex-1 flex items-center justify-center gap-1.5 text-xs font-extrabold py-2 rounded-lg transition',
            value === o.value ? 'bg-white text-forest shadow-card' : 'text-leaf/70')}>
          {o.icon && <Icon name={o.icon} size={14} />}{o.label}
        </button>
      ))}
    </div>
  );
}
function Stepper({ value, onChange, min = 1, label }) {
  return (
    <div className="inline-flex items-center gap-1 bg-mist rounded-xl p-1">
      <button onClick={() => onChange(Math.max(min, value - 1))} className="w-8 h-8 rounded-lg bg-white text-forest flex items-center justify-center shadow-card"><Icon name="minus" size={14} /></button>
      <span className="min-w-[2.5rem] text-center text-sm font-extrabold text-deep">{value}{label ? <span className="text-[11px] font-bold text-stone-400"> {label}</span> : null}</span>
      <button onClick={() => onChange(value + 1)} className="w-8 h-8 rounded-lg bg-white text-forest flex items-center justify-center shadow-card"><Icon name="plus" size={14} /></button>
    </div>
  );
}
function Stars({ value, size = 12 }) {
  if (!value) return null;
  return <span className="text-amber-500 tracking-tight" style={{ fontSize: size }}>{'★'.repeat(value)}<span className="text-stone-200">{'★'.repeat(5 - value)}</span></span>;
}
function StarPicker({ value, onChange }) {
  return (
    <div className="flex items-center gap-0.5">
      {[1, 2, 3, 4, 5].map(n => (
        <button key={n} type="button" onClick={() => onChange(value === n ? null : n)} className="text-2xl leading-none px-0.5">
          <span className={n <= (value || 0) ? 'text-amber-500' : 'text-stone-200'}>★</span>
        </button>
      ))}
    </div>
  );
}
function Field({ label, children, hint }) {
  return (
    <label className="block">
      <span className="block text-[11px] font-extrabold uppercase tracking-wide text-stone-400 mb-1">{label}</span>
      {children}
      {hint && <span className="block text-[11px] text-stone-400 mt-1">{hint}</span>}
    </label>
  );
}
const inputBase = 'bg-white border border-line rounded-xl px-3 py-2.5 text-sm text-ink placeholder:text-stone-300';
const inputCls = 'w-full ' + inputBase;
function PageHeader({ eyebrow, title, right }) {
  return (
    <div className="flex items-end justify-between gap-3 mb-4">
      <div className="min-w-0">
        {eyebrow && <div className="text-[11px] font-extrabold uppercase tracking-wider text-sage">{eyebrow}</div>}
        <h2 className="text-[26px] font-black text-deep leading-tight tracking-tight truncate">{title}</h2>
      </div>
      {right && <div className="flex items-center gap-1.5 shrink-0">{right}</div>}
    </div>
  );
}
function EmptyState({ emoji, title, text, action }) {
  return (
    <div className="text-center py-10 px-6">
      <div className="text-4xl mb-2">{emoji}</div>
      <div className="font-extrabold text-deep">{title}</div>
      {text && <div className="text-sm text-stone-500 mt-1">{text}</div>}
      {action && <div className="mt-4">{action}</div>}
    </div>
  );
}

// Onderaan openschuivend paneel (bottom sheet). Meerdere kunnen gestapeld
// worden (bv. maaltijd → recept → nieuw recept); zIndex bepaalt de volgorde.
let openSheets = 0;
function Sheet({ title, subtitle, onClose, children, footer, z = 40, full }) {
  useEffect(() => {
    openSheets++; document.body.style.overflow = 'hidden';
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => { openSheets--; if (!openSheets) document.body.style.overflow = ''; window.removeEventListener('keydown', onKey); };
  }, []); // eslint-disable-line
  return (
    <div className="fixed inset-0" style={{ zIndex: z }}>
      <div className="sheet-backdrop absolute inset-0 bg-deep/40" onClick={onClose} />
      <div className={cx('sheet-panel absolute inset-x-0 bottom-0 mx-auto max-w-lg bg-cream rounded-t-[28px] shadow-lift flex flex-col', full ? 'h-[94vh]' : 'max-h-[92vh]')}>
        <div className="pt-2.5 pb-1 flex justify-center"><div className="w-10 h-1.5 rounded-full bg-stone-300/70" /></div>
        <div className="flex items-start gap-3 px-5 pb-3 pt-1">
          <div className="flex-1 min-w-0">
            <div className="text-lg font-black text-deep leading-snug">{title}</div>
            {subtitle && <div className="text-xs font-semibold text-stone-500 mt-0.5">{subtitle}</div>}
          </div>
          <IconBtn name="x" onClick={onClose} title="Sluiten" className="bg-white border border-line -mt-0.5" />
        </div>
        <div className="flex-1 overflow-y-auto px-5 pb-4">{children}</div>
        {footer && <div className="border-t border-line bg-cream px-5 pt-3 pb-safe">{footer}<div className="h-2" /></div>}
      </div>
    </div>
  );
}

// =================================================================
// 5. App (data + navigatie)
// =================================================================
function App() {
  const [session, setSession] = useState(undefined);
  const [authError, setAuthError] = useState('');
  const [loaded, setLoaded] = useState(false);

  const [recipes, setRecipes] = useState([]);
  const [weekStart, setWeekStartState] = useState(mondayOf(new Date()));
  const [weekEntries, setWeekEntriesState] = useState([]);
  const [weekLoading, setWeekLoading] = useState(false);
  const [stores, setStores] = useState(['Colruyt', 'Okay', 'Slager', 'Bakker']);
  const [itemStoreMap, setItemStoreMap] = useState({});
  const [checkedItems, setCheckedItems] = useState({});
  const [extraItems, setExtraItems] = useState([]);
  const [pantryStock, setPantryStock] = useState([]);
  const [aiSuggestions, setAiSuggestions] = useState([]);

  const [tab, setTab] = useState('planner');
  const [selectedDay, setSelectedDay] = useState(DAYS[dayIndexOf(todayISO())]);
  const [toast, setToast] = useState(null);
  const [mealSheet, setMealSheet] = useState(null);        // { day, meal }
  const [recipeSheet, setRecipeSheet] = useState(null);    // { id, edit }
  const [addSheet, setAddSheet] = useState(null);          // { category, title, onCreated }
  const [planSheetId, setPlanSheetId] = useState(null);
  const [aiBusy, setAiBusy] = useState(false);
  const [aiSuggesting, setAiSuggesting] = useState(false);

  // refs om race-conditions te vermijden (snelle opeenvolgende wijzigingen,
  // week wisselen terwijl er nog geladen wordt, polling tijdens het opslaan)
  const entriesRef = useRef([]);
  const weekStartRef = useRef(weekStart);
  const lastWriteRef = useRef(0);
  weekStartRef.current = weekStart;
  function setEntries(next) { entriesRef.current = next; setWeekEntriesState(next); }

  const weekmenu = useMemo(() => buildWeekmenu(weekEntries), [weekEntries]);
  const recipesById = useMemo(() => { const m = {}; recipes.forEach(r => { m[r.id] = r; }); return m; }, [recipes]);
  const toastTimer = useRef(null);
  function showToast(msg, action) {
    clearTimeout(toastTimer.current);
    setToast({ msg, action });
    toastTimer.current = setTimeout(() => setToast(null), action ? 4500 : 2600);
  }

  // ---------- auth ----------
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: listener } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => listener.subscription.unsubscribe();
  }, []);
  async function signInWithGoogle() {
    setAuthError('');
    const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + window.location.pathname } });
    if (error) setAuthError(error.message);
  }

  // ---------- laden ----------
  const loadWeek = useCallback(async (ws) => {
    try {
      const rows = throwIfError(await sb.from('weekmenu_entries').select('*').eq('week_start', ws));
      if (ws === weekStartRef.current) setEntries((rows || []).map(weekmenuOut));
    } catch (e) { console.error(e); }
  }, []);
  const loadAll = useCallback(async (isPoll) => {
    try {
      const [recipeRows, settingsRows, pantryRows, suggestionRows] = await Promise.all([
        sb.from('recipes').select('*').order('title'),
        sb.from('app_settings').select('key,value').in('key', ['stores', 'checked_items', 'item_store_map', 'extra_items']),
        sb.from('pantry_stock').select('*').order('ingredient_name'),
        sb.from('ai_recipe_suggestions').select('*').eq('status', 'pending').order('created_at', { ascending: false }),
      ].map(p => p.then(throwIfError)));
      setRecipes((recipeRows || []).map(recipeOut));
      const byKey = {}; (settingsRows || []).forEach(r => { byKey[r.key] = r.value; });
      setStores(byKey.stores && byKey.stores.length ? byKey.stores : ['Colruyt', 'Okay', 'Slager', 'Bakker']);
      setItemStoreMap(byKey.item_store_map || {});
      setCheckedItems(byKey.checked_items || {});
      setExtraItems(byKey.extra_items || []);
      setPantryStock((pantryRows || []).map(pantryOut));
      setAiSuggestions((suggestionRows || []).map(suggestionOut));
      await loadWeek(weekStartRef.current);
    } catch (e) {
      console.error(e);
      if (!isPoll) showToast('Laden mislukt — controleer je verbinding');
    }
  }, [loadWeek]);

  useEffect(() => { if (session) loadAll(false).then(() => setLoaded(true)); }, [session]); // eslint-disable-line

  // Automatisch verversen (zodat je elkaars wijzigingen ziet) — maar niet
  // tijdens het typen of vlak na een eigen wijziging.
  useEffect(() => {
    if (!session) return;
    const tick = () => {
      const el = document.activeElement;
      const typing = el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA');
      if (document.hidden || typing || Date.now() - lastWriteRef.current < 5000) return;
      loadAll(true);
    };
    const id = setInterval(tick, 15000);
    const onVis = () => { if (!document.hidden) tick(); };
    document.addEventListener('visibilitychange', onVis);
    return () => { clearInterval(id); document.removeEventListener('visibilitychange', onVis); };
  }, [loadAll, session]);

  async function setWeekStart(ws) {
    setWeekStartState(ws);
    weekStartRef.current = ws;
    setEntries([]);
    setSelectedDay(ws === mondayOf(new Date()) ? DAYS[dayIndexOf(todayISO())] : DAYS[0]);
    setWeekLoading(true);
    await loadWeek(ws);
    setWeekLoading(false);
  }

  // ---------- recepten ----------
  async function addRecipe(recipe) {
    try {
      const created = recipeOut(throwIfError(await sb.from('recipes').insert(recipeIn(recipe)).select().single()));
      setRecipes(prev => [...prev, created]);
      return created;
    } catch (e) { showToast('Opslaan mislukt — probeer opnieuw'); return null; }
  }
  async function updateRecipe(id, patch) {
    setRecipes(prev => prev.map(r => r.id === id ? { ...r, ...patch } : r));
    try { throwIfError(await sb.from('recipes').update(recipeIn(patch)).eq('id', id)); }
    catch (e) { showToast('Opslaan mislukt — probeer opnieuw'); }
  }
  async function deleteRecipe(id) {
    setRecipes(prev => prev.filter(r => r.id !== id));
    try { throwIfError(await sb.from('recipes').delete().eq('id', id)); showToast('Recept verwijderd'); }
    catch (e) { showToast('Verwijderen mislukt — probeer opnieuw'); }
  }

  // ---------- weekmenu ----------
  async function updateMealSlot(day, meal, patch) {
    const ws = weekStartRef.current;
    const current = buildWeekmenu(entriesRef.current)[day][meal];
    const next = { ...current, ...patch };
    setEntries([...entriesRef.current.filter(e => !(e.day === day && e.meal === meal)), {
      weekStart: ws, day, meal, persons: next.persons, type: next.category, recipeId: next.recipeId, locked: next.locked,
      feedback: next.feedback, notes: next.notes, componentIds: next.componentIds, aiGenerated: next.aiGenerated,
    }]);
    lastWriteRef.current = Date.now();
    try {
      throwIfError(await sb.from('weekmenu_entries').upsert({
        week_start: ws, day, meal, persons: next.persons, type: next.category || null, recipe_id: next.recipeId || null,
        locked: !!next.locked, feedback: next.feedback || null, notes: next.notes || null,
        component_ids: next.componentIds || [], ai_generated: !!next.aiGenerated,
      }, { onConflict: 'week_start,day,meal' }));
    } catch (e) { showToast('Opslaan mislukt — probeer opnieuw'); }
    lastWriteRef.current = Date.now();
  }

  // 👍/👎 past de sterren aan van álle recepten in die maaltijd; opnieuw
  // tikken maakt het weer ongedaan (vroeger bleef de +1 dan staan).
  async function giveMealFeedback(day, meal, nextFeedback) {
    const slot = buildWeekmenu(entriesRef.current)[day][meal];
    const score = v => v === 'up' ? 1 : v === 'down' ? -1 : 0;
    const delta = score(nextFeedback) - score(slot.feedback);
    await updateMealSlot(day, meal, { feedback: nextFeedback });
    if (!delta) return;
    for (const r of slotRecipes(slot, recipesById)) {
      const ns = Math.max(1, Math.min(5, (r.stars || 3) + delta));
      if (ns !== r.stars) await updateRecipe(r.id, { stars: ns });
    }
    if (nextFeedback) showToast(nextFeedback === 'up' ? '👍 Genoteerd — komt vaker terug' : '👎 Genoteerd — komt minder vaak terug');
  }

  // Een recept vanuit Recepten/Kast rechtstreeks inplannen.
  async function planRecipe(recipeId, day, meal) {
    const r = recipesById[recipeId];
    if (!r) return;
    const s = buildWeekmenu(entriesRef.current)[day][meal];
    const mode = slotMode(s);
    const base = { locked: true, aiGenerated: false, feedback: null };
    if (isComponent(r.category)) {
      if (mode === 'recipe' && s.recipeId) await updateMealSlot(day, meal, { ...base, componentIds: [...new Set([...s.componentIds, recipeId])] });
      else await updateMealSlot(day, meal, { ...base, category: TYPE_COMPOSE, recipeId: '', componentIds: mode === 'compose' ? [...new Set([...s.componentIds, recipeId])] : [recipeId] });
    } else {
      await updateMealSlot(day, meal, { ...base, category: r.category || 'Hoofdmaaltijd', recipeId, componentIds: mode === 'recipe' ? s.componentIds : [] });
    }
    setPlanSheetId(null);
    showToast(`Ingepland: ${day} · ${meal}`, { label: 'Bekijk', onClick: () => { setRecipeSheet(null); setTab('planner'); setSelectedDay(day); } });
  }

  // ---------- AI-planner ----------
  // targets: [{ day, meal, type, keep: [ids] }]. 'keep' = onderdelen die de AI
  // moet laten staan en enkel aanvullen (per-maaltijd "Vul aan met AI").
  async function runAiPlan(targets) {
    setAiBusy(true);
    try {
      const ws = weekStartRef.current;
      const wm = buildWeekmenu(entriesRef.current);
      // historiek: wat de voorbije 4 weken al op tafel kwam (+ vaste keuzes deze week)
      const histRows = throwIfError(await sb.from('weekmenu_entries').select('week_start,recipe_id,component_ids')
        .gte('week_start', addDays(ws, -28)).lt('week_start', ws)) || [];
      const recent = {};
      const note = (id, weeksAgo) => { const r = recipesById[id]; if (r && (recent[r.title] === undefined || weeksAgo < recent[r.title])) recent[r.title] = weeksAgo; };
      histRows.forEach(row => {
        const wa = Math.max(1, Math.round((parseISODate(ws) - parseISODate(row.week_start)) / (7 * 86400000)));
        [row.recipe_id, ...(row.component_ids || [])].filter(Boolean).forEach(id => note(id, wa));
      });
      DAYS.forEach(d => MEALS.forEach(({ key }) => { const s = wm[d][key]; if (s.locked) slotRecipes(s, recipesById).forEach(r => note(r.id, 0)); }));
      const recentHistory = Object.entries(recent).map(([title, weeksAgo]) => ({ title, weeksAgo }));

      const needed = new Set();
      targets.forEach(t => { if (t.type === TYPE_COMPOSE) COMPONENT_CATEGORIES.forEach(c => needed.add(c)); else needed.add(t.type); });
      const pool = recipes.filter(r => needed.has(r.category)).map(r => ({ id: r.id, title: r.title, category: r.category, stars: r.stars }));
      if (!pool.length) { showToast('Er zijn nog geen recepten in die categorie om uit te kiezen.'); return 0; }

      const data = await invokeAi({ task: 'plan_week', slots: targets, recipes: pool, recentHistory });
      let applied = 0;
      for (const a of (data && data.assignments) || []) {
        const t = targets.find(x => x.day === a.day && x.meal === a.meal);
        if (!t) continue;
        if (t.type === TYPE_COMPOSE) {
          const ids = [...new Set([...(t.keep || []), ...((a.componentIds || []).filter(id => recipesById[id]))])];
          if (!ids.length) continue;
          await updateMealSlot(a.day, a.meal, { componentIds: ids, recipeId: '', aiGenerated: true, feedback: null });
          applied++;
        } else if (a.recipeId && recipesById[a.recipeId]) {
          await updateMealSlot(a.day, a.meal, { recipeId: a.recipeId, aiGenerated: true, feedback: null });
          applied++;
        }
      }
      return applied;
    } catch (e) { showToast(e.message || 'AI-invulling mislukt'); return 0; }
    finally { setAiBusy(false); }
  }
  function aiWeekTargets(wm) {
    const t = [];
    DAYS.forEach(day => MEALS.forEach(({ key }) => {
      const s = wm[day][key];
      if (s.category && !NO_RECIPE_TYPES.includes(s.category) && !s.locked) t.push({ day, meal: key, type: s.category, keep: [], filled: slotIsPlanned(s) });
    }));
    return t;
  }
  async function aiFillWeek() {
    const targets = aiWeekTargets(buildWeekmenu(entriesRef.current));
    if (!targets.length) { showToast('Kies eerst bij een maaltijd wat je wil (bv. 🧩 Samenstellen) en laat het slotje open.'); return; }
    const filled = targets.filter(t => t.filled).length;
    if (filled && !window.confirm(`${filled} ingevulde maaltijd(en) staan niet vast 🔒 en worden opnieuw gekozen. Doorgaan?`)) return;
    const n = await runAiPlan(targets.map(({ day, meal, type }) => ({ day, meal, type, keep: [] })));
    if (n) showToast(`✨ ${n} maaltijd(en) ingevuld`);
  }
  async function aiFillSlot(day, meal) {
    const s = buildWeekmenu(entriesRef.current)[day][meal];
    const mode = slotMode(s);
    if (mode !== 'compose' && mode !== 'recipe') return;
    const n = await runAiPlan([{ day, meal, type: s.category, keep: mode === 'compose' ? s.componentIds : [] }]);
    if (n) showToast('✨ Aangevuld door AI');
  }

  // ---------- instellingen / boodschappen ----------
  const SETTINGS_DB_KEYS = { stores: 'stores', checkedItems: 'checked_items', itemStoreMap: 'item_store_map', extraItems: 'extra_items' };
  async function persistSetting(key, setter, value) {
    setter(value);
    lastWriteRef.current = Date.now();
    try { throwIfError(await sb.from('app_settings').upsert({ key: SETTINGS_DB_KEYS[key], value }, { onConflict: 'key' })); }
    catch (e) { showToast('Opslaan mislukt — probeer opnieuw'); }
  }
  function renameStore(oldName, newName) {
    newName = newName.trim();
    if (!newName || newName === oldName) return;
    if (stores.includes(newName)) { showToast('Die winkelnaam bestaat al'); return; }
    const nextMap = {}; Object.entries(itemStoreMap).forEach(([k, v]) => { nextMap[k] = v === oldName ? newName : v; });
    persistSetting('stores', setStores, stores.map(s => s === oldName ? newName : s));
    persistSetting('itemStoreMap', setItemStoreMap, nextMap);
    persistSetting('extraItems', setExtraItems, extraItems.map(it => it.store === oldName ? { ...it, store: newName } : it));
  }
  function removeStore(name) {
    const nextMap = { ...itemStoreMap }; Object.keys(nextMap).forEach(k => { if (nextMap[k] === name) delete nextMap[k]; });
    persistSetting('stores', setStores, stores.filter(s => s !== name));
    persistSetting('itemStoreMap', setItemStoreMap, nextMap);
    persistSetting('extraItems', setExtraItems, extraItems.map(it => it.store === name ? { ...it, store: undefined } : it));
  }
  function addExtraItem(name, store) {
    name = (name || '').trim();
    if (!name) return;
    if (extraItems.some(it => !it.checked && normalize(it.name) === normalize(name))) { showToast(`"${name}" staat al op je lijst`); return; }
    persistSetting('extraItems', setExtraItems, [...extraItems, { id: `x${Date.now()}${Math.floor(Math.random() * 1000)}`, name, store: store || undefined, checked: false }]);
  }
  const shoppingList = useMemo(() => {
    const map = {};
    DAYS.forEach(day => MEALS.forEach(({ key }) => {
      const slot = weekmenu[day][key];
      slotRecipes(slot, recipesById).forEach(recipe => {
        const ratio = recipe.basePortions ? (slot.persons || 1) / recipe.basePortions : 1;
        (recipe.ingredients || []).forEach(ing => {
          if (!ing.name) return;
          const unit = ing.unit || (ing.amount == null ? 'naar smaak' : '');
          const k = `${ing.name.trim().toLowerCase()}|${unit}`;
          if (!map[k]) map[k] = { key: k, name: ing.name.trim(), unit, amount: 0, hasAmount: ing.amount != null, uses: new Set() };
          if (ing.amount != null) map[k].amount += ing.amount * ratio;
          map[k].uses.add(recipe.title);
        });
      });
    }));
    return Object.values(map).map(i => ({ ...i, uses: [...i.uses] })).sort((a, b) => a.name.localeCompare(b.name));
  }, [weekmenu, recipesById]);

  async function newShoppingRound() {
    if (!window.confirm('Alle vinkjes wissen en afgevinkte losse items verwijderen?')) return;
    await persistSetting('checkedItems', setCheckedItems, {});
    await persistSetting('extraItems', setExtraItems, extraItems.filter(it => !it.checked));
    showToast('Klaar voor een nieuwe boodschappenronde');
  }

  // ---------- kast ----------
  async function addPantryStockItem(name) {
    name = (name || '').trim();
    if (!name) return;
    const existing = pantryStock.find(p => normalize(p.name) === normalize(name));
    if (existing) { if (!existing.inStock) togglePantryStockItem(existing.id); return; }
    try {
      const created = pantryOut(throwIfError(await sb.from('pantry_stock').upsert({ ingredient_name: name, in_stock: true }, { onConflict: 'ingredient_name' }).select().single()));
      setPantryStock(prev => [...prev, created]);
    } catch (e) { showToast('Opslaan mislukt — probeer opnieuw'); }
  }
  async function togglePantryStockItem(id) {
    const item = pantryStock.find(p => p.id === id);
    setPantryStock(prev => prev.map(p => p.id === id ? { ...p, inStock: !p.inStock } : p));
    try { throwIfError(await sb.from('pantry_stock').update({ in_stock: item ? !item.inStock : true }).eq('id', id)); }
    catch (e) { showToast('Opslaan mislukt — probeer opnieuw'); }
  }
  async function removePantryStockItem(id) {
    setPantryStock(prev => prev.filter(p => p.id !== id));
    try { throwIfError(await sb.from('pantry_stock').delete().eq('id', id)); }
    catch (e) { showToast('Verwijderen mislukt — probeer opnieuw'); }
  }
  async function aiSuggestFromPantry() {
    const pantryItems = pantryStock.filter(p => p.inStock).map(p => p.name);
    if (!pantryItems.length) { showToast('Zet eerst wat in je kast'); return; }
    setAiSuggesting(true);
    try {
      const data = await invokeAi({ task: 'suggest_recipes', pantryItems, count: 2 });
      const suggestions = (data && data.suggestions) || [];
      if (!suggestions.length) { showToast('AI vond geen voorstellen met deze voorraad'); return; }
      const rows = suggestions.map(s => ({ title: s.title, category: s.category || '', portions_base: s.basePortions || 1,
        ingredients: s.ingredients || [], steps: s.steps || [], based_on_ingredients: pantryItems, status: 'pending' }));
      const created = throwIfError(await sb.from('ai_recipe_suggestions').insert(rows).select());
      setAiSuggestions(prev => [...(created || []).map(suggestionOut), ...prev]);
      showToast(`✨ ${suggestions.length} voorstel(len) klaar`, { label: 'Bekijk', onClick: () => setTab('recipes') });
    } catch (e) { showToast(e.message); }
    finally { setAiSuggesting(false); }
  }

  // ---------- AI-voorstellen ----------
  async function approveSuggestion(id) {
    const s = aiSuggestions.find(x => x.id === id);
    if (!s) return;
    const created = await addRecipe({ title: s.title, category: s.category || 'Hoofdmaaltijd', basePortions: s.basePortions || 1,
      ingredients: s.ingredients, steps: s.steps, source: 'ai-ingredients' });
    if (!created) return;
    setAiSuggestions(prev => prev.filter(x => x.id !== id));
    try { throwIfError(await sb.from('ai_recipe_suggestions').delete().eq('id', id)); } catch (e) {}
    showToast(`"${created.title}" staat bij je recepten`, { label: 'Open', onClick: () => setRecipeSheet({ id: created.id }) });
  }
  async function rejectSuggestion(id) {
    setAiSuggestions(prev => prev.filter(s => s.id !== id));
    try { throwIfError(await sb.from('ai_recipe_suggestions').delete().eq('id', id)); }
    catch (e) { showToast('Verwijderen mislukt — probeer opnieuw'); }
  }

  // ---------- renderen ----------
  if (session === undefined || (session && !loaded)) {
    return (
      <div className="min-h-screen flex flex-col items-center justify-center gap-3">
        <img src="./icon-192.png" alt="" className="w-16 h-16 rounded-2xl shadow-card animate-pulse" />
        <div className="text-sm font-bold text-sage">Laden…</div>
      </div>
    );
  }
  if (!session) {
    return (
      <div className="min-h-screen flex items-center justify-center px-6">
        <div className="w-full max-w-xs text-center">
          <img src="./icon-512.png" alt="Mealio" className="w-32 h-32 rounded-[28px] mx-auto shadow-lift" />
          <h1 className="text-3xl font-black text-deep mt-6 tracking-tight">Mealio</h1>
          <p className="text-sage font-bold">Eet… geregeld</p>
          <p className="text-sm text-stone-500 mt-5">Jullie weekmenu, boodschappen en recepten — samen gepland.</p>
          <Btn size="lg" className="w-full mt-6" icon="logout" onClick={signInWithGoogle}>Inloggen met Google</Btn>
          {authError && <div className="text-xs text-red-600 mt-3">{authError}</div>}
        </div>
      </div>
    );
  }

  const aiTargetCount = aiWeekTargets(weekmenu).length;
  const shoppingTodo = shoppingList.filter(i => !checkedItems[i.key]).length + extraItems.filter(i => !i.checked).length;
  const openMealSlot = mealSheet ? weekmenu[mealSheet.day][mealSheet.meal] : null;
  const openRecipe = recipeSheet ? recipesById[recipeSheet.id] : null;
  const weekNav = {
    weekStart, isCurrent: weekStart === mondayOf(new Date()),
    prev: () => setWeekStart(addDays(weekStart, -7)), next: () => setWeekStart(addDays(weekStart, 7)),
    today: () => setWeekStart(mondayOf(new Date())),
  };
  const openAdd = (preset = {}) => setAddSheet(preset);

  return (
    <div className="min-h-screen">
      <header className="sticky top-0 z-30 bg-cream/90 backdrop-blur border-b border-line/70 pt-safe">
        <div className="max-w-lg mx-auto px-4 py-2.5 flex items-center gap-2.5">
          <img src="./icon-192.png" alt="" className="w-9 h-9 rounded-xl shadow-card" />
          <div className="flex-1 leading-tight">
            <div className="font-black text-deep text-lg tracking-tight">Mealio</div>
            <div className="text-[11px] font-bold text-sage -mt-0.5">Eet… geregeld</div>
          </div>
          <UserMenu email={session.user && session.user.email} onSignOut={() => sb.auth.signOut()} />
        </div>
      </header>

      <main className="max-w-lg mx-auto px-4 pt-4 pb-32">
        {tab === 'planner' && (
          <PlannerPage nav={weekNav} weekmenu={weekmenu} recipesById={recipesById} weekLoading={weekLoading}
            selectedDay={selectedDay} setSelectedDay={setSelectedDay}
            onOpenMeal={(day, meal) => setMealSheet({ day, meal })}
            onToggleLock={(day, meal) => updateMealSlot(day, meal, { locked: !weekmenu[day][meal].locked })}
            onFeedback={giveMealFeedback} aiTargetCount={aiTargetCount} aiBusy={aiBusy} onAiFill={aiFillWeek} />
        )}
        {tab === 'shopping' && (
          <ShoppingPage nav={weekNav} items={shoppingList} stores={stores} itemStoreMap={itemStoreMap}
            checkedItems={checkedItems} extraItems={extraItems} pantryStock={pantryStock}
            onToggle={(key) => persistSetting('checkedItems', setCheckedItems, { ...checkedItems, [key]: !checkedItems[key] })}
            onAssign={(key, store) => persistSetting('itemStoreMap', setItemStoreMap, { ...itemStoreMap, [key]: store || undefined })}
            onAddExtra={addExtraItem}
            onToggleExtra={(id) => persistSetting('extraItems', setExtraItems, extraItems.map(it => it.id === id ? { ...it, checked: !it.checked } : it))}
            onRemoveExtra={(id) => persistSetting('extraItems', setExtraItems, extraItems.filter(it => it.id !== id))}
            onAssignExtra={(id, store) => persistSetting('extraItems', setExtraItems, extraItems.map(it => it.id === id ? { ...it, store: store || undefined } : it))}
            onAddStore={(name) => persistSetting('stores', setStores, [...stores, name])}
            onRenameStore={renameStore} onRemoveStore={removeStore} onNewRound={newShoppingRound} showToast={showToast} />
        )}
        {tab === 'recipes' && (
          <RecipesPage recipes={recipes} suggestions={aiSuggestions} onApprove={approveSuggestion} onReject={rejectSuggestion}
            onOpenRecipe={(id) => setRecipeSheet({ id })} onAdd={() => openAdd({})} />
        )}
        {tab === 'kast' && (
          <KastPage pantryStock={pantryStock} recipes={recipes} onAdd={addPantryStockItem} onToggle={togglePantryStockItem}
            onRemove={removePantryStockItem} onAddToShopping={(name) => { addExtraItem(name); showToast(`🛒 "${name}" op je boodschappenlijst`); }}
            onOpenRecipe={(id) => setRecipeSheet({ id })} onAiSuggest={aiSuggestFromPantry} aiSuggesting={aiSuggesting} />
        )}
      </main>

      <nav className="fixed bottom-0 inset-x-0 z-30 bg-white/95 backdrop-blur border-t border-line pb-safe">
        <div className="max-w-lg mx-auto grid grid-cols-4 px-2 pt-1.5">
          {[
            { id: 'planner', label: 'Planner', icon: 'calendar' },
            { id: 'shopping', label: 'Boodschappen', icon: 'cart', badge: shoppingTodo },
            { id: 'recipes', label: 'Recepten', icon: 'book', badge: aiSuggestions.length, badgeTone: 'amber' },
            { id: 'kast', label: 'Kast', icon: 'box' },
          ].map(t => {
            const active = tab === t.id;
            return (
              <button key={t.id} onClick={() => setTab(t.id)} className="flex flex-col items-center gap-0.5 pb-1">
                <span className={cx('relative px-5 py-1.5 rounded-full transition', active ? 'bg-mint text-forest' : 'text-stone-400')}>
                  <Icon name={t.icon} size={21} stroke={active ? 2.3 : 2} />
                  {t.badge ? <span className={cx('absolute -top-0.5 right-1.5 min-w-[18px] h-[18px] px-1 rounded-full text-[10px] font-black text-white flex items-center justify-center border-2 border-white', t.badgeTone === 'amber' ? 'bg-amber-500' : 'bg-forest')}>{t.badge > 99 ? '99+' : t.badge}</span> : null}
                </span>
                <span className={cx('text-[11px] font-extrabold', active ? 'text-forest' : 'text-stone-400')}>{t.label}</span>
              </button>
            );
          })}
        </div>
      </nav>

      {mealSheet && openMealSlot && (
        <MealSheet key={`${weekStart}-${mealSheet.day}-${mealSheet.meal}`} day={mealSheet.day} meal={mealSheet.meal}
          dayLabel={fmtDayLong(weekStart, DAYS.indexOf(mealSheet.day))} slot={openMealSlot}
          recipes={recipes} recipesById={recipesById} aiBusy={aiBusy}
          onChange={(patch) => updateMealSlot(mealSheet.day, mealSheet.meal, patch)}
          onAiFill={() => aiFillSlot(mealSheet.day, mealSheet.meal)}
          onOpenRecipe={(id) => setRecipeSheet({ id })}
          onCreateRecipe={(preset) => openAdd(preset)}
          onClose={() => setMealSheet(null)} />
      )}
      {recipeSheet && openRecipe && (
        <RecipeSheet key={openRecipe.id} recipe={openRecipe} startInEdit={!!recipeSheet.edit}
          onUpdate={(patch) => updateRecipe(openRecipe.id, patch)}
          onDelete={() => { if (window.confirm(`"${openRecipe.title}" verwijderen?`)) { deleteRecipe(openRecipe.id); setRecipeSheet(null); } }}
          onPlan={() => setPlanSheetId(openRecipe.id)}
          onClose={() => setRecipeSheet(null)} />
      )}
      {addSheet && (
        <AddRecipeSheet preset={addSheet} onClose={() => setAddSheet(null)}
          onSave={async (draft) => {
            const created = await addRecipe(draft);
            if (!created) return false;
            if (addSheet.onCreated) addSheet.onCreated(created.id);
            setAddSheet(null);
            showToast(`"${created.title}" toegevoegd`, addSheet.onCreated ? null : { label: 'Open', onClick: () => setRecipeSheet({ id: created.id }) });
            return true;
          }} />
      )}
      {planSheetId && recipesById[planSheetId] && (
        <PlanSheet recipe={recipesById[planSheetId]} nav={weekNav} weekmenu={weekmenu} recipesById={recipesById}
          onPick={(day, meal) => planRecipe(planSheetId, day, meal)} onClose={() => setPlanSheetId(null)} />
      )}

      {toast && (
        <div className="fixed inset-x-0 flex justify-center px-4 pointer-events-none" style={{ zIndex: 90, bottom: 'calc(env(safe-area-inset-bottom) + 92px)' }}>
          <div className="toast-in pointer-events-auto max-w-md w-full bg-deep text-white rounded-2xl shadow-lift pl-4 pr-2 py-2.5 flex items-center gap-3">
            <div className="flex-1 text-sm font-semibold">{toast.msg}</div>
            {toast.action && <button onClick={() => { toast.action.onClick(); setToast(null); }} className="text-sm font-black text-mint px-3 py-1.5 rounded-xl active:bg-white/10">{toast.action.label}</button>}
          </div>
        </div>
      )}
    </div>
  );
}

function UserMenu({ email, onSignOut }) {
  const [open, setOpen] = useState(false);
  const initial = (email || '?').slice(0, 1).toUpperCase();
  return (
    <div className="relative">
      <button onClick={() => setOpen(!open)} className="w-9 h-9 rounded-full bg-forest text-white font-black text-sm">{initial}</button>
      {open && (
        <>
          <div className="fixed inset-0 z-40" onClick={() => setOpen(false)} />
          <div className="absolute right-0 top-11 z-50 w-60 bg-white rounded-2xl border border-line shadow-lift p-2">
            <div className="px-3 py-2 text-xs text-stone-500 truncate">Ingelogd als<br /><span className="font-bold text-deep">{email}</span></div>
            <button onClick={onSignOut} className="w-full flex items-center gap-2 px-3 py-2.5 rounded-xl text-sm font-bold text-red-600 active:bg-red-50"><Icon name="logout" size={16} />Uitloggen</button>
          </div>
        </>
      )}
    </div>
  );
}

function WeekNav({ nav }) {
  return (
    <>
      {!nav.isCurrent && <Btn variant="soft" size="sm" onClick={nav.today}>Vandaag</Btn>}
      <IconBtn name="left" onClick={nav.prev} title="Vorige week" className="bg-white border border-line" />
      <IconBtn name="right" onClick={nav.next} title="Volgende week" className="bg-white border border-line" />
    </>
  );
}

// =================================================================
// 6. Planner
// =================================================================
function PlannerPage({ nav, weekmenu, recipesById, weekLoading, selectedDay, setSelectedDay, onOpenMeal, onToggleLock, onFeedback, aiTargetCount, aiBusy, onAiFill }) {
  const [view, setView] = useState('day');
  const today = todayISO();
  const dayIdx = DAYS.indexOf(selectedDay);
  const dayCarbs = MEALS.reduce((s, m) => s + (slotCarbs(weekmenu[selectedDay][m.key], recipesById) || 0), 0);

  return (
    <div>
      <PageHeader eyebrow={`Week ${isoWeekNumber(nav.weekStart)}${nav.isCurrent ? ' · deze week' : ''}`} title={fmtWeekRange(nav.weekStart)} right={<WeekNav nav={nav} />} />

      <div className="grid grid-cols-7 gap-1.5 mb-3">
        {DAYS.map((day, i) => {
          const iso = addDays(nav.weekStart, i);
          const sel = view === 'day' && selectedDay === day;
          return (
            <button key={day} onClick={() => { setSelectedDay(day); setView('day'); }}
              className={cx('rounded-2xl pt-2 pb-2 flex flex-col items-center border transition',
                sel ? 'bg-forest border-forest text-white shadow-lift' : 'bg-white border-line text-deep',
                !sel && iso === today && 'ring-2 ring-sage/60')}>
              <span className={cx('text-[10px] font-extrabold uppercase', sel ? 'text-white/70' : 'text-stone-400')}>{DAY_SHORT[i]}</span>
              <span className="text-[17px] font-black leading-none mt-0.5">{parseISODate(iso).getDate()}</span>
              <span className="flex gap-[3px] mt-1.5">
                {MEALS.map(m => {
                  const planned = slotIsPlanned(weekmenu[day][m.key]);
                  return <span key={m.key} className={cx('w-1.5 h-1.5 rounded-full', planned ? (sel ? 'bg-white' : 'bg-sage') : (sel ? 'bg-white/25' : 'bg-stone-200'))} />;
                })}
              </span>
            </button>
          );
        })}
      </div>

      <div className="flex items-center gap-2 mb-4">
        <Segmented className="flex-1" value={view} onChange={setView}
          options={[{ value: 'day', label: 'Dag', icon: 'list' }, { value: 'week', label: 'Hele week', icon: 'grid' }]} />
        {aiTargetCount > 0 && (
          <button onClick={onAiFill} disabled={aiBusy} title={`AI vult ${aiTargetCount} open maaltijd(en) in deze week`}
            className="relative shrink-0 w-11 h-11 rounded-2xl bg-gradient-to-br from-deep to-forest text-white flex items-center justify-center shadow-card disabled:opacity-50 active:scale-95 transition">
            <Icon name="sparkles" size={19} />
            <span className="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-amber-500 text-white text-[10px] font-black flex items-center justify-center border-2 border-cream">
              {aiBusy ? '…' : aiTargetCount}
            </span>
          </button>
        )}
      </div>

      {weekLoading && <div className="text-center text-xs font-bold text-sage mb-3">Week laden…</div>}

      {view === 'day' ? (
        <div className="space-y-3">
          <div className="flex items-baseline justify-between px-1">
            <h3 className="text-base font-black text-deep">{fmtDayLong(nav.weekStart, dayIdx)}</h3>
            {dayCarbs > 0 && <span className="text-xs font-bold text-stone-400">≈ {Math.round(dayCarbs)} g koolhydraten</span>}
          </div>
          {MEALS.map(m => (
            <MealCard key={m.key} meal={m} slot={weekmenu[selectedDay][m.key]} recipesById={recipesById}
              onOpen={() => onOpenMeal(selectedDay, m.key)} onToggleLock={() => onToggleLock(selectedDay, m.key)}
              onFeedback={(v) => onFeedback(selectedDay, m.key, v)} />
          ))}
        </div>
      ) : (
        <div className="space-y-2.5">
          {DAYS.map((day, i) => (
            <Card key={day} className="overflow-hidden">
              <button onClick={() => { setSelectedDay(day); setView('day'); }} className="w-full flex items-center justify-between px-4 pt-3 pb-1.5">
                <span className="font-black text-deep text-sm">{fmtDayLong(nav.weekStart, i)}</span>
                <Icon name="right" size={16} className="text-stone-300" />
              </button>
              {MEALS.map(m => {
                const s = weekmenu[day][m.key];
                const summary = slotSummary(s, recipesById);
                return (
                  <button key={m.key} onClick={() => onOpenMeal(day, m.key)} className="w-full flex items-center gap-2 px-4 py-2 text-left border-t border-line/60 active:bg-mist">
                    <span className="w-16 text-[11px] font-extrabold text-stone-400 shrink-0">{m.emoji} {m.label}</span>
                    <span className={cx('flex-1 text-[13px] truncate', summary ? 'font-semibold text-ink' : 'text-stone-300')}>{summary || 'Nog niets'}</span>
                    {s.aiGenerated && <span className="text-[10px]">✨</span>}
                    {s.locked && <Icon name="lock" size={12} className="text-sage" />}
                  </button>
                );
              })}
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}

function MealCard({ meal, slot, recipesById, onOpen, onToggleLock, onFeedback }) {
  const mode = slotMode(slot);
  const rs = slotRecipes(slot, recipesById);
  const main = slot.recipeId ? recipesById[slot.recipeId] : null;
  const extras = (slot.componentIds || []).map(id => recipesById[id]).filter(Boolean);
  const carbs = slotCarbs(slot, recipesById);
  const idea = (slot.notes || '').includes('\n💡') ? slot.notes.split('\n💡')[1].trim() : '';

  return (
    <Card className="overflow-hidden">
      <div className="flex items-center gap-2 pl-4 pr-2 pt-2.5">
        <span className="text-base">{meal.emoji}</span>
        <span className="font-black text-deep text-sm">{meal.label}</span>
        <span className="text-[11px] text-stone-400 font-bold flex items-center gap-1"><Icon name="users" size={12} />{slot.persons}</span>
        {slot.aiGenerated && <span className="text-[10px] font-black text-sage bg-mist rounded-full px-2 py-0.5">✨ AI</span>}
        <div className="flex-1" />
        <IconBtn name={slot.locked ? 'lock' : 'unlock'} onClick={onToggleLock} active={slot.locked} size={15}
          title={slot.locked ? 'Vast — de AI laat dit staan' : 'Open — de AI mag dit (her)invullen'} />
      </div>

      <button onClick={onOpen} className="w-full text-left px-4 pb-3 pt-1 active:bg-mist/50">
        {mode === 'empty' && (
          <div className="border-2 border-dashed border-line rounded-xl py-3 text-center text-sm font-extrabold text-sage">+ Plan deze maaltijd</div>
        )}
        {mode === 'skip' && <div className="text-sm font-semibold text-stone-400">⏭ Overgeslagen — niets te kopen</div>}
        {mode === 'leftovers' && (
          <div>
            <div className="text-sm font-bold text-ink">🍱 Restjes{slot.notes ? <span className="font-semibold text-stone-500"> · {slot.notes.split('\n')[0].replace(/^Restjes: /, '')}</span> : null}</div>
            {idea && <div className="text-xs text-leaf mt-1 line-clamp-2">💡 {idea}</div>}
          </div>
        )}
        {mode === 'recipe' && (
          main ? (
            <div>
              <div className="flex items-start gap-2">
                <div className="flex-1 min-w-0">
                  <div className="text-[15px] font-extrabold text-ink leading-snug">{main.title}</div>
                  <div className="flex items-center gap-2 mt-1"><CatChip category={main.category} small /><Stars value={main.stars} /></div>
                </div>
              </div>
              {extras.length > 0 && <div className="text-xs font-semibold text-stone-500 mt-1.5">+ {extras.map(e => e.title).join(', ')}</div>}
            </div>
          ) : <div className="text-sm font-bold text-stone-400">{catMeta(slot.category).emoji} {catMeta(slot.category).label} — nog te kiezen <span className="font-semibold">(of laat de AI kiezen)</span></div>
        )}
        {mode === 'compose' && (
          extras.length ? (
            <div className="space-y-1">
              {extras.map(r => (
                <div key={r.id} className="flex items-center gap-2">
                  <span className="w-6 text-center">{catMeta(r.category).emoji}</span>
                  <span className="text-[14px] font-bold text-ink flex-1 min-w-0 truncate">{r.title}</span>
                  <Stars value={r.stars} size={10} />
                </div>
              ))}
            </div>
          ) : <div className="text-sm font-bold text-stone-400">🧩 Samenstellen — kies vlees/vis, groenten, bijgerecht…</div>
        )}
      </button>

      {rs.length > 0 && (
        <div className="flex items-center justify-between pl-4 pr-2 py-1.5 bg-mist/70 border-t border-line/70">
          <span className="text-[11px] font-bold text-stone-500">{carbs != null ? `≈ ${Math.round(carbs)} g koolhydraten` : 'Hoe was het?'}</span>
          <div className="flex items-center">
            <IconBtn name="up" size={15} active={slot.feedback === 'up'} title="Lekker! Vaker"
              onClick={() => onFeedback(slot.feedback === 'up' ? null : 'up')} />
            <IconBtn name="thumbdown" size={15} active={slot.feedback === 'down'} title="Minder vaak"
              onClick={() => onFeedback(slot.feedback === 'down' ? null : 'down')} />
          </div>
        </div>
      )}
    </Card>
  );
}

// Keuzelijst met zoekveld, gebruikt overal waar je een recept kiest.
function RecipePicker({ recipes, categories, excludeIds = [], onPick, onCreate, showCategory }) {
  const [q, setQ] = useState('');
  const list = useMemo(() => recipes
    .filter(r => (!categories || categories.includes(r.category)) && !excludeIds.includes(r.id) && (!q || normalize(r.title).includes(normalize(q))))
    .sort((a, b) => (b.stars || 0) - (a.stars || 0) || a.title.localeCompare(b.title)), [recipes, categories, excludeIds, q]);
  return (
    <div>
      <div className="relative mb-2">
        <Icon name="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-300" />
        <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Zoek een recept…" className={cx(inputCls, 'pl-9 py-2 bg-cream')} />
      </div>
      <div className="max-h-64 overflow-y-auto -mx-1">
        {list.map(r => (
          <button key={r.id} onClick={() => onPick(r.id)} className="w-full flex items-center gap-2.5 px-2 py-2 rounded-xl active:bg-mist text-left">
            <span className="w-9 h-9 rounded-xl bg-cream border border-line flex items-center justify-center text-base shrink-0">{catMeta(r.category).emoji}</span>
            <span className="flex-1 min-w-0">
              <span className="block text-sm font-bold text-ink truncate">{r.title}</span>
              <span className="block text-[11px] text-stone-400">
                {showCategory ? catShort(r.category) + ' · ' : ''}{r.stars ? <Stars value={r.stars} size={10} /> : 'nog geen sterren'}
                {r.carbsPerPortion != null ? ` · ${fmtAmount(r.carbsPerPortion)} g koolh.` : ''}
              </span>
            </span>
            <Icon name="plus" size={18} className="text-sage" />
          </button>
        ))}
        {list.length === 0 && <div className="text-xs text-stone-400 px-2 py-3">Geen recepten gevonden{q ? ` voor "${q}"` : ' in deze categorie'}.</div>}
      </div>
      {onCreate && (
        <button onClick={() => onCreate(q)} className="mt-2 w-full rounded-xl border-2 border-dashed border-sage/40 text-forest text-sm font-extrabold py-2.5">
          + Nieuw recept{categories && categories.length === 1 ? ` (${catShort(categories[0])})` : ''}{q ? ` "${q}"` : ''}
        </button>
      )}
    </div>
  );
}

// Eén rij in "Samenstellen": bv. 🥦 Groenten — gekozen chips + kiezer.
function ComposeRow({ row, ids, recipes, recipesById, open, onToggle, onChange, onOpenRecipe, onCreate }) {

      <div className="flex items-center gap-2 px-3.5 py-2.5">
        <span className="text-lg">{row.emoji}</span>
        <span className="text-sm font-extrabold text-deep flex-1">{row.label}</span>
        <button onClick={onToggle} className={cx('text-xs font-black rounded-full px-3 py-1.5', open ? 'bg-forest text-white' : 'bg-mist text-forest')}>
          {open ? 'Klaar' : ids.length ? '+ Nog één' : '+ Kies'}
        </button>
      </div>
      {ids.length > 0 && (
        <div className="px-3.5 pb-3 flex flex-wrap gap-1.5">
          {ids.map(id => {

            return (

      )}

function MealSheet({ day, meal, dayLabel, slot, recipes, recipesById, aiBusy, onChange, onAiFill, onOpenRecipe, onCreateRecipe, onClose }) {
  const mealDef = MEALS.find(m => m.key === meal);
  const mode = slotMode(slot);
  const [openRow, setOpenRow] = useState(null);
  const [changingRecipe, setChangingRecipe] = useState(false);
  const reset = { aiGenerated: false, feedback: null };

  function setMode(next) {
    if (next === mode) return;
    setOpenRow(null);
    if (next === 'compose') {
      const ids = [...new Set([slot.recipeId, ...slot.componentIds].filter(Boolean))];
      onChange({ ...reset, category: TYPE_COMPOSE, recipeId: '', componentIds: ids, locked: ids.length > 0 });
    } else if (next === 'recipe') {
      onChange({ ...reset, category: meal === 'Ontbijt' ? 'Ontbijt' : 'Hoofdmaaltijd', recipeId: '', locked: false });
      setChangingRecipe(true);
    } else if (next === 'leftovers') onChange({ ...reset, category: TYPE_LEFTOVERS, recipeId: '', componentIds: [], locked: true });
    else if (next === 'skip') onChange({ ...reset, category: TYPE_SKIP, recipeId: '', componentIds: [], notes: '', locked: true });
  }
  function clearMeal() { onChange({ ...reset, category: '', recipeId: '', componentIds: [], notes: '', locked: false }); }
  // zelf kiezen = automatisch "vast", zodat de AI het niet overschrijft
  function setComponents(ids) { onChange({ ...reset, componentIds: ids, locked: ids.length > 0 }); }
  const main = slot.recipeId ? recipesById[slot.recipeId] : null;
  const rowIds = (key) => (slot.componentIds || []).filter(id => roleOf(recipesById[id]) === key);
  const setRowIds = (key, ids) => setComponents([...(slot.componentIds || []).filter(id => roleOf(recipesById[id]) !== key), ...ids]);
  const carbs = slotCarbs(slot, recipesById);

  const MODES = [
    { value: 'compose', emoji: '🧩', label: 'Samenstellen' },
    { value: 'recipe', emoji: '📖', label: 'Eén recept' },
    { value: 'leftovers', emoji: '🍱', label: 'Restjes' },
    { value: 'skip', emoji: '⏭', label: 'Overslaan' },
  ];

  return (
    <Sheet title={`${mealDef.emoji} ${mealDef.label}`} subtitle={dayLabel} onClose={onClose} full
      footer={
        <div className="flex items-center gap-2">
          {mode !== 'empty' && <Btn variant="danger" size="md" icon="trash" onClick={clearMeal}>Leegmaken</Btn>}
          <div className="flex-1" />
          <Btn size="md" onClick={onClose} icon="check">Klaar</Btn>
        </div>
      }>
      <div className="flex items-center justify-between gap-3 mb-4">
        <Stepper value={slot.persons} onChange={(v) => onChange({ persons: v })} label="pers." />
        <button onClick={() => onChange({ locked: !slot.locked })}
          className={cx('flex items-center gap-1.5 rounded-xl px-3 py-2 text-xs font-black', slot.locked ? 'bg-mint text-forest' : 'bg-white border border-line text-stone-500')}>
          <Icon name={slot.locked ? 'lock' : 'unlock'} size={14} />{slot.locked ? 'Vast' : 'AI mag kiezen'}
        </button>
      </div>

      <div className="grid grid-cols-4 gap-1.5 mb-5">
        {MODES.map(m => (
          <button key={m.value} onClick={() => setMode(m.value)}
            className={cx('rounded-2xl py-2.5 flex flex-col items-center gap-1 border transition',
              mode === m.value ? 'bg-forest border-forest text-white shadow-card' : 'bg-white border-line text-deep')}>
            <span className="text-xl leading-none">{m.emoji}</span>
            <span className="text-[11px] font-extrabold">{m.label}</span>
          </button>
        ))}
      </div>

      {mode === 'empty' && (
        <div className="text-center text-sm text-stone-500 px-4 py-6">
          Kies hierboven hoe je deze maaltijd wil plannen.<br />
          <span className="text-xs">Tip: met <b>🧩 Samenstellen</b> combineer je bv. kip + broccoli + aardappelen.</span>
        </div>
      )}

      {mode === 'compose' && (
        <div className="space-y-2.5">
          <p className="text-xs text-stone-500 -mt-1 mb-1">Kies per onderdeel een recept. Leeg laten mag — de AI kan het aanvullen.</p>
          {COMPOSE_ROWS.map(row => (
            <ComposeRow key={row.key} row={row} ids={rowIds(row.key)} recipes={recipes} recipesById={recipesById}
              open={openRow === row.key} onToggle={() => setOpenRow(openRow === row.key ? null : row.key)}
              onChange={(ids) => setRowIds(row.key, ids)} onOpenRecipe={onOpenRecipe} onCreate={onCreateRecipe} />
          ))}
        </div>
      )}

      {mode === 'recipe' && (
        <div className="space-y-3">
          <div className="flex gap-1.5 overflow-x-auto no-scrollbar -mx-5 px-5">
            {DISH_CATEGORIES.map(c => (
              <button key={c} onClick={() => { if (c !== slot.category) { onChange({ ...reset, category: c, recipeId: main && main.category === c ? slot.recipeId : '', locked: false }); setChangingRecipe(true); } }}
                className={cx('shrink-0 rounded-full px-3 py-1.5 text-xs font-extrabold border', slot.category === c ? 'bg-forest text-white border-forest' : 'bg-white text-deep border-line')}>
                {catMeta(c).emoji} {c}
              </button>
            ))}
          </div>
          {main && !changingRecipe ? (
            <Card className="p-3.5">
              <div className="flex items-start gap-3">
                <div className="w-11 h-11 rounded-xl bg-mist flex items-center justify-center text-xl">{catMeta(main.category).emoji}</div>
                <div className="flex-1 min-w-0">
                  <div className="font-extrabold text-ink leading-snug">{main.title}</div>
                  <div className="flex items-center gap-2 mt-1"><Stars value={main.stars} />{main.carbsPerPortion != null && <span className="text-[11px] font-bold text-stone-400">{fmtAmount(main.carbsPerPortion)} g koolh./pers.</span>}</div>
                </div>
              </div>
              <div className="flex gap-2 mt-3">
                <Btn variant="soft" size="sm" icon="book" onClick={() => onOpenRecipe(main.id)}>Bekijk / bewerk</Btn>
                <Btn variant="secondary" size="sm" icon="refresh" onClick={() => setChangingRecipe(true)}>Ander recept</Btn>
              </div>
            </Card>
          ) : (
            <Card className="p-3">
              <RecipePicker recipes={recipes} categories={[slot.category]}
                onPick={(id) => { onChange({ ...reset, recipeId: id, locked: true }); setChangingRecipe(false); }}
                onCreate={(q) => onCreateRecipe({ category: slot.category, title: q, onCreated: (id) => { onChange({ ...reset, recipeId: id, locked: true }); setChangingRecipe(false); } })} />
              {main && <Btn variant="ghost" size="sm" className="mt-1" onClick={() => setChangingRecipe(false)}>Annuleren</Btn>}
            </Card>
          )}
          <ComposeRow row={{ key: 'Erbij', label: 'Erbij (groenten, saus, …)', emoji: '➕', categories: COMPONENT_CATEGORIES }}
            ids={slot.componentIds || []} recipes={recipes} recipesById={recipesById}
            open={openRow === 'Erbij'} onToggle={() => setOpenRow(openRow === 'Erbij' ? null : 'Erbij')}
            onChange={(ids) => onChange({ componentIds: ids })} onOpenRecipe={onOpenRecipe} onCreate={onCreateRecipe} />
        </div>
      )}

      {mode === 'leftovers' && <RestjesBlock slot={slot} onChange={onChange} />}
      {mode === 'skip' && <div className="text-center text-sm text-stone-500 py-6">⏭ Geen maaltijd gepland — hiervoor wordt niets ingekocht.</div>}

      {(mode === 'compose' || mode === 'recipe') && (
        <div className="mt-5 space-y-3">
          {carbs != null && <div className="text-center text-xs font-bold text-stone-400">≈ {Math.round(carbs)} g koolhydraten voor {slot.persons} personen</div>}
          <Btn variant="secondary" className="w-full" icon="sparkles" disabled={aiBusy} onClick={onAiFill}>
            {aiBusy ? 'AI is bezig…' : mode === 'compose' ? (slot.componentIds.length ? 'Vul ontbrekende onderdelen aan met AI' : 'Laat AI dit bord samenstellen') : `Laat AI een ${slot.category.toLowerCase()} kiezen`}
          </Btn>
        </div>
      )}
    </Sheet>
  );
}

function RestjesBlock({ slot, onChange }) {
  const [input, setInput] = useState(() => (slot.notes || '').split('\n💡')[0].replace(/^Restjes: /, ''));
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const idea = (slot.notes || '').includes('\n💡') ? slot.notes.split('\n💡')[1].trim() : '';

  function save(text, ideaText) {
    const base = text.trim() ? `Restjes: ${text.trim()}` : '';
    onChange({ notes: base + (ideaText ? `\n💡 ${ideaText}` : '') });
  }
  async function askAi() {
    if (!input.trim()) return;
    setLoading(true); setError('');
    try {
      const data = await invokeAi({ task: 'restjes_idea', ingredients: input.split(',').map(s => s.trim()).filter(Boolean) });
      save(input, `${data.title ? data.title + ' — ' : ''}${data.idea || ''}`);
    } catch (e) { setError(e.message); } finally { setLoading(false); }
  }
  return (
    <div className="space-y-3">
      <Field label="Welke restjes heb je?" hint="Geen nieuwe boodschappen nodig voor deze maaltijd.">
        <input value={input} onChange={(e) => setInput(e.target.value)} onBlur={() => save(input, idea)}
          onKeyDown={(e) => { if (e.key === 'Enter') askAi(); }} placeholder="bv. kip, broccoli, halve courgette" className={inputCls} />
      </Field>
      <Btn variant="secondary" className="w-full" icon="sparkles" disabled={loading || !input.trim()} onClick={askAi}>{loading ? 'Even denken…' : 'Wat kan ik hiermee maken?'}</Btn>
      {error && <div className="text-xs text-red-600 bg-red-50 border border-red-200 rounded-xl px-3 py-2">{error}</div>}
      {idea && <div className="text-sm text-deep bg-mist border border-mint rounded-2xl px-4 py-3">💡 {idea}</div>}
    </div>
  );
}
