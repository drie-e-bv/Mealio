<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

// =================================================================
// 1. Categorieën & vaste waarden
// =================================================================
// Twee soorten recepten:
//  - "Gerechten": een volledige maaltijd op zich (lasagne, salade, …)
//  - "Onderdelen": één deel van een bord (kip, broccoli, aardappelen, saus)
//    waarmee je in het weekmenu een maaltijd samenstelt.
const DISH_CATEGORIES = ['Hoofdmaaltijd', 'Salade', 'Ontbijt', 'Snack', 'Dessert', 'Extra'];
const COMPONENT_ROLES = ['Eiwit', 'Groenten', 'Bijgerecht', 'Saus'];
const COMPONENT_CATEGORIES = [...COMPONENT_ROLES, 'Onderdeel'];
const CATEGORIES = [...DISH_CATEGORIES, ...COMPONENT_CATEGORIES];
const CAT = {
  Hoofdmaaltijd: { label: 'Hoofdmaaltijd', emoji: '🍽️', chip: 'bg-mint text-forest' },
  Salade:        { label: 'Salade', emoji: '🥗', chip: 'bg-lime-100 text-lime-800' },
  Ontbijt:       { label: 'Ontbijt', emoji: '🍳', chip: 'bg-amber-100 text-amber-800' },
  Snack:         { label: 'Snack', emoji: '🥜', chip: 'bg-sky-100 text-sky-800' },
  Dessert:       { label: 'Dessert', emoji: '🍓', chip: 'bg-pink-100 text-pink-800' },
  Extra:         { label: 'Extra', emoji: '🫙', chip: 'bg-stone-200 text-stone-700' },
  Eiwit:         { label: 'Vlees, vis & veggie', short: 'Vlees/vis', emoji: '🍗', chip: 'bg-rose-100 text-rose-800' },
  Groenten:      { label: 'Groenten', emoji: '🥦', chip: 'bg-emerald-100 text-emerald-800' },
  Bijgerecht:    { label: 'Bijgerecht', emoji: '🥔', chip: 'bg-yellow-100 text-yellow-800' },
  Saus:          { label: 'Saus & dressing', short: 'Saus', emoji: '🥣', chip: 'bg-violet-100 text-violet-800' },
  Onderdeel:     { label: 'Overig onderdeel', short: 'Overig', emoji: '🧩', chip: 'bg-orange-100 text-orange-800' },
};
function catMeta(c) { return CAT[c] || { label: c || 'Geen categorie', emoji: '📄', chip: 'bg-stone-100 text-stone-600' }; }
function catShort(c) { const m = catMeta(c); return m.short || m.label; }
function isComponent(c) { return COMPONENT_CATEGORIES.includes(c); }

const DAYS = ['Maandag', 'Dinsdag', 'Woensdag', 'Donderdag', 'Vrijdag', 'Zaterdag', 'Zondag'];
const DAY_SHORT = ['Ma', 'Di', 'Wo', 'Do', 'Vr', 'Za', 'Zo'];
const MEALS = [
  { key: 'Ontbijt', label: 'Ontbijt', emoji: '☀️', defaultPersons: 2 },
  { key: 'Middag', label: 'Middag', emoji: '🌤️', defaultPersons: 2 },
  { key: 'Avond', label: 'Avond', emoji: '🌙', defaultPersons: 5 },
];
const TYPE_COMPOSE = 'Samenstellen';
const TYPE_LEFTOVERS = 'Restjes';
const TYPE_SKIP = 'Overslaan';
// "Snel noteren": gewoon opschrijven wat je eet ("hamburger, wortel, patatjes"), zonder recept.
const TYPE_FREE = 'Vrij';
const NO_RECIPE_TYPES = [TYPE_LEFTOVERS, TYPE_SKIP, TYPE_FREE];
const STAR_LABELS = {
  1: '± 1x per maand', 2: 'af en toe', 3: 'regelmatig', 4: 'graag vaak', 5: 'mag elke week',
};
// Rijen in de "Samenstellen"-editor. "Overig" vangt al de rest op (ook oude
// recepten met categorie "Onderdeel" of een volledig gerecht als onderdeel).
const COMPOSE_ROWS = [
  ...COMPONENT_ROLES.map(r => ({ key: r, label: CAT[r].label, emoji: CAT[r].emoji, categories: [r] })),
  { key: 'Overig', label: 'Overig (elk recept)', emoji: '🧩', categories: null },
];
function roleOf(recipe) { return recipe && COMPONENT_ROLES.includes(recipe.category) ? recipe.category : 'Overig'; }
// Basisingrediënten die we bij "Wat kan ik maken?" als altijd-in-huis beschouwen.
const PANTRY_BASICS = ['zout', 'peper', 'water', 'olijfolie', 'olie', 'boter'];

// =================================================================
// 2. Helpers
// =================================================================
function cx(...a) { return a.filter(Boolean).join(' '); }
function fmtAmount(n) {
  if (n === null || n === undefined || n === '') return '';
  return String(Math.round(n * 100) / 100).replace('.', ',');
}
function normalize(s) { return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim(); }
function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
// Een kastitem komt overeen met een ingrediënt als het aan het BEGIN van een woord
// staat ("ui" ↔ "uien", "kip" ↔ "kipfilet") — niet midden in een woord ("ui" ↔ "kruiden").
function ingredientMatches(ingName, pantryNorm) {
  const n = normalize(ingName);
  return pantryNorm.some(p => {
    if (!p) return false;
    if (new RegExp(`(^|[^a-z0-9])${escapeRe(p)}`).test(n)) return true;
    // omgekeerd ("verse spinazie" in de kast ↔ ingrediënt "spinazie"), ook enkel op woordbegin
    // zodat "melk" niet matcht met "kokosmelk"
    return n.length >= 4 && new RegExp(`(^|[^a-z0-9])${escapeRe(n)}`).test(p);
  });
}
function matchRecipesToPantry(recipes, pantryList, mode) {
  const userNorm = pantryList.map(normalize).filter(Boolean);
  const basicNorm = PANTRY_BASICS.map(normalize);
  if (userNorm.length === 0) return [];
  return recipes.map(r => {
    const ings = (r.ingredients || []).filter(i => i.name);
    const missing = [];
    let matched = 0, fromUser = 0;
    ings.forEach(ing => {
      if (ingredientMatches(ing.name, userNorm)) { matched++; fromUser++; }
      else if (ingredientMatches(ing.name, basicNorm)) matched++;
      else missing.push(ing.name);
    });
    return { recipe: r, matched, fromUser, total: ings.length, missing, pct: ings.length ? matched / ings.length : 0 };
  }).filter(x => x.fromUser > 0 && (mode !== 'full' || x.missing.length === 0))
    .sort((a, b) => b.pct - a.pct || b.matched - a.matched || a.recipe.title.localeCompare(b.recipe.title));
}

// --- ingrediënten herkennen uit geplakte tekst ---
const UNIT_ALIASES = {
  g: 'g', gram: 'g', gr: 'g', kg: 'kg', kilogram: 'kg', ml: 'ml', cl: 'cl', l: 'l', liter: 'l',
  el: 'el', eetlepel: 'el', eetlepels: 'el', tbsp: 'el', tl: 'tl', theelepel: 'tl', theelepels: 'tl', tsp: 'tl',
  stuk: 'stuks', stuks: 'stuks', teentje: 'teentje', teentjes: 'teentje', snufje: 'snufje', snuifje: 'snufje',
  kopje: 'kopje', blik: 'blik', blikje: 'blikje', bosje: 'bosje', plakje: 'plakje', plakjes: 'plakje', handje: 'handje',
  thl: 'tl', kl: 'tl', koffielepel: 'tl', blikken: 'blik', potten: 'pot', kilo: 'kg',
};
const UNICODE_FRACTIONS = { '½': 0.5, '⅓': 0.333, '⅔': 0.667, '¼': 0.25, '¾': 0.75, '⅛': 0.125 };
function parseIngredientLine(raw) {
  let line = (raw || '').trim();
  if (!line) return null;
  line = line.replace(/^[-•*]\s*/, '');
  Object.entries(UNICODE_FRACTIONS).forEach(([ch, val]) => { line = line.split(ch).join(` ${val} `); });
  line = line.replace(/\s+/g, ' ').trim();
  const m = line.match(/^(\d+\/\d+|\d+[.,]?\d*)\s*([a-zA-Zà-ÿ]*)\s+(.+)$/);
  if (m) {
    let [, amtRaw, unitRaw, name] = m;
    let amt;
    if (amtRaw.includes('/')) { const [a, b] = amtRaw.split('/').map(Number); amt = b ? a / b : null; }
    else amt = parseFloat(amtRaw.replace(',', '.'));
    const unitKey = unitRaw.toLowerCase();
    let unit;
    if (UNIT_ALIASES[unitKey]) unit = UNIT_ALIASES[unitKey];
    else if (unitKey) { name = `${unitRaw} ${name}`; unit = 'stuks'; }
    else unit = 'stuks';
    return { name: name.trim(), amount: isNaN(amt) ? null : amt, unit };
  }
  return { name: line, amount: null, unit: '' };
}
function parseLines(text) {
  return (text || '').split('\n').map(s => s.replace(/^\s*(\d+[\.\)]|[-•*])\s*/, '').trim()).filter(Boolean);
}
function scaleIngredient(ing, ratio) {
  return { ...ing, amount: ing.amount != null && ing.amount !== '' ? Math.round(Number(ing.amount) * ratio * 100) / 100 : null };
}

// --- datums (lokale tijd — géén toISOString, die schuift in België een dag op) ---
function toISODate(dt) {
  return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
}
function parseISODate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); }
function mondayOf(d) {
  const dt = new Date(d); dt.setHours(12, 0, 0, 0);
  const day = dt.getDay();
  dt.setDate(dt.getDate() + ((day === 0 ? -6 : 1) - day));
  return toISODate(dt);
}
function addDays(ws, n) { const dt = parseISODate(ws); dt.setDate(dt.getDate() + n); return toISODate(dt); }
function todayISO() { return toISODate(new Date()); }
function dayIndexOf(iso) { return (parseISODate(iso).getDay() + 6) % 7; }
function fmtWeekRange(ws) {
  const opts = { day: 'numeric', month: 'short' };
  return `${parseISODate(ws).toLocaleDateString('nl-BE', opts)} – ${parseISODate(addDays(ws, 6)).toLocaleDateString('nl-BE', opts)}`;
}
function fmtDayLong(ws, i) {
  const s = parseISODate(addDays(ws, i)).toLocaleDateString('nl-BE', { weekday: 'long', day: 'numeric', month: 'long' });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function isoWeekNumber(ws) {
  const d = parseISODate(ws);
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - yearStart) / 86400000 + 1) / 7);
}

// --- maaltijd-slots ---
// Aantal personen in huis: standaard voor elke nieuwe maaltijd (instelbaar in het menu).
let HOUSEHOLD_SIZE = 5;
// Type dat de "Vul de week"-knop gebruikt voor lege slots.
function defaultTypeFor(mealKey) { return mealKey === 'Ontbijt' ? 'Ontbijt' : 'Hoofdmaaltijd'; }
function emptySlot(mealKey) {
  return { persons: HOUSEHOLD_SIZE, category: '', recipeId: '', locked: false, feedback: null, notes: '', componentIds: [], aiGenerated: false,
    doubleFor: null, leftoverFrom: null, eatenAt: null, pantryUsed: null };
}
function entryToSlot(e) {
  return { persons: e.persons, category: e.type || '', recipeId: e.recipeId || '', locked: !!e.locked, feedback: e.feedback || null,
    notes: e.notes || '', componentIds: e.componentIds || [], aiGenerated: !!e.aiGenerated,
    doubleFor: e.doubleFor || null, leftoverFrom: e.leftoverFrom || null, eatenAt: e.eatenAt || null, pantryUsed: e.pantryUsed || null };
}
// "Kook dubbel": sleutel van een slot, bv. "Woensdag|Avond"
function slotKeyOf(day, meal) { return `${day}|${meal}`; }
function parseSlotKey(k) { const [day, meal] = (k || '').split('|'); return DAYS.includes(day) && MEALS.some(m => m.key === meal) ? { day, meal } : null; }
function slotLabel(k) { const p = parseSlotKey(k); if (!p) return ''; return `${DAY_SHORT[DAYS.indexOf(p.day)]} · ${MEALS.find(m => m.key === p.meal).label.toLowerCase()}`; }
function buildWeekmenu(entries) {
  const wm = {};
  DAYS.forEach(d => { wm[d] = {}; MEALS.forEach(m => { wm[d][m.key] = emptySlot(m.key); }); });
  entries.forEach(e => { if (wm[e.day] && wm[e.day][e.meal]) wm[e.day][e.meal] = entryToSlot(e); });
  return wm;
}
function slotMode(slot) {
  if (slot.category === TYPE_COMPOSE) return 'compose';
  if (slot.category === TYPE_LEFTOVERS) return 'leftovers';
  if (slot.category === TYPE_SKIP) return 'skip';
  if (slot.category === TYPE_FREE) return 'free';
  if (slot.category) return 'recipe';
  return 'empty';
}
function capFirst(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
// "hamburger, wortel en patatjes" → ['Hamburger', 'Wortel', 'Patatjes'] (voor de boodschappenlijst)
function parseFreeItems(text) {
  return [...new Set((text || '').split(/,|;|\+|\n|\s+en\s+|\s+met\s+|\s*&\s*/i)
    .map(s => s.trim().replace(/[.!]+$/, '')).filter(Boolean).map(capFirst))];
}
function slotRecipes(slot, byId) {
  return [slot.recipeId, ...(slot.componentIds || [])].filter(Boolean).map(id => byId[id]).filter(Boolean);
}
function slotCarbs(slot, byId) {
  let t = 0, known = false;
  slotRecipes(slot, byId).forEach(r => { if (r.carbsPerPortion != null) { t += r.carbsPerPortion * slot.persons; known = true; } });
  return known ? t : null;
}
function slotIsPlanned(slot) {
  const mode = slotMode(slot);
  if (mode === 'skip' || mode === 'leftovers') return true;
  if (mode === 'free') return !!(slot.notes || '').trim();
  if (mode === 'recipe') return !!slot.recipeId;
  if (mode === 'compose') return (slot.componentIds || []).length > 0;
  return false;
}
function slotSummary(slot, byId) {
  const mode = slotMode(slot);
  if (mode === 'skip') return 'Overgeslagen';
  if (mode === 'free') return (slot.notes || '').trim() ? '✏️ ' + capFirst(slot.notes.trim()) : '';
  if (mode === 'leftovers') return '🍱 Restjes' + (slot.notes ? ': ' + slot.notes.split('\n')[0].replace(/^Restjes: /, '') : '');
  const titles = slotRecipes(slot, byId).map(r => r.title);
  if (titles.length) return titles.join(' + ');
  if (mode === 'compose') return 'Samenstellen — nog leeg';
  if (mode === 'recipe') return `${catMeta(slot.category).label} — nog te kiezen`;
  return '';
}

// --- boodschappen: eenheden, hoeveelheden, afdelingen ---
function normUnit(u) { const k = (u || '').trim().toLowerCase(); return UNIT_ALIASES[k] || k; }
// Wat je per stuk koopt, rond je naar boven af op een heel getal: 1,25 paprika → 2, 3,75 teentjes → 4.
const COUNT_UNITS = { '': ['', ''], stuks: ['stuk', 'stuks'], teentje: ['teentje', 'teentjes'], blik: ['blik', 'blikken'], blikje: ['blikje', 'blikjes'],
  pot: ['pot', 'potten'], bosje: ['bosje', 'bosjes'], zakje: ['zakje', 'zakjes'], pak: ['pak', 'pakken'], bol: ['bol', 'bollen'] };
function fmtShopAmount(item) {
  if (item.kind === 'free') return `voor ${item.persons} pers.`;
  if (!item.hasAmount) return item.unit || 'naar smaak';
  const unit = item.unit || '';
  if (COUNT_UNITS[unit]) {
    const n = Math.max(1, Math.ceil(item.amount - 1e-9));
    const [one, many] = COUNT_UNITS[unit];
    return `${n}${unit ? ' ' + (n === 1 ? one : many) : ''}`;
  }
  // Gewicht/volume naar winkel-logische stappen: 188 g → 200 g, 1130 g → 1,2 kg
  if (/^(g|gr|gram|ml|cl|l|kg)$/.test(unit)) {
    const a = item.amount;
    const step = a >= 1000 ? 100 : a >= 250 ? 50 : a >= 50 ? 25 : 5;
    const r = Math.max(step, Math.ceil(a / step - 1e-9) * step);
    if ((unit === 'g' || unit === 'gr' || unit === 'gram') && r >= 1000) return `${fmtAmount(r / 1000)} kg`;
    if (unit === 'ml' && r >= 1000) return `${fmtAmount(r / 1000)} l`;
    if (unit === 'kg' || unit === 'l') return `${fmtAmount(Math.round(a * 10) / 10)} ${unit}`;
    return `${fmtAmount(r)} ${unit}`;
  }
  return `${fmtAmount(Math.round(item.amount))} ${unit}`.trim();
}
// Basisvoorraad: zout, peper, olie, kruiden, "naar smaak"… staat bijna altijd in huis en
// hoort niet tussen de echte boodschappen. Enkel volledige woorden ("bloem" ≠ "bloemkool").
const BASIC_WORDS = ['zout', 'zeezout', 'peper', 'olie', 'olijfolie', 'zonnebloemolie', 'kokosolie', 'arachideolie', 'boter', 'water', 'azijn',
  'suiker', 'bloem', 'kruiden', 'italiaanse kruiden', 'provencaalse kruiden', 'mexicaanse kruiden', 'paprikapoeder', 'komijn', 'komijnpoeder',
  'kurkuma', 'saffraan', 'kaneel', 'oregano', 'tijm', 'nootmuskaat', 'chilipoeder', 'chilivlokken', 'cayennepeper', 'knoflookpoeder',
  'uienpoeder', 'kerrie', 'kerriepoeder', 'currypoeder', 'laurier', 'laurierblad', 'bakpoeder', 'korianderzaad', 'mosterdzaad'];
const BASIC_UNITS = ['naar smaak', 'snufje', 'snuifje', 'scheutje', 'mespuntje', 'beetje'];
function isBasicIngredient(item) {
  if (item.kind !== 'recipe') return false;
  if (!item.hasAmount || BASIC_UNITS.includes(normalize(item.unit))) return true;
  const n = normalize(item.name);
  return BASIC_WORDS.some(w => new RegExp(`(^|[^a-z])${escapeRe(w)}($|[^a-z])`).test(n));
}
const AISLES = ['Groenten & fruit', 'Brood', 'Vlees & vis', 'Zuivel & eieren', 'Kaas & charcuterie', 'Droge voeding',
  'Conserven & sauzen', 'Diepvries', 'Dranken & wijn', 'Huishouden', 'Overig'];
// Volgorde van controle telt: specifieke afdelingen eerst (kokosmelk = conserven, niet groenten).
const AISLE_KEYWORDS = [
  ['Huishouden', ['wc-papier', 'wc papier', 'toiletpapier', 'keukenrol', 'afwas', 'vaatwas', 'zeep', 'wasmiddel', 'wasverzachter', 'vuilniszak', 'aluminiumfolie', 'bakpapier', 'huishoudfolie', 'tandpasta', 'shampoo', 'douchegel', 'deodorant', 'luiers', 'batterij', 'schoonmaak', 'spons']],
  ['Diepvries', ['diepvries', 'bevroren', 'ijs', 'ijsblokjes', 'frietjes', 'diepvriesgroenten']],

    throwIfError(await sb.from('shopping_checks').delete().eq('week_start', op.ws).eq('state', 'cart'));
  } else if (op.t === 'extra_put') {
    throwIfError(await sb.from('shopping_extra_items').upsert(op.row, { onConflict: 'id' }));
  } else if (op.t === 'extra_del') {
    throwIfError(await sb.from('shopping_extra_items').delete().eq('id', op.id));
  }
}
// Nog niet verstuurde wijzigingen bovenop geladen data leggen (anders "springen" vinkjes terug).
function applyQueueToChecks(checks, ws) {
  const out = { ...checks };
  QUEUE.forEach(op => {
    if (op.t === 'check' && op.ws === ws) {
      if (op.state) out[op.key] = op.state; else delete out[op.key];
      if (op.state && op.qty != null) out[op.key + '#q'] = op.qty; else delete out[op.key + '#q'];
    }
    else if (op.t === 'checks_clear' && op.ws === ws) Object.keys(out).forEach(k => { if (out[k] === 'cart') { delete out[k]; delete out[k + '#q']; } });
    else if (op.t === 'checks_reset' && op.ws === ws) Object.keys(out).forEach(k => { delete out[k]; });
  });
  return out;
}
function applyQueueToExtras(rows) {
  let out = [...rows];
  QUEUE.forEach(op => {
    if (op.t === 'extra_put') { out = out.filter(r => r.id !== op.row.id); out.push(op.row); }
    else if (op.t === 'extra_del') out = out.filter(r => r.id !== op.id);
  });
  return out;
}

// Scherm aan houden (winkelmodus, kookmodus). Geeft terug of het toestel dit ondersteunt.
function useWakeLock(active) {
  const supported = typeof navigator !== 'undefined' && 'wakeLock' in navigator;
  useEffect(() => {
    if (!active || !supported) return;
    let lock = null, stopped = false;
    const request = async () => { try { lock = await navigator.wakeLock.request('screen'); } catch (e) { /* bv. batterijbesparing */ } };
    request();
    const onVis = () => { if (!stopped && document.visibilityState === 'visible') request(); };
    document.addEventListener('visibilitychange', onVis);
    return () => { stopped = true; document.removeEventListener('visibilitychange', onVis); try { if (lock) lock.release(); } catch (e) {} };
  }, [active, supported]);
  return supported;
}
// Volledig-scherm-overlays buiten de (getransformeerde) sheets renderen.
function Portal({ children }) { return ReactDOM.createPortal(children, document.body); }

// Android-terugknop = één stap terug in de app (venster sluiten, terug naar de planner) i.p.v. de app verlaten.
// Elk open venster/menu legt een stap op de stapel; "terug" sluit het bovenste.
const BACK_STACK = [];
let BACK_IGNORE = 0;
if (typeof window !== 'undefined') {
  window.addEventListener('popstate', () => {
    if (BACK_IGNORE > 0) { BACK_IGNORE--; return; }
    const top = BACK_STACK.pop();
    if (top) { top.popped = true; top.close.current(); }
  });
}
function useBackClose(active, onClose) {
  const ref = useRef(onClose);
  ref.current = onClose;
  useEffect(() => {
    if (!active) return;
    const entry = { close: ref, popped: false };
    BACK_STACK.push(entry);
    try { window.history.pushState({ mealio: BACK_STACK.length }, ''); } catch (e) {}
    return () => {
      const i = BACK_STACK.indexOf(entry);
      if (i >= 0) BACK_STACK.splice(i, 1);
      // zelf gesloten (✕, Klaar…): de stap uit de geschiedenis halen
      if (!entry.popped) { BACK_IGNORE++; try { window.history.back(); } catch (e) { BACK_IGNORE--; } }
    };
  }, [active]); // eslint-disable-line
}

      while (QUEUE.length) {

        try { await runQueueOp(op); }
        catch (e) {
          if (isNetworkError(e)) break;   // geen bereik: later opnieuw
          console.error('Wijziging kon niet opgeslagen worden', op, e);
          if (/does not exist|schema cache|relation/i.test(e.message || '')) setMigrationMissing(true);
          showToast('Opslaan mislukt: ' + (e.message || 'onbekende fout'));

        QUEUE.shift(); persistQueue(); setPendingOps(QUEUE.length);
      }
    } finally { flushingRef.current = false; setPendingOps(QUEUE.length); }
  }
  function enqueue(op) {
    QUEUE.push({ ...op, at: Date.now() }); persistQueue(); setPendingOps(QUEUE.length);
    lastWriteRef.current = Date.now();

      feedback: next.feedback, notes: next.notes, componentIds: next.componentIds, aiGenerated: next.aiGenerated,
      doubleFor: next.doubleFor || null, leftoverFrom: next.leftoverFrom || null, eatenAt: next.eatenAt || null, pantryUsed: next.pantryUsed || null,
    }]);
    lastWriteRef.current = Date.now();
    const row = {
      week_start: ws, day, meal, persons: next.persons, type: next.category || null, recipe_id: next.recipeId || null,
      locked: !!next.locked, feedback: next.feedback || null, notes: next.notes || null,
      component_ids: next.componentIds || [], ai_generated: !!next.aiGenerated,

    if (HAS_V2_COLUMNS) { row.double_for = next.doubleFor || null; row.leftover_from = next.leftoverFrom || null; row.eaten_at = next.eatenAt || null; row.pantry_used = next.pantryUsed || null; }

        delete row.double_for; delete row.leftover_from; delete row.eaten_at; delete row.pantry_used;
        try { throwIfError(await sb.from('weekmenu_entries').upsert(row, { onConflict: 'week_start,day,meal' })); }
        catch (e2) { showToast('Opslaan mislukt — probeer opnieuw'); }

  // 👍/👎 past de sterren aan van álle recepten in die maaltijd; opnieuw
  // tikken maakt het weer ongedaan.
  async function giveMealFeedback(day, meal, nextFeedback) {
    const slot = buildWeekmenu(entriesRef.current)[day][meal];
    const score = v => v === 'up' ? 1 : v === 'down' ? -1 : 0;
    const delta = score(nextFeedback) - score(slot.feedback);
    await updateMealSlot(day, meal, { feedback: nextFeedback });
    if (!delta) return;
    for (const r of slotRecipes(slot, recipesById)) {
      const ns = Math.max(1, Math.min(5, (r.stars || 3) + delta));
      if (ns !== r.stars) await updateRecipe(r.id, { stars: ns });
    }
    if (nextFeedback) showToast(nextFeedback === 'up' ? '👍 Genoteerd — komt vaker terug' : '👎 Genoteerd — komt minder vaak terug');
  }

  // Een recept vanuit Recepten/Kast rechtstreeks inplannen.
  async function planRecipe(recipeId, day, meal) {
    const r = recipesById[recipeId];
    if (!r) return;
    const s = buildWeekmenu(entriesRef.current)[day][meal];
    const mode = slotMode(s);
    const base = { locked: true, aiGenerated: false, feedback: null };
    if (isComponent(r.category)) {
      if (mode === 'recipe' && s.recipeId) await updateMealSlot(day, meal, { ...base, componentIds: [...new Set([...s.componentIds, recipeId])] });
      else await updateMealSlot(day, meal, { ...base, category: TYPE_COMPOSE, recipeId: '', componentIds: mode === 'compose' ? [...new Set([...s.componentIds, recipeId])] : [recipeId] });
    } else {
      await updateMealSlot(day, meal, { ...base, category: r.category || 'Hoofdmaaltijd', recipeId, componentIds: mode === 'recipe' ? s.componentIds : [] });
    }
    setPlanSheetId(null);
    showToast(`Ingepland: ${day} · ${meal}`, { label: 'Bekijk', onClick: () => { setRecipeSheet(null); setTab('planner'); setSelectedDay(day); } });
  }

  // Leegmaken met "ongedaan maken"; ruimt ook een "kook dubbel"-koppeling op.
  async function clearMealSlot(day, meal) {
    const wm = buildWeekmenu(entriesRef.current);
    const me = slotKeyOf(day, meal);
    const before = { ...wm[day][meal] };
    const linked = [];
    [before.doubleFor, before.leftoverFrom].forEach(k => {
      const p = parseSlotKey(k); if (!p) return;
      const other = wm[p.day][p.meal];
      if (other.leftoverFrom === me || other.doubleFor === me) linked.push({ ...p, slot: { ...other } });
    });
    const empty = { category: '', recipeId: '', componentIds: [], notes: '', locked: false, aiGenerated: false, feedback: null, doubleFor: null, leftoverFrom: null };
    await updateMealSlot(day, meal, empty);
    for (const l of linked) {
      if (l.slot.leftoverFrom === me) await updateMealSlot(l.day, l.meal, empty);   // de restjes van deze maaltijd vervallen
      else await updateMealSlot(l.day, l.meal, { doubleFor: null });                 // de bron kookt niet langer dubbel
    }
    showToast(`${meal} op ${day.toLowerCase()} leeggemaakt`, { label: 'Ongedaan maken', onClick: async () => {
      await updateMealSlot(day, meal, before);
      for (const l of linked) await updateMealSlot(l.day, l.meal, l.slot);
      showToast('Teruggezet');
    } });
  }

  // Kook dubbel: bron kookt voor 2 maaltijden, het doel wordt "Restjes van …".
  async function cookDouble(day, meal, tDay, tMeal) {
    const wm = buildWeekmenu(entriesRef.current);
    const src = wm[day][meal];
    const tgt = wm[tDay][tMeal];
    if (slotIsPlanned(tgt) && tgt.leftoverFrom !== slotKeyOf(day, meal)
      && !window.confirm(`${tDay} · ${tMeal} staat al gepland (${slotSummary(tgt, recipesById)}). Vervangen door restjes?`)) return false;
    if (src.doubleFor && src.doubleFor !== slotKeyOf(tDay, tMeal)) await undoDouble(day, meal, true);
    const title = slotRecipes(src, recipesById).map(r => r.title).join(' + ') || 'vorige maaltijd';
    await updateMealSlot(tDay, tMeal, { category: TYPE_LEFTOVERS, recipeId: '', componentIds: [], locked: true, aiGenerated: false, feedback: null,
      notes: `Restjes: ${title}`, leftoverFrom: slotKeyOf(day, meal), doubleFor: null });
    await updateMealSlot(day, meal, { doubleFor: slotKeyOf(tDay, tMeal), locked: true });
    showToast(`🍲 Dubbel koken — restjes op ${tDay.toLowerCase()} (${tMeal.toLowerCase()})`);
    return true;
  }
  async function undoDouble(day, meal, silent) {
    const wm = buildWeekmenu(entriesRef.current);
    const src = wm[day][meal];
    const p = parseSlotKey(src.doubleFor);
    if (p) {
      const t = wm[p.day][p.meal];
      if (t.leftoverFrom === slotKeyOf(day, meal)) await updateMealSlot(p.day, p.meal, { category: '', recipeId: '', componentIds: [], notes: '', locked: false, leftoverFrom: null });
    }
    await updateMealSlot(day, meal, { doubleFor: null });
    if (!silent) showToast('Dubbel koken opgeheven');
  }

  // Kopieer vorige week: neemt over wat vorige week gepland stond; vaste 🔒 maaltijden van deze week blijven.
  async function copyPreviousWeek() {
    const ws = weekStartRef.current;

    try { prev = (throwIfError(await sb.from('weekmenu_entries').select('*').eq('week_start', addDays(ws, -7))) || []).map(weekmenuOut); }

    prev = prev.filter(e => slotIsPlanned(entryToSlot(e)));
    if (!prev.length) { showToast('Vorige week is leeg — niets om te kopiëren'); return; }
    const wm = buildWeekmenu(entriesRef.current);
    const todo = prev.filter(e => !slotIsPlanned(wm[e.day][e.meal]));   // enkel lege maaltijden invullen
    const kept = prev.length - todo.length;
    if (!todo.length) { showToast('Deze week is al volledig gepland — niets gekopieerd'); return; }
    for (const e of todo) {
      await updateMealSlot(e.day, e.meal, { persons: e.persons, category: e.type, recipeId: e.recipeId, componentIds: e.componentIds, notes: e.notes,

    }
    showToast(`📋 ${todo.length} lege maaltijd(en) ingevuld met vorige week${kept ? ` · ${kept} bleven staan` : ''}`, { label: 'Ongedaan', onClick: async () => {
      for (const e of todo) await updateMealSlot(e.day, e.meal, { category: '', recipeId: '', componentIds: [], notes: '', locked: false, aiGenerated: false, feedback: null, doubleFor: null, leftoverFrom: null });
    } });

  // ---------- AI-planner ----------
  // targets: [{ day, meal, type, keep: [ids] }]. 'keep' = onderdelen die de AI
  // moet laten staan en enkel aanvullen (per-maaltijd "Vul aan met AI").
  async function runAiPlan(targets) {
    setAiBusy(true);
    try {
      const ws = weekStartRef.current;
      const wm = buildWeekmenu(entriesRef.current);
      // historiek: wat de voorbije 4 weken al op tafel kwam (+ vaste keuzes deze week)
      const histRows = throwIfError(await sb.from('weekmenu_entries').select('week_start,recipe_id,component_ids')
        .gte('week_start', addDays(ws, -28)).lt('week_start', ws)) || [];
      const recent = {};
      const note = (id, weeksAgo) => { const r = recipesById[id]; if (r && (recent[r.title] === undefined || weeksAgo < recent[r.title])) recent[r.title] = weeksAgo; };
      histRows.forEach(row => {
        const wa = Math.max(1, Math.round((parseISODate(ws) - parseISODate(row.week_start)) / (7 * 86400000)));
        [row.recipe_id, ...(row.component_ids || [])].filter(Boolean).forEach(id => note(id, wa));
      });
      DAYS.forEach(d => MEALS.forEach(({ key }) => { const s = wm[d][key]; if (s.locked) slotRecipes(s, recipesById).forEach(r => note(r.id, 0)); }));
      const recentHistory = Object.entries(recent).map(([title, weeksAgo]) => ({ title, weeksAgo }));

      // Gezinsvoorkeuren: allergieën gaan er hier al uit, "lust niet" krijgt een vlag.
      const allergyTerms = members.flatMap(m => (m.restrictions || []).filter(r => r.kind === 'allergie').map(r => normalize(r.term))).filter(Boolean);
      const dislikes = members.flatMap(m => (m.restrictions || []).filter(r => r.kind !== 'allergie' && r.term).map(r => ({ who: m.name, term: r.term })));
      const needed = new Set();
      targets.forEach(t => { if (t.type === TYPE_COMPOSE) COMPONENT_CATEGORIES.forEach(c => needed.add(c)); else needed.add(t.type); });
      const pool = recipes
        .filter(r => needed.has(r.category) && !allergyTerms.some(t => recipeContains(r, t)))
        .map(r => ({ id: r.id, title: r.title, category: r.category, stars: r.stars,
          dislikedBy: dislikes.filter(d => recipeContains(r, normalize(d.term))).map(d => `${d.who}: ${d.term}`) }));
      if (!pool.length) { showToast('Er zijn nog geen (toegelaten) recepten in die categorie om uit te kiezen.'); return 0; }

      const data = await invokeAi({ task: 'plan_week', slots: targets, recipes: pool, recentHistory,
        allergies: [...new Set(members.flatMap(m => (m.restrictions || []).filter(r => r.kind === 'allergie').map(r => r.term)))], avoid: dislikes });
      const poolIds = new Set(pool.map(p => p.id));
      let applied = 0;
      for (const a of (data && data.assignments) || []) {
        const t = targets.find(x => x.day === a.day && x.meal === a.meal);
        if (!t) continue;
        if (t.type === TYPE_COMPOSE) {
          const ids = [...new Set([...(t.keep || []), ...((a.componentIds || []).filter(id => recipesById[id] && poolIds.has(id)))])];
          if (!ids.length) continue;
          await updateMealSlot(a.day, a.meal, { category: TYPE_COMPOSE, componentIds: ids, recipeId: '', aiGenerated: true, feedback: null });
          applied++;
        } else if (a.recipeId && recipesById[a.recipeId] && poolIds.has(a.recipeId)) {

    if (itemStoreAisleMap[name]) { const nm = { ...itemStoreAisleMap }; delete nm[name]; persistSetting('itemStoreAisleMap', setItemStoreAisleMap, nm); }
    extraRows.filter(r => r.store === name).forEach(r => putExtra({ ...r, store: null }));
    staples.filter(s => s.store === name).forEach(s => updateStaple(s.id, { store: null }));
  }

  // ---------- kast ----------
  const pantryRef = useRef([]);
  pantryRef.current = pantryStock;
  async function addPantryStockItem(name) { return addManyToPantry([{ name, qty: null, unit: '' }]); }
  // Meerdere dingen in de kast zetten (bv. na het winkelen). Zelfde naam = hoeveelheid erbij tellen.
  async function addManyToPantry(list) {
    let cur = [...pantryRef.current];
    let n = 0;
    for (const it of list) {
      const name = (it.name || '').trim(); if (!name) continue;
      const ex = cur.find(p => normalize(p.name) === normalize(name));
      let row;
      if (ex) {
        let qty = ex.inStock ? ex.qty : null, unit = ex.unit || '';
        if (it.qty != null) {
          if (qty == null) { qty = it.qty; unit = it.unit || ''; }
          else { const c = convertQty(it.qty, it.unit, unit); if (c != null) qty += c; else { qty = it.qty; unit = it.unit || ''; } }
        }
        row = { ingredient_name: ex.name, in_stock: true, qty, unit: unit || null };
      } else row = { ingredient_name: name, in_stock: true, qty: it.qty, unit: it.unit || null };
      try {
        const saved = pantryOut(throwIfError(await sb.from('pantry_stock').upsert(row, { onConflict: 'ingredient_name' }).select().single()));
        cur = [...cur.filter(p => p.id !== saved.id), saved]; n++;
      } catch (e) { console.error(e); }
    }
    setPantryStock(cur); pantryRef.current = cur;
    if (n < list.filter(i => (i.name || '').trim()).length) showToast('Niet alles kon in de kast — controleer je verbinding');
    return n;
  }
  async function updatePantryItem(id, patch) {
    setPantryStock(prev => prev.map(p => p.id === id ? { ...p, ...patch } : p));
    const row = {};
    if ('inStock' in patch) row.in_stock = patch.inStock;
    if ('qty' in patch) row.qty = patch.qty;
    if ('unit' in patch) row.unit = patch.unit || null;
    try { throwIfError(await sb.from('pantry_stock').update(row).eq('id', id)); }
    catch (e) { showToast('Opslaan mislukt — probeer opnieuw'); }
  }
  async function togglePantryStockItem(id) {
    const item = pantryStock.find(p => p.id === id);
    // op → in huis: hoeveelheid vergeten (onbekend); in huis → op: hoeveelheid 0
    return updatePantryItem(id, item && item.inStock ? { inStock: false, qty: null } : { inStock: true });
  }
  // meerdere tegelijk verwijderen (Opkuisen), met Ongedaan
  function removeManyPantry(list) {
    const rows = list.map(p => ({ ...p }));
    rows.forEach(p => removePantryStockItem(p.id));
    showToast(`🗑 ${rows.length} items uit de voorraad`, { label: 'Ongedaan', onClick: async () => {
      try {
        const back = throwIfError(await sb.from('pantry_stock').upsert(rows.map(p => ({ ingredient_name: p.name, in_stock: p.inStock, qty: p.qty, unit: p.unit || null })), { onConflict: 'ingredient_name' }).select()) || [];
        setPantryStock(prev => [...prev.filter(x => !back.some(r => r.id === x.id)), ...back.map(pantryOut)]);
      } catch (e) { showToast('Terugzetten mislukt — probeer opnieuw'); }
    } });
  }
  async function removePantryStockItem(id) {
    setPantryStock(prev => prev.filter(p => p.id !== id));
    try { throwIfError(await sb.from('pantry_stock').delete().eq('id', id)); }
    catch (e) { showToast('Verwijderen mislukt — probeer opnieuw'); }
  }
  async function aiSuggestFromPantry() {
    const pantryItems = pantryStock.filter(p => p.inStock).map(p => p.name);
    if (!pantryItems.length) { showToast('Zet eerst wat in je kast'); return; }
    setAiSuggesting(true);
    try {
      const data = await invokeAi({ task: 'suggest_recipes', pantryItems, count: 2 });
      const suggestions = (data && data.suggestions) || [];
      if (!suggestions.length) { showToast('AI vond geen voorstellen met deze voorraad'); return; }
      const rows = suggestions.map(s => ({ title: s.title, category: s.category || '', portions_base: s.basePortions || 1,
        ingredients: s.ingredients || [], steps: s.steps || [], based_on_ingredients: pantryItems, status: 'pending' }));
      const created = throwIfError(await sb.from('ai_recipe_suggestions').insert(rows).select());
      setAiSuggestions(prev => [...(created || []).map(suggestionOut), ...prev]);
      showToast(`✨ ${suggestions.length} voorstel(len) klaar`, { label: 'Bekijk', onClick: () => switchTab('keuken', 'recepten') });
    } catch (e) { showToast(e.message); }
    finally { setAiSuggesting(false); }
  }

  // ---------- AI-voorstellen ----------
  async function approveSuggestion(id) {
    const s = aiSuggestions.find(x => x.id === id);
    if (!s) return;
    const created = await addRecipe({ title: s.title, category: s.category || 'Hoofdmaaltijd', basePortions: s.basePortions || 1,
      ingredients: s.ingredients, steps: s.steps, source: 'ai-ingredients' });
    if (!created) return;
    setAiSuggestions(prev => prev.filter(x => x.id !== id));
    try { throwIfError(await sb.from('ai_recipe_suggestions').delete().eq('id', id)); } catch (e) {}
    showToast(`"${created.title}" staat bij je recepten`, { label: 'Open', onClick: () => setRecipeSheet({ id: created.id }) });
  }
  async function rejectSuggestion(id) {
    setAiSuggestions(prev => prev.filter(s => s.id !== id));
    try { throwIfError(await sb.from('ai_recipe_suggestions').delete().eq('id', id)); }
    catch (e) { showToast('Verwijderen mislukt — probeer opnieuw'); }
  }

  // ---------- renderen ----------
  if (session === undefined || (session && !loaded)) {
    return (
      <div className="min-h-screen flex flex-col items-center justify-center gap-3">
        <img src="./icon-192.png" alt="" className="w-16 h-16 rounded-2xl shadow-card animate-pulse" />
        <div className="text-sm font-bold text-sage">Laden…</div>
      </div>
    );
  }
  if (!session) {
    return (
      <div className="min-h-screen flex items-center justify-center px-6">
        <div className="w-full max-w-xs text-center">
          <img src="./icon-512.png" alt="Mealio" className="w-32 h-32 rounded-[28px] mx-auto shadow-lift" />
          <h1 className="text-3xl font-black text-deep mt-6 tracking-tight">Mealio</h1>
          <p className="text-sage font-bold">Eet… geregeld</p>
          <p className="text-sm text-stone-500 mt-5">Jullie weekmenu, boodschappen en recepten — samen gepland.</p>
          <Btn size="lg" className="w-full mt-6" icon="logout" onClick={signInWithGoogle}>Inloggen met Google</Btn>
          {authError && <div className="text-xs text-red-600 mt-3">{authError}</div>}
        </div>
      </div>
    );
  }

  const myEmail = session.user && session.user.email;
  const aiTargetCount = aiWeekTargets(weekmenu).length;
  const shoppingTodo = shoppingItems.filter(i => !i.state).length;                 // lijst: nog te controleren
  const basketTodo = shoppingItems.filter(i => i.state === 'buy').length;            // winkelen: nog te halen
  const openMealSlot = mealSheet ? weekmenu[mealSheet.day][mealSheet.meal] : null;
  const openRecipe = recipeSheet ? recipesById[recipeSheet.id] : null;
  const weekNav = {
    weekStart, isCurrent: weekStart === mondayOf(new Date()),
    prev: () => setWeekStart(addDays(weekStart, -7)), next: () => setWeekStart(addDays(weekStart, 7)),
    today: () => setWeekStart(mondayOf(new Date())),
    // vorige/volgende dag, over de weekgrens heen (zondag → maandag volgende week)
    shiftDay: (d) => {
      const i = DAYS.indexOf(selectedDay) + d;
      if (i >= 0 && i < DAYS.length) { setSelectedDay(DAYS[i]); return; }
      setWeekStart(addDays(weekStart, i < 0 ? -7 : 7));
      setSelectedDay(i < 0 ? DAYS[DAYS.length - 1] : DAYS[0]);
    },
  };
  const openAdd = (preset = {}) => setAddSheet(preset);

  return (
    <div className="min-h-screen">
      <header className="sticky top-0 z-30 bg-cream/90 backdrop-blur border-b border-line/70 pt-safe">
        <div className="max-w-lg mx-auto px-4 py-2.5 flex items-center gap-2.5">
          <img src="./icon-192.png" alt="" className="w-9 h-9 rounded-xl shadow-card" />
          <div className="flex-1 leading-tight">
            <div className="font-black text-deep text-lg tracking-tight">Mealio</div>
            <div className="text-[11px] font-bold text-sage -mt-0.5">Eet… geregeld</div>
          </div>
          {(!online || pendingOps > 0) && (
            <span className="text-[10px] font-black rounded-full px-2 py-1 bg-amber-100 text-amber-800" title="Wijzigingen worden verstuurd zodra er weer bereik is">
              {online ? `${pendingOps} te versturen` : 'offline'}
            </span>
          )}
          <button onClick={() => setSettingsOpen(true)} aria-label="Instellingen" title="Instellingen"
            className="w-9 h-9 rounded-full bg-forest text-white font-black text-sm">{(myEmail || '?').slice(0, 1).toUpperCase()}</button>
        </div>
      </header>

      <main className="max-w-lg mx-auto px-4 pt-4 pb-32">
        {migrationMissing && (
          <div className="mb-3 text-xs font-bold text-amber-900 bg-amber-50 border border-amber-200 rounded-2xl px-3.5 py-2.5">
            ⚠️ De database is nog niet bijgewerkt voor deze versie. Voer <b>migratie-mealio-v2.sql</b> uit in de Supabase SQL Editor — tot dan werken boodschappen, gezin en dubbel koken niet volledig.
          </div>
        )}
        {tab === 'planner' && (
          <PlannerPage nav={weekNav} weekmenu={weekmenu} recipesById={recipesById} weekLoading={weekLoading} members={members}
            selectedDay={selectedDay} setSelectedDay={setSelectedDay}
            onOpenMeal={(day, meal) => setMealSheet({ day, meal })}
            onToggleLock={(day, meal) => updateMealSlot(day, meal, { locked: !weekmenu[day][meal].locked })}
            onFeedback={giveMealFeedback} onEaten={markEaten} onEatenRate={async (d, m, v) => { await markEaten(d, m, true); await giveMealFeedback(d, m, v); }}
            todo={{ basket: shoppingEnabled ? basketTodo : 0, choose: shoppingEnabled ? shoppingTodo : 0, out: pantryStock.filter(p => !p.inStock).length }}
            onGo={(t, v) => switchTab(t, v)} aiTargetCount={aiTargetCount} aiBusy={aiBusy} onAiFill={aiFillWeek}
            onCopyPrev={copyPreviousWeek} showToast={showToast} />
        )}
        {tab === 'winkel' && shoppingEnabled && (
          <WinkelPage items={shoppingItems} stores={stores} onStoreMode={(s) => setStoreMode(s)} onGoList={() => switchTab('shopping')} />
        )}
        {tab === 'shopping' && shoppingEnabled && (
          <ShoppingPage nav={weekNav} items={shoppingItems} stores={stores} storeAisles={storeAisles}
            online={online} pendingOps={pendingOps}
            onSetState={setItemState} onBulkState={bulkState} onAssignStore={assignStore} onAssignAisle={assignAisle} onRemoveItem={removeItem}
            onAddExtra={addExtraItem} onNewRound={newShoppingRound} onGoShop={() => switchTab('winkel')} showToast={showToast} />
        )}
        {tab === 'keuken' && (
          <Segmented className="mb-4" value={keukenView} onChange={(v) => switchTab('keuken', v)}
            options={[{ value: 'recepten', label: 'Recepten', icon: 'book' }, { value: 'voorraad', label: 'Voorraad', icon: 'box' }]} />
        )}
        {tab === 'keuken' && keukenView === 'recepten' && (
          <RecipesPage recipes={recipes} suggestions={aiSuggestions} onApprove={approveSuggestion} onReject={rejectSuggestion}
            onOpenRecipe={(id) => setRecipeSheet({ id })} onAdd={() => openAdd({})} />
        )}
        {tab === 'keuken' && keukenView === 'voorraad' && (
          <KastPage pantryStock={pantryStock} recipes={recipes} onAdd={addPantryStockItem} onToggle={togglePantryStockItem} onUpdate={updatePantryItem} onRemoveMany={removeManyPantry}
            onRemove={removePantryStockItem} onAddToShopping={shoppingEnabled ? (name) => { if (addExtraItem(name)) showToast(`🛒 "${name}" op je boodschappenlijst`); } : null}
            onOpenRecipe={(id) => setRecipeSheet({ id })} onAiSuggest={aiSuggestFromPantry} aiSuggesting={aiSuggesting} showToast={showToast} />
        )}
      </main>

      <nav className="fixed bottom-0 inset-x-0 z-30 bg-white/95 backdrop-blur border-t border-line pb-safe">
        <div className={cx('max-w-lg mx-auto grid px-1 pt-1.5', shoppingEnabled ? 'grid-cols-4' : 'grid-cols-2')}>
          {[
            { id: 'planner', label: 'Week', icon: 'calendar' },
            shoppingEnabled && { id: 'shopping', label: 'Lijst', icon: 'list', badge: shoppingTodo },
            shoppingEnabled && { id: 'winkel', label: 'Winkelen', icon: 'cart', badge: basketTodo },
            { id: 'keuken', label: 'Keuken', icon: 'book', badge: aiSuggestions.length, badgeTone: 'amber' },
          ].filter(Boolean).map(t => {
            const active = tab === t.id;
            return (
              <button key={t.id} onClick={() => switchTab(t.id)} className="flex flex-col items-center gap-0.5 pb-1">
                <span className={cx('relative py-1.5 rounded-full transition', 'px-5', active ? 'bg-mint text-forest' : 'text-stone-400')}>
                  <Icon name={t.icon} size={21} stroke={active ? 2.3 : 2} />
                  {t.badge ? <span className={cx('absolute -top-0.5 right-1.5 min-w-[18px] h-[18px] px-1 rounded-full text-[10px] font-black text-white flex items-center justify-center border-2 border-white', t.badgeTone === 'amber' ? 'bg-amber-500' : 'bg-forest')}>{t.badge > 99 ? '99+' : t.badge}</span> : null}
                </span>
                <span className={cx('text-[11px] font-extrabold', active ? 'text-forest' : 'text-stone-400')}>{t.label}</span>
              </button>
            );
          })}
        </div>
      </nav>

      {mealSheet && openMealSlot && (
        <MealSheet key={`${weekStart}-${mealSheet.day}-${mealSheet.meal}`} day={mealSheet.day} meal={mealSheet.meal}
          dayLabel={fmtDayLong(weekStart, DAYS.indexOf(mealSheet.day))} slot={openMealSlot} weekmenu={weekmenu}
          recipes={recipes} recipesById={recipesById} aiBusy={aiBusy} members={members}
          onChange={(patch) => updateMealSlot(mealSheet.day, mealSheet.meal, patch)}
          onClear={() => { clearMealSlot(mealSheet.day, mealSheet.meal); setMealSheet(null); }}
          onCookDouble={(tDay, tMeal) => cookDouble(mealSheet.day, mealSheet.meal, tDay, tMeal)}
          onUndoDouble={() => {
            const s = openMealSlot;
            if (s.doubleFor) undoDouble(mealSheet.day, mealSheet.meal);
            else { const p = parseSlotKey(s.leftoverFrom); if (p) undoDouble(p.day, p.meal); }
          }}
          onAiFill={() => aiFillSlot(mealSheet.day, mealSheet.meal)}
          onOpenRecipe={(id) => setRecipeSheet({ id })}
          onCreateRecipe={(preset) => openAdd(preset)}
          onClose={() => setMealSheet(null)} />
      )}
      {recipeSheet && openRecipe && (
        <RecipeSheet key={openRecipe.id} recipe={openRecipe} startInEdit={!!recipeSheet.edit} householdSize={householdSize}
          onUpdate={(patch) => updateRecipe(openRecipe.id, patch)}
          onDelete={() => { if (window.confirm(`"${openRecipe.title}" verwijderen?`)) { deleteRecipe(openRecipe.id); setRecipeSheet(null); } }}
          onPlan={() => setPlanSheetId(openRecipe.id)}
          onClose={() => setRecipeSheet(null)} />
      )}
      {addSheet && (
        <AddRecipeSheet preset={addSheet} onClose={() => setAddSheet(null)}
          onSave={async (draft) => {
            const created = await addRecipe(draft);
            if (!created) return false;
            if (addSheet.onCreated) addSheet.onCreated(created.id);
            setAddSheet(null);
            showToast(`"${created.title}" toegevoegd`, addSheet.onCreated ? null : { label: 'Open', onClick: () => setRecipeSheet({ id: created.id }) });
            return true;
          }} />
      )}
      {planSheetId && recipesById[planSheetId] && (
        <PlanSheet recipe={recipesById[planSheetId]} nav={weekNav} weekmenu={weekmenu} recipesById={recipesById}
          onPick={(day, meal) => planRecipe(planSheetId, day, meal)} onClose={() => setPlanSheetId(null)} />
      )}
      {settingsOpen && (
        <SettingsSheet email={myEmail} household={householdSize} onHousehold={changeHousehold} shoppingEnabled={shoppingEnabled}
          membersCount={members.length} storesCount={stores.length} staplesCount={staples.filter(x => x.active).length}
          onShoppingEnabled={(v) => { persistSetting('shoppingEnabled', setShoppingEnabled, v); if (!v) { setStoreMode(null); if (tab === 'shopping' || tab === 'winkel') setTab('planner'); } showToast(v ? 'Boodschappenlijst staat aan' : 'Boodschappenlijst staat uit'); }}
          onOpenFamily={() => setFamilyOpen(true)} onOpenAccess={() => setAccessOpen(true)}
          onOpenStores={() => setStoresOpen(true)} onOpenStaples={() => setStaplesOpen(true)}
          onSignOut={() => sb.auth.signOut()} onClose={() => setSettingsOpen(false)} />
      )}
      {storesOpen && <StoresSheet stores={stores} storeAisles={storeAisles} mainStore={mainStore} onSetMain={(st) => persistSetting('mainStore', setMainStore, st)} onAdd={(name) => persistSetting('stores', setStores, [...stores, name])} onRename={renameStore} onRemove={removeStore}
        onSetAisleOrder={setStoreAisleList} onRenameAisle={renameStoreAisle} onRemoveAisle={removeStoreAisle} onResetAisles={resetStoreAisles} onClose={() => setStoresOpen(false)} />}
      {staplesOpen && <StaplesSheet staples={staples} stores={stores} onAdd={addStaple} onUpdate={updateStaple} onDelete={deleteStaple} onClose={() => setStaplesOpen(false)} />}
      {familyOpen && (
        <FamilySheet members={members} onAdd={addMember} onUpdate={updateMember} onDelete={deleteMember} onClose={() => setFamilyOpen(false)} />
      )}
      {accessOpen && <AccessSheet myEmail={myEmail} onClose={() => setAccessOpen(false)} />}
      {storeMode && shoppingEnabled && (
        <StoreMode storeKey={storeMode} weekLabel={`Week ${isoWeekNumber(weekStart)}`} items={shoppingItems} storeAisles={storeAisles}
          online={online} pendingOps={pendingOps} onToggle={toggleCart}
          onAddExtra={(name) => addExtraItem(name, storeMode === '__all__' ? '' : storeMode)}
          onFinish={finishShopping} onClose={() => setStoreMode(null)} />
      )}

      {toast && (
        <div className="fixed inset-x-0 flex justify-center px-4 pointer-events-none" style={{ zIndex: 95, bottom: 'calc(env(safe-area-inset-bottom) + 92px)' }}>
          <div className="toast-in pointer-events-auto max-w-md w-full bg-deep text-white rounded-2xl shadow-lift pl-4 pr-2 py-2.5 flex items-center gap-3">
            <div className="flex-1 text-sm font-semibold">{toast.msg}</div>
            {toast.action && <button onClick={() => { toast.action.onClick(); setToast(null); }} className="text-sm font-black text-mint px-3 py-1.5 rounded-xl active:bg-white/10 whitespace-nowrap">{toast.action.label}</button>}
          </div>
        </div>
      )}
    </div>
  );
}

// Alle instellingen op één plek (letter rechtsboven)

  onOpenFamily, onOpenAccess, onOpenStores, onOpenStaples, onSignOut, onClose }) {

    <button onClick={onClick} className="w-full flex items-center gap-3 px-4 py-3.5 text-left active:bg-mist">
      <span className="text-xl w-7 text-center">{emoji}</span>
      <span className="flex-1 min-w-0"><span className="block text-[15px] font-extrabold text-deep">{label}</span>{sub && <span className="block text-[12px] text-stone-500">{sub}</span>}</span>

    <Sheet title="Instellingen" subtitle={`Ingelogd als ${email || '—'}`} onClose={onClose}>

          <Row emoji="👨‍👩‍👧‍👦" label="Gezin & voorkeuren" sub={membersCount ? `${membersCount} gezinsleden · allergieën en wat ze niet lusten` : 'Allergieën en wat iemand niet lust'} onClick={onOpenFamily} />
          <div className="flex items-center gap-3 px-4 py-3">
            <span className="text-xl w-7 text-center">🍽️</span>
            <span className="flex-1 min-w-0"><span className="block text-[15px] font-extrabold text-deep">Personen in huis</span><span className="block text-[12px] text-stone-500">Standaard voor nieuwe maaltijden</span></span>
            <Stepper value={household || 5} min={1} onChange={onHousehold} />
          </div>
        </Card>
        <Card className="divide-y divide-line/70 overflow-hidden">
          <label className="flex items-center gap-3 px-4 py-3.5 cursor-pointer">
            <span className="text-xl w-7 text-center">🛒</span>
            <span className="flex-1 min-w-0"><span className="block text-[15px] font-extrabold text-deep">Boodschappenlijst gebruiken</span><span className="block text-[12px] text-stone-500">Uit = enkel plannen en recepten (voor jullie allebei)</span></span>
            <input type="checkbox" checked={shoppingEnabled} onChange={(e) => onShoppingEnabled(e.target.checked)} className="w-5 h-5 accent-forest shrink-0" aria-label="Boodschappenlijst gebruiken" />
          </label>
          {shoppingEnabled && <Row emoji="🏪" label="Winkels & afdelingen" sub={`${storesCount} winkels · volgorde van je looproute`} onClick={onOpenStores} />}
          {shoppingEnabled && <Row emoji="📌" label="Vaste boodschappen" sub={staplesCount ? `${staplesCount} items komen elke week op de lijst` : 'Melk, brood… elke week op de lijst'} onClick={onOpenStaples} />}
        </Card>
        <Card className="divide-y divide-line/70 overflow-hidden">
          <Row emoji="🔐" label="Wie mag inloggen" sub="Google-adressen met toegang" onClick={onOpenAccess} />
          <button onClick={onSignOut} className="w-full flex items-center gap-3 px-4 py-3.5 text-left text-red-600 active:bg-red-50">
            <span className="w-7 flex justify-center"><Icon name="logout" size={18} /></span><span className="text-[15px] font-extrabold">Uitloggen</span>
          </button>
        </Card>
      </div>
    </Sheet>
  );
}

      <IconBtn name="right" onClick={nav.next} title="Volgende week" className="bg-white border border-line" />
