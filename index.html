function RecipesPage({ recipes, suggestions, onApprove, onReject, onOpenRecipe, onAdd }) {
  const [q, setQ] = useState('');
  const [group, setGroup] = useState('all');
  const [cat, setCat] = useState('');
  const [sort, setSort] = useState('az');
  const [showSugg, setShowSugg] = useState(true);
  const [openSugg, setOpenSugg] = useState(null);
  const [gf, setGf] = useState(false);

  const groupCats = group === 'dish' ? DISH_CATEGORIES : group === 'comp' ? COMPONENT_CATEGORIES : CATEGORIES;
  // Zoeken op titel én op ingrediënt ("kip" vindt ook recepten met kipfilet).
  const qn = normalize(q);
  const ingHit = (r) => qn && !normalize(r.title).includes(qn) ? (r.ingredients || []).find(i => normalize(i.name).includes(qn)) : null;
  const filtered = recipes
    .filter(r => (group === 'all' || groupCats.includes(r.category)) && (!cat || r.category === cat) && (!gf || r.glutenFree) && (!qn || normalize(r.title).includes(qn) || ingHit(r)))
    .sort((a, b) => sort === 'stars' ? ((b.stars || 0) - (a.stars || 0) || a.title.localeCompare(b.title)) : a.title.localeCompare(b.title));

  return (
    <div>
      <PageHeader eyebrow={`${recipes.length} recepten`} title="Recepten" right={<Btn size="sm" icon="plus" onClick={onAdd}>Nieuw</Btn>} />

      {suggestions.length > 0 && (
        <Card className="mb-4 overflow-hidden border-amber-200">
          <button onClick={() => setShowSugg(!showSugg)} className="w-full flex items-center gap-3 px-4 py-3 bg-amber-50">
            <span className="text-xl">✨</span>
            <span className="flex-1 text-left">
              <span className="block text-sm font-black text-deep">{suggestions.length} AI-voorstel{suggestions.length > 1 ? 'len' : ''} wachten</span>
              <span className="block text-[11px] text-stone-500">Klaargemaakt en lekker? Keur goed en het komt bij je recepten.</span>
            </span>
            <Icon name="down" size={16} className={cx('text-stone-400', showSugg && 'rotate-180')} />
          </button>
          {showSugg && (
            <div className="divide-y divide-line">
              {suggestions.map(s => (
                <div key={s.id} className="px-4 py-3">
                  <button onClick={() => setOpenSugg(openSugg === s.id ? null : s.id)} className="w-full text-left">
                    <div className="font-extrabold text-ink text-sm">{s.title}</div>
                    <div className="flex items-center gap-2 mt-1"><CatChip category={s.category} small />{s.basedOn.length > 0 && <span className="text-[11px] text-stone-400 truncate">met {s.basedOn.slice(0, 4).join(', ')}{s.basedOn.length > 4 ? '…' : ''}</span>}</div>
                  </button>
                  {openSugg === s.id && <div className="mt-3"><RecipeBody recipe={s} ratio={1} /></div>}
                  <div className="flex gap-2 mt-2.5">
                    <Btn size="sm" icon="check" onClick={() => onApprove(s.id)}>Goedkeuren</Btn>
                    <Btn size="sm" variant="danger" icon="x" onClick={() => onReject(s.id)}>Afwijzen</Btn>
                  </div>
                </div>
              ))}
            </div>
          )}
        </Card>
      )}

      <div className="relative mb-3">
        <Icon name="search" size={16} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-stone-300" />
        <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Zoek op naam of ingrediënt…" className={cx(inputCls, 'pl-10 rounded-2xl')} />
      </div>
      <Segmented className="mb-2.5" value={group} onChange={(g) => { setGroup(g); setCat(''); }}
        options={[{ value: 'all', label: 'Alles' }, { value: 'dish', label: '🍽️ Gerechten' }, { value: 'comp', label: '🧩 Onderdelen' }]} />
      <div className="flex gap-1.5 overflow-x-auto no-scrollbar -mx-4 px-4 mb-3">
        <button onClick={() => setGf(!gf)}
          className={cx('shrink-0 rounded-full px-3 py-1.5 text-xs font-extrabold border', gf ? 'bg-amber-500 text-white border-amber-500' : 'bg-white text-amber-800 border-amber-300')}>
          🌾 Glutenvrij <span className="opacity-60">{recipes.filter(r => r.glutenFree).length}</span>
        </button>
        {groupCats.map(c => {
          const n = recipes.filter(r => r.category === c).length;
          if (!n && c === 'Onderdeel') return null;
          return (
            <button key={c} onClick={() => setCat(cat === c ? '' : c)}
              className={cx('shrink-0 rounded-full px-3 py-1.5 text-xs font-extrabold border', cat === c ? 'bg-forest text-white border-forest' : 'bg-white text-deep border-line')}>
              {catMeta(c).emoji} {catShort(c)} <span className="opacity-60">{n}</span>
            </button>
          );
        })}
      </div>
      <div className="flex items-center justify-between px-1 mb-2">
        <span className="text-[11px] font-bold text-stone-400">{filtered.length} getoond</span>
        <button onClick={() => setSort(sort === 'az' ? 'stars' : 'az')} className="text-[11px] font-extrabold text-sage">Sorteer: {sort === 'az' ? 'A–Z' : '★ favorieten'}</button>
      </div>

      {filtered.length === 0 ? (
        <EmptyState emoji="🔍" title="Geen recepten gevonden" text={group === 'comp' ? 'Maak onderdelen aan zoals "Gebakken kip" (Vlees/vis) of "Gestoomde broccoli" (Groenten) om maaltijden samen te stellen.' : 'Pas je zoekopdracht of filter aan.'}
          action={<Btn size="sm" icon="plus" onClick={onAdd}>Nieuw recept</Btn>} />
      ) : (
        <Card className="divide-y divide-line/70 overflow-hidden">
          {filtered.map(r => (
            <button key={r.id} onClick={() => onOpenRecipe(r.id)} className="w-full flex items-center gap-3 px-3.5 py-3 text-left active:bg-mist">
              {r.image ? (
                <img src={r.image} alt="" className="w-10 h-10 rounded-xl object-cover border border-line shrink-0" />
              ) : (
                <span className="w-10 h-10 rounded-xl bg-cream border border-line flex items-center justify-center text-lg shrink-0">{catMeta(r.category).emoji}</span>
              )}
              <span className="flex-1 min-w-0">
                <span className="block text-sm font-extrabold text-ink truncate">{r.title}</span>
                <span className="flex items-center gap-2 mt-0.5 text-[11px] text-stone-400 font-semibold">
                  <span>{catShort(r.category)}</span>
                  {r.glutenFree && <span className="rounded-full bg-amber-100 text-amber-800 px-1.5 py-px text-[10px] font-extrabold">🌾 GV</span>}
                  {r.stars ? <Stars value={r.stars} size={10} /> : null}
                  {r.carbsPerPortion != null && <span>{fmtAmount(r.carbsPerPortion)} g koolh.</span>}
                </span>
                {ingHit(r) && <span className="block text-[11px] font-bold text-sage truncate">bevat: {ingHit(r).name}</span>}
              </span>
              <Icon name="right" size={16} className="text-stone-300" />
            </button>
          ))}
        </Card>
      )}
    </div>
  );
}

function RecipeBody({ recipe, ratio }) {

        <div className="text-[11px] font-extrabold uppercase tracking-wide text-stone-400 mb-1.5">Ingrediënten</div>

function CategorySelect({ value, onChange }) {
  return (
    <select value={value} onChange={(e) => onChange(e.target.value)} className={inputCls}>
      <option value="">Kies…</option>
      <optgroup label="Gerechten (volledige maaltijd)">

      </optgroup>
      <optgroup label="Onderdelen (om samen te stellen)">
        {COMPONENT_CATEGORIES.map(c => <option key={c} value={c}>{catMeta(c).emoji} {catMeta(c).label}</option>)}
      </optgroup>

// Het volledige receptformulier — gedeeld door "nieuw" en "bewerken".
function RecipeForm({ draft, setDraft }) {
  const set = (patch) => setDraft({ ...draft, ...patch });
  const updIng = (i, patch) => set({ ingredients: draft.ingredients.map((x, k) => k === i ? { ...x, ...patch } : x) });
  const updStep = (i, v) => set({ steps: draft.steps.map((x, k) => k === i ? v : x) });
  const fileRef = useRef(null);
  async function pickPhoto(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try { set({ image: await resizeImageFile(file) }); } catch (err) { window.alert(err.message); }
  }
  return (
    <div className="space-y-4">
      <Field label="Foto">
        <input ref={fileRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={pickPhoto} />
        {draft.image ? (
          <div className="relative rounded-2xl overflow-hidden border border-line">
            <img src={draft.image} alt="" className="w-full h-40 object-cover" />
            <div className="absolute top-2 right-2 flex gap-1.5">
              <IconBtn name="camera" title="Andere foto" onClick={() => fileRef.current.click()} className="bg-white/90 backdrop-blur w-9 h-9" />
              <IconBtn name="x" title="Foto verwijderen" onClick={() => set({ image: '' })} className="bg-white/90 backdrop-blur w-9 h-9 text-red-500" />
            </div>
          </div>
        ) : (
          <Btn variant="soft" className="w-full" icon="camera" onClick={() => fileRef.current.click()}>Foto nemen</Btn>
        )}
      </Field>
      <Field label="Titel"><input value={draft.title} onChange={(e) => set({ title: e.target.value })} placeholder="bv. Gebakken kipfilet" className={inputCls} /></Field>
      <Field label="Categorie" hint={isComponent(draft.category) ? 'Onderdeel: kies je in de planner via 🧩 Samenstellen.' : null}>
        <CategorySelect value={draft.category} onChange={(v) => set({ category: v })} />
      </Field>
      <button type="button" onClick={() => set({ glutenFree: !draft.glutenFree })}
        className={cx('w-full flex items-center gap-2.5 rounded-xl border px-3.5 py-2.5 text-sm font-extrabold transition', draft.glutenFree ? 'bg-amber-50 border-amber-300 text-amber-900' : 'bg-white border-line text-stone-500')}>
        <span className="text-lg leading-none">🌾</span>
        <span className="flex-1 text-left">Glutenvrij</span>
        <span className={cx('w-5 h-5 rounded-md border flex items-center justify-center', draft.glutenFree ? 'bg-amber-500 border-amber-500 text-white' : 'border-line')}>{draft.glutenFree && <Icon name="check" size={14} stroke={3} />}</span>
      </button>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Voor # personen"><input type="number" min="1" value={draft.basePortions} onChange={(e) => set({ basePortions: e.target.value })} className={inputCls} /></Field>
        <Field label="Koolh. per pers. (g)"><input type="number" min="0" value={draft.carbsPerPortion} onChange={(e) => set({ carbsPerPortion: e.target.value })} placeholder="optioneel" className={inputCls} /></Field>
      </div>
      <div>
        <div className="text-[11px] font-extrabold uppercase tracking-wide text-stone-400 mb-1.5">Ingrediënten (voor {draft.basePortions || 1} pers.)</div>
        <div className="space-y-1.5">
          {draft.ingredients.map((ing, i) => (
            <div key={i} className="flex gap-1.5">
              <input value={ing.name} onChange={(e) => updIng(i, { name: e.target.value })} placeholder="Ingrediënt" className={cx(inputBase, 'flex-1 min-w-0 py-2')} />
              <input value={ing.amount} onChange={(e) => updIng(i, { amount: e.target.value })} placeholder="#" type="number" inputMode="decimal" className={cx(inputBase, 'w-[4.5rem] shrink-0 py-2 px-2.5')} />
              <input value={ing.unit} onChange={(e) => updIng(i, { unit: e.target.value })} placeholder="eenh." className={cx(inputBase, 'w-[4.5rem] shrink-0 py-2 px-2.5')} />
              <button onClick={() => set({ ingredients: draft.ingredients.filter((_, k) => k !== i) })} className="text-stone-300 px-1" aria-label="Verwijderen"><Icon name="x" size={16} /></button>
            </div>
          ))}
        </div>
        <Btn variant="ghost" size="sm" icon="plus" className="mt-1" onClick={() => set({ ingredients: [...draft.ingredients, { name: '', amount: '', unit: '' }] })}>Ingrediënt</Btn>
      </div>
      <div>
        <div className="text-[11px] font-extrabold uppercase tracking-wide text-stone-400 mb-1.5">Bereiding</div>
        <div className="space-y-1.5">
          {draft.steps.map((s, i) => (
            <div key={i} className="flex gap-1.5 items-start">
              <span className="w-6 h-6 rounded-full bg-mint text-forest text-xs font-black flex items-center justify-center shrink-0 mt-2">{i + 1}</span>
              <textarea value={s} onChange={(e) => updStep(i, e.target.value)} rows={2} placeholder="Beschrijf deze stap…" className={cx(inputBase, 'flex-1 min-w-0 py-2')} />
              <button onClick={() => set({ steps: draft.steps.filter((_, k) => k !== i) })} className="text-stone-300 px-1 mt-2" aria-label="Verwijderen"><Icon name="x" size={16} /></button>
            </div>
          ))}
        </div>
        <Btn variant="ghost" size="sm" icon="plus" className="mt-1" onClick={() => set({ steps: [...draft.steps, ''] })}>Stap</Btn>
      </div>
    </div>
  );
}
function recipeToDraft(r) {
  return {
    title: r.title || '', category: r.category || '', basePortions: r.basePortions || 1,
    carbsPerPortion: r.carbsPerPortion == null ? '' : r.carbsPerPortion,
    ingredients: (r.ingredients && r.ingredients.length ? r.ingredients : [{}]).map(i => ({ name: i.name || '', amount: i.amount == null ? '' : i.amount, unit: i.unit || '' })),
    steps: r.steps && r.steps.length ? [...r.steps] : [''],
    image: r.image || '', glutenFree: !!r.glutenFree,
  };
}
function draftToRecipe(d) {
  return {
    title: d.title.trim(), category: d.category, basePortions: Number(d.basePortions) || 1,
    carbsPerPortion: d.carbsPerPortion === '' || d.carbsPerPortion === null ? null : Number(d.carbsPerPortion),
    ingredients: d.ingredients.filter(i => (i.name || '').trim()).map(i => ({ name: i.name.trim(), amount: i.amount === '' || i.amount == null ? null : Number(i.amount), unit: (i.unit || '').trim() })),
    steps: d.steps.map(s => (s || '').trim()).filter(Boolean),
    image: d.image || null, glutenFree: !!d.glutenFree,
  };
}

function RecipeSheet({ recipe, startInEdit, householdSize, onUpdate, onDelete, onPlan, onClose }) {
  const [editing, setEditing] = useState(startInEdit);
  const [draft, setDraft] = useState(() => recipeToDraft(recipe));
  const [persons, setPersons] = useState(householdSize || recipe.basePortions || 1);
  const [cooking, setCooking] = useState(false);
  const ratio = recipe.basePortions ? persons / recipe.basePortions : 1;

  const [saving, setSaving] = useState(false);
  async function save() {
    if (!draft.title.trim()) { window.alert('Geef het recept een titel.'); return; }
    setSaving(true);
    try {
      let image = draft.image;
      if (image && image.startsWith('data:')) image = await uploadRecipePhoto(image);
      onUpdate(draftToRecipe({ ...draft, image }));
      setEditing(false);
    } catch (e) { window.alert(e.message); }
    finally { setSaving(false); }
  }
  return (
    <Sheet z={50} full title={editing ? 'Recept bewerken' : recipe.title}
      subtitle={editing ? recipe.title : <span className="inline-flex items-center gap-2"><CatChip category={recipe.category} small />{recipe.carbsPerPortion != null && `${fmtAmount(recipe.carbsPerPortion)} g koolh./pers.`}</span>}
      onClose={onClose}
      footer={editing ? (
        <div className="flex gap-2">
          <Btn variant="secondary" className="flex-1" onClick={() => { setDraft(recipeToDraft(recipe)); setEditing(false); }}>Annuleren</Btn>
          <Btn className="flex-1" icon="check" disabled={saving} onClick={save}>{saving ? '…' : 'Opslaan'}</Btn>
        </div>
      ) : (
        <div className="flex gap-2">
          <IconBtn name="trash" title="Verwijderen" onClick={onDelete} className="text-red-500 bg-white border border-line w-11 h-11" />
          <Btn variant="secondary" className="flex-1" icon="pencil" onClick={() => { setDraft(recipeToDraft(recipe)); setEditing(true); }}>Bewerken</Btn>
          <Btn className="flex-1" icon="calendar" onClick={onPlan}>Inplannen</Btn>
        </div>
      )}>
      {editing ? <RecipeForm draft={draft} setDraft={setDraft} /> : (
        <div className="space-y-4">
          {recipe.image && <img src={recipe.image} alt="" className="w-full h-40 object-cover rounded-2xl border border-line" />}
          <Card className="p-3.5 flex items-center justify-between gap-3">
            <div>
              <div className="text-[11px] font-extrabold uppercase tracking-wide text-stone-400">Hoe graag?</div>
              <div className="text-[11px] text-stone-500 font-semibold">{recipe.stars ? STAR_LABELS[recipe.stars] : 'nog niet beoordeeld'}</div>
            </div>
            <StarPicker value={recipe.stars} onChange={(n) => onUpdate({ stars: n })} />
          </Card>
          <div className="flex items-center justify-between">
            <span className="text-sm font-extrabold text-deep">Hoeveelheden voor</span>
            <Stepper value={persons} onChange={setPersons} label="pers." />
          </div>
          <Btn variant="soft" size="lg" className="w-full" onClick={() => setCooking(true)}>👩‍🍳 Kookmodus — stap voor stap</Btn>
          <RecipeBody recipe={recipe} ratio={ratio} />
        </div>
      )}
      {cooking && <CookMode recipe={recipe} persons={persons} onClose={() => setCooking(false)} />}
    </Sheet>
  );
}

function AddRecipeSheet({ preset, onSave, onClose }) {
  const [mode, setMode] = useState(preset.sharedFiles ? 'photo' : preset.sharedUrl ? 'url' : preset.category || preset.title ? 'manual' : 'url');
  const [draft, setDraft] = useState({ ...recipeToDraft({ title: preset.title || '', category: preset.category || '', basePortions: 1, ingredients: preset.ingredients || [] }) });
  const [url, setUrl] = useState('');
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState('');
  const [pasteIng, setPasteIng] = useState('');
  const [pasteSteps, setPasteSteps] = useState('');
  const [origPortions, setOrigPortions] = useState(2);
  const [filled, setFilled] = useState(false);

  function applyImport({ title, category, ingredients, steps, portions }) {
    const ratio = 1 / (Number(portions) || 1);
    setDraft(d => ({
      ...d,
      title: title || d.title,
      category: CATEGORIES.includes(category) ? category : d.category,
      basePortions: 1,
      ingredients: ingredients && ingredients.length ? ingredients.map(i => scaleIngredient(i, ratio)).map(i => ({ name: i.name || '', amount: i.amount == null ? '' : i.amount, unit: i.unit || '' })) : d.ingredients,
      steps: steps && steps.length ? steps : d.steps,
    }));
    setFilled(true);
  }
  async function importUrl(given) {
    const u = (typeof given === 'string' ? given : url).trim();
    if (!u) return;
    setBusy(true); setError('');
    try {
      const data = await invokeAi({ task: 'import_url', url: u });
      applyImport({ title: data.title, category: data.category, ingredients: data.ingredients, steps: data.steps, portions: data.basePortions || 2 });
    } catch (e) { setError(e.message + ' — probeer eventueel "Plak tekst".'); }
    finally { setBusy(false); }
  }
  function importPaste() {
    applyImport({ ingredients: parseLines(pasteIng).map(parseIngredientLine).filter(Boolean), steps: parseLines(pasteSteps), portions: origPortions });
  }
  const photoRef = useRef(null);
  const fileRef = useRef(null);
  const [fileNames, setFileNames] = useState([]);
  function readAsBase64(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onerror = () => reject(new Error('Bestand lezen mislukt'));
      r.onload = () => resolve(String(r.result).split(',')[1]);
      r.readAsDataURL(file);
    });
  }
  // Camerafoto, screenshot(s) of PDF → AI leest het recept. Meerdere bestanden = één recept
  // (bv. ingrediënten op screenshot 1, bereiding op screenshot 2).
  async function importFiles(fileList, fromCamera) {
    const files = Array.from(fileList || []).slice(0, 5);
    if (!files.length) return;
    setBusy(true); setError(''); setFileNames(files.map(f => f.name || 'foto'));
    try {
      const parts = [];
      for (const f of files) {
        const isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name || '');
        if (isPdf) {
          if (f.size > 10 * 1024 * 1024) throw new Error(`"${f.name}" is te groot (max 10 MB)`);
          parts.push({ data: await readAsBase64(f), mimeType: 'application/pdf' });
        } else if ((f.type || '').startsWith('image/') || /\.(jpe?g|png|webp|heic|gif)$/i.test(f.name || '')) {
          const dataUrl = await resizeImageFile(f, fromCamera ? 1600 : 2400, 0.85);
          if (fromCamera) setDraft(d => ({ ...d, image: dataUrl }));
          parts.push({ data: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
        } else throw new Error(`"${f.name}" is geen foto of PDF`);
      }
      const data = await invokeAi({ task: 'import_photo', files: parts, imageBase64: parts[0].data, mimeType: parts[0].mimeType });
      if (!data || (!data.title && !(data.ingredients || []).length)) throw new Error('Geen recept gevonden in dit bestand');
      applyImport({ title: data.title, category: data.category, ingredients: data.ingredients, steps: data.steps, portions: data.basePortions || 2 });
    } catch (e) { setError(e.message + ' — vul de rest eventueel zelf aan.'); }
    finally { setBusy(false); }
  }
  // gedeeld vanuit een andere app (Delen → Mealio): meteen inlezen
  useEffect(() => {
    if (preset.sharedFiles && preset.sharedFiles.length) importFiles(preset.sharedFiles, false);
    else if (preset.sharedUrl) { setUrl(preset.sharedUrl); importUrl(preset.sharedUrl); }
  }, []); // eslint-disable-line
  function importPhoto(e) { const fl = Array.from(e.target.files || []); e.target.value = ''; importFiles(fl, true); }
  function importPicked(e) { const fl = Array.from(e.target.files || []); e.target.value = ''; importFiles(fl, false); }
  async function save() {
    if (!draft.title.trim()) { window.alert('Geef het recept een titel.'); return; }
    if (!draft.category) { window.alert('Kies een categorie.'); return; }
    setBusy(true);
    try {
      let image = draft.image;
      if (image && image.startsWith('data:')) image = await uploadRecipePhoto(image);
      await onSave(draftToRecipe({ ...draft, image }));
    } catch (e) { window.alert(e.message); }
    finally { setBusy(false); }
  }

  return (
    <Sheet z={60} full title="Nieuw recept" subtitle={preset.category ? `Categorie: ${catMeta(preset.category).label}` : 'Van een website, foto, screenshot, PDF, geplakte tekst of zelf ingevuld'} onClose={onClose}
      footer={<Btn size="lg" className="w-full" icon="check" disabled={busy} onClick={save}>Recept opslaan</Btn>}>
      <Segmented className="mb-4" value={mode} onChange={setMode}
        options={[{ value: 'url', label: 'Van URL', icon: 'link' }, { value: 'photo', label: 'Foto/PDF', icon: 'camera' }, { value: 'paste', label: 'Plak tekst' }, { value: 'manual', label: 'Zelf', icon: 'pencil' }]} />

      {mode === 'photo' && (
        <Card className="p-3.5 mb-4 space-y-2">
          <input ref={photoRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={importPhoto} />
          <input ref={fileRef} type="file" accept="image/*,application/pdf,.pdf" multiple className="hidden" onChange={importPicked} />
          {draft.image && (
            <div className="relative rounded-2xl overflow-hidden border border-line">
              <img src={draft.image} alt="" className="w-full h-40 object-cover" />
            </div>
          )}
          <div className="grid grid-cols-2 gap-2">
            <Btn icon="camera" disabled={busy} onClick={() => photoRef.current.click()}>Foto nemen</Btn>
            <Btn variant="soft" disabled={busy} onClick={() => fileRef.current.click()}>Screenshot/PDF</Btn>
          </div>
          {busy && <div className="text-sm font-extrabold text-deep bg-mist rounded-xl px-3 py-2">Recept wordt gelezen… <span className="font-semibold text-stone-500">{fileNames.join(', ')}</span></div>}
          <p className="text-[11px] text-stone-400">Foto van een kookboek of receptenkaart, een screenshot (bv. van Instagram of een website) of een PDF. Staat het recept op meerdere screenshots, kies ze samen. De AI vult het recept hieronder in; een camerafoto wordt ook de receptfoto.</p>
          {error && <p className="text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded-xl px-3 py-2">{error}</p>}
        </Card>
      )}
      {mode === 'url' && (
        <Card className="p-3.5 mb-4 space-y-2">
          <Field label="Link naar een recept">
            <div className="flex gap-2">
              <input value={url} onChange={(e) => setUrl(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') importUrl(); }} placeholder="https://…" className={inputCls} />
              <Btn disabled={busy || !url.trim()} onClick={importUrl}>{busy ? '…' : 'Ophalen'}</Btn>
            </div>
          </Field>
          <p className="text-[11px] text-stone-400">Werkt bij de meeste receptensites; de AI vult aan waar nodig. Alles wordt omgerekend naar 1 persoon.</p>
          {error && <p className="text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded-xl px-3 py-2">{error}</p>}
        </Card>
      )}
      {mode === 'paste' && (
        <Card className="p-3.5 mb-4 space-y-3">
          <Field label="Ingrediënten (één per regel)"><textarea value={pasteIng} onChange={(e) => setPasteIng(e.target.value)} rows={4} placeholder={'500 g kipfilet\n1 courgette\n2 el olijfolie'} className={inputCls} /></Field>
          <Field label="Bereiding (één stap per regel)"><textarea value={pasteSteps} onChange={(e) => setPasteSteps(e.target.value)} rows={3} placeholder={'Snijd de courgette in blokjes\nBak de kip…'} className={inputCls} /></Field>
          <div className="flex items-center justify-between gap-2">
            <span className="text-xs font-bold text-stone-500">Origineel voor</span>
            <Stepper value={Number(origPortions) || 1} onChange={setOrigPortions} label="pers." />
          </div>
          <Btn variant="soft" className="w-full" onClick={importPaste}>Invullen & omrekenen naar 1 persoon</Btn>
        </Card>
      )}
      {filled && <div className="text-xs font-bold text-leaf bg-mist rounded-xl px-3 py-2 mb-3">✓ Ingevuld en omgerekend naar 1 persoon — kijk het hieronder even na{!draft.category ? ' en kies een categorie' : ''}.</div>}
      <RecipeForm draft={draft} setDraft={setDraft} />
    </Sheet>
  );
}

function KastPage({ pantryStock, recipes, onAdd, onToggle, onRemove, onRemoveMany, onUpdate, onAddToShopping, onOpenRecipe, onAiSuggest, aiSuggesting, showToast }) {
  const scanRef = useRef(null);
  const [scanning, setScanning] = useState(false);
  const [scanItems, setScanItems] = useState(null);
  async function scanPhoto(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setScanning(true);
    try {
      const dataUrl = await resizeImageFile(file, 1400, 0.8);
      const data = await invokeAi({ task: 'scan_pantry', imageBase64: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
      setScanItems((data && data.items) || []);
    } catch (err) { showToast(err.message || 'Foto herkennen mislukt'); }
    finally { setScanning(false); }
  }
  const [view, setView] = useState('voorraad');
  const [input, setInput] = useState('');
  const [extra, setExtra] = useState([]);
  const [extraInput, setExtraInput] = useState('');
  const [matchMode, setMatchMode] = useState('any');
  const inStock = pantryStock.filter(p => p.inStock).sort((a, b) => a.name.localeCompare(b.name));
  const outStock = pantryStock.filter(p => !p.inStock).sort((a, b) => a.name.localeCompare(b.name));
  const sources = [...inStock.map(p => p.name), ...extra];
  const results = useMemo(() => matchRecipesToPantry(recipes, sources, matchMode), [recipes, sources.join('|'), matchMode]); // eslint-disable-line

  function add() { input.split(',').map(s => s.trim()).filter(Boolean).forEach(onAdd); setInput(''); if (inputRef.current) inputRef.current.focus(); }
  function addOne(name) { onAdd(name); setInput(''); if (inputRef.current) inputRef.current.focus(); }
  const inputRef = useRef(null);
  // ingrediënten uit je recepten, meest gebruikt eerst — om met één tik toe te voegen
  const known = useMemo(() => {
    const m = {};
    recipes.forEach(r => (r.ingredients || []).forEach(ing => {
      const n = (ing.name || '').trim(); if (!n || n.length > 30) return;
      const k = normalize(n); if (!m[k]) m[k] = { name: n.toLowerCase(), count: 0 }; m[k].count++;
    }));
    return Object.values(m).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
  }, [recipes]);
  const inStockSet = new Set(inStock.map(p => normalize(p.name)));
  const q = normalize(input.split(',').pop().trim());
  const suggestions = q.length >= 2 ? [
    ...outStock.map(p => p.name).filter(n => normalize(n).split(/[^a-z0-9]+/).some(w => w.startsWith(q)) || normalize(n).startsWith(q)),
    ...known.map(k => k.name).filter(n => !inStockSet.has(normalize(n)) && (normalize(n).split(/[^a-z0-9]+/).some(w => w.startsWith(q)))),
  ].filter((n, i, a) => a.findIndex(x => normalize(x) === normalize(n)) === i).slice(0, 8) : [];
  const quick = known.filter(k => !inStockSet.has(normalize(k.name)) && !outStock.some(p => normalize(p.name) === normalize(k.name))).slice(0, 24);
  const [showQuick, setShowQuick] = useState(false);
  const [tidy, setTidy] = useState(false);   // opruimen: aantallen aanpassen
  const stepFor = (u) => (/^(g|ml)$/.test(u || '') ? 50 : 1);
  function bump(p, d) {
    const u = p.unit || 'stuks';
    const q = Math.max(0, Math.round(((p.qty == null ? (d > 0 ? 0 : 1) : p.qty) + d * stepFor(u)) * 100) / 100);
    if (q <= 0) onUpdate(p.id, { inStock: false, qty: null, unit: p.unit || u });
    else onUpdate(p.id, { inStock: true, qty: q, unit: p.unit || u });
  }
  function addExtra() {
    const parts = extraInput.split(',').map(s => s.trim()).filter(Boolean);
    setExtra([...extra, ...parts.filter(p => !sources.some(s => normalize(s) === normalize(p)))]); setExtraInput('');
  }

  return (
    <div>
      <PageHeader eyebrow={`${inStock.length} items in huis`} title="Voorraad" />
      {view === 'voorraad'
        ? <button onClick={() => setView('maken')} className="w-full mb-4 flex items-center gap-3 rounded-2xl border border-line bg-white px-4 py-3 text-left active:bg-mist">
            <Icon name="search" size={18} className="text-forest" />
            <span className="flex-1 text-[14px] font-extrabold text-deep">Wat kan ik maken met wat ik in huis heb?</span>
            <Icon name="right" size={16} className="text-stone-300" />
          </button>
        : <button onClick={() => setView('voorraad')} className="mb-4 text-[13px] font-extrabold text-forest">← Terug naar de voorraad</button>}

      {view === 'voorraad' ? (
        <div className="space-y-4">
          <Card className="overflow-hidden">
            <div className="p-2 flex gap-1.5">
              <input ref={inputRef} value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') add(); }}
                placeholder="Wat heb je in huis? bv. eieren" aria-label="Toevoegen aan de kast" enterKeyHint="done"
                className="flex-1 min-w-0 bg-transparent px-2 py-2.5 text-base placeholder:text-stone-400 border-0 focus:shadow-none" />
              <button onClick={add} aria-label="Toevoegen" className="w-11 h-11 rounded-xl bg-forest text-white flex items-center justify-center shrink-0"><Icon name="plus" /></button>
            </div>
            {suggestions.length > 0 && (
              <div className="border-t border-line/70 divide-y divide-line/60">
                {suggestions.map(n => (
                  <button key={n} onClick={() => addOne(n)} className="w-full px-4 py-2.5 flex items-center gap-2 text-left active:bg-mist">
                    <Icon name="plus" size={14} className="text-forest" /><span className="text-[15px] font-bold text-ink">{n}</span>
                  </button>
                ))}
              </div>
            )}
          </Card>

          {quick.length > 0 && (
            <div>
              <button onClick={() => setShowQuick(!showQuick)} className="w-full flex items-center justify-between px-1 text-[12px] font-extrabold text-forest">
                <span>⚡ Snel aantikken — vaak in je recepten</span><Icon name="down" size={14} className={showQuick ? 'rotate-180' : ''} />
              </button>
              {showQuick && (
                <div className="flex flex-wrap gap-1.5 mt-2">
                  {quick.map(k => (
                    <button key={k.name} onClick={() => { onAdd(k.name); showToast(`🏠 ${k.name} in de kast`); }}
                      className="h-9 px-3 rounded-full bg-white border border-line text-[13px] font-bold text-deep active:bg-mint active:scale-95 transition">+ {k.name}</button>
                  ))}
                </div>
              )}
            </div>
          )}

          <input ref={scanRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={scanPhoto} />
          <Btn variant="secondary" className="w-full" icon="camera" disabled={scanning} onClick={() => scanRef.current.click()}>
            {scanning ? 'Foto wordt bekeken…' : 'Foto van koelkast of kast'}
          </Btn>
          {scanItems && <PantryScanSheet items={scanItems} pantryStock={pantryStock} onAdd={onAdd} onClose={() => setScanItems(null)} />}

          <button onClick={onAiSuggest} disabled={aiSuggesting || !inStock.length}
            className="w-full rounded-2xl bg-gradient-to-br from-deep to-forest text-white p-3.5 flex items-center gap-3 text-left shadow-card disabled:opacity-50">
            <div className="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center"><Icon name="sparkles" size={20} /></div>
            <div className="flex-1">
              <div className="text-sm font-black">{aiSuggesting ? 'AI bedenkt recepten…' : 'Bedenk recepten met mijn voorraad'}</div>
              <div className="text-[11px] text-white/70">Voorstellen verschijnen bij Recepten om goed te keuren.</div>
            </div>
          </button>

          {pantryStock.length === 0 && <EmptyState emoji="🥫" title="Je kast is nog leeg" text="Houd bij wat je meestal in huis hebt. Is iets op? Tik het af en zet het met één tik op je boodschappenlijst." />}

          {inStock.length > 0 && (
            <div>
              <div className="flex items-center justify-between mb-1.5 px-1">
                <span className="text-[11px] font-extrabold uppercase tracking-wide text-stone-400">In huis ({inStock.length})</span>
                <button onClick={() => setTidy(!tidy)} className={cx('text-[12px] font-extrabold rounded-full px-3 py-1.5', tidy ? 'bg-forest text-white' : 'bg-mint text-forest')}>
                  {tidy ? '✓ Klaar met opruimen' : '🧹 Opruimen & aantallen'}
                </button>
              </div>
              {tidy && <p className="text-[12px] text-stone-500 px-1 mb-2">Pas aan wat er écht nog is: − en +, of tik op het getal. Op 0 = op.</p>}
              <Card className="divide-y divide-line/70 overflow-hidden">
                {inStock.map(p => tidy ? (
                  <div key={p.id} className="flex items-center gap-1.5 px-3 py-2">
                    <span className="flex-1 min-w-0 text-sm font-bold text-ink truncate">{p.name}</span>
                    <button onClick={() => bump(p, -1)} aria-label={`${p.name} minder`} className="w-9 h-9 rounded-xl bg-cream border border-line text-lg font-black text-deep shrink-0">−</button>
                    <input type="number" inputMode="decimal" min="0" defaultValue={p.qty == null ? '' : p.qty} key={`${p.id}-${p.qty}`} placeholder="?"
                      aria-label={`Aantal ${p.name}`}
                      onBlur={(e) => { const v = e.target.value.trim(); if (v === '') { if (p.qty != null) onUpdate(p.id, { qty: null }); return; }
                        const n = Math.max(0, Number(v.replace(',', '.')) || 0); if (n === p.qty) return;
                        onUpdate(p.id, n <= 0 ? { inStock: false, qty: null } : { qty: n, unit: p.unit || 'stuks' }); }}
                      onKeyDown={(e) => { if (e.key === 'Enter') e.target.blur(); }}
                      className="w-14 h-9 rounded-xl border border-line bg-white text-center text-sm font-black text-deep" />
                    <button onClick={() => bump(p, 1)} aria-label={`${p.name} meer`} className="w-9 h-9 rounded-xl bg-cream border border-line text-lg font-black text-deep shrink-0">+</button>
                    <select value={p.unit || 'stuks'} onChange={(e) => onUpdate(p.id, { unit: e.target.value })} aria-label={`Eenheid ${p.name}`}
                      className="w-[4.2rem] h-9 rounded-xl border border-line bg-white text-xs font-bold text-stone-600 px-1 shrink-0">
                      {[...new Set(['stuks', 'g', 'ml', 'pot', 'blik', 'pak', 'zakje', 'fles', 'bosje', p.unit || 'stuks'])].map(u => <option key={u} value={u}>{u}</option>)}
                    </select>
                    <IconBtn name="trash" size={14} title={`${p.name} verwijderen`} onClick={() => onRemove(p.id)} className="w-8 h-8 text-stone-300 shrink-0" />
                  </div>
                ) : (
                  <div key={p.id} className="flex items-center gap-3 px-3 py-2.5">
                    <button onClick={() => onToggle(p.id)} className="w-6 h-6 rounded-full bg-sage text-white flex items-center justify-center shrink-0" aria-label="Markeer als op"><Icon name="check" size={14} stroke={3} /></button>
                    <span className="flex-1 min-w-0 text-sm font-bold text-ink truncate">{p.name}</span>
                    {p.qty != null && <span className="text-[12px] font-extrabold text-leaf bg-mint rounded-full px-2 py-0.5 shrink-0">{fmtPantryQty(p)}</span>}
                    <button onClick={() => onToggle(p.id)} className="text-[11px] font-extrabold text-stone-400 px-2 py-1 rounded-lg active:bg-mist">Op</button>
                  </div>
                ))}
              </Card>
            </div>
          )}
          {outStock.length > 0 && (
            <div>
              <div className="flex items-center justify-between mb-1.5 px-1">
                <span className="text-[11px] font-extrabold uppercase tracking-wide text-stone-400">Op / aan te vullen ({outStock.length})</span>
                <button onClick={() => onRemoveMany(outStock)}
                  className="text-[12px] font-extrabold text-stone-500">🗑 Opkuisen</button>
              </div>
              <Card className="divide-y divide-line/70 overflow-hidden">
                {outStock.map(p => (
                  <div key={p.id} className="flex items-center gap-2 px-3 py-2.5">
                    <button onClick={() => onToggle(p.id)} className="flex-1 min-w-0 flex items-center gap-2.5 py-0.5 text-left" aria-label={`${p.name} weer in huis`}>
                      <span className="w-6 h-6 rounded-full border-2 border-stone-300 shrink-0" />
                      <span className="text-sm font-semibold text-stone-400 truncate">{p.name}</span>
                    </button>
                    {onAddToShopping && <button onClick={() => onAddToShopping(p.name)} className="flex items-center gap-1 text-[11px] font-extrabold text-forest bg-mist rounded-lg px-2 py-1"><Icon name="cart" size={12} />Op lijst</button>}
                    <IconBtn name="trash" size={14} title="Verwijderen" onClick={() => onRemove(p.id)} className="w-8 h-8 text-stone-300" />
                  </div>
                ))}
              </Card>
            </div>
          )}
        </div>
      ) : (
        <div className="space-y-3">
          <Card className="p-3.5 space-y-3">
            <div className="text-xs text-stone-500">We gebruiken je voorraad ({inStock.length}). Iets extra dat niet in je kast-lijst staat?</div>
            <div className="flex gap-2">
              <input value={extraInput} onChange={(e) => setExtraInput(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') addExtra(); }} placeholder="bv. kip, spinazie" className={inputCls} />
              <Btn variant="soft" onClick={addExtra}>+</Btn>
            </div>
            {extra.length > 0 && (
              <div className="flex flex-wrap gap-1.5">
                {extra.map(x => <span key={x} className="inline-flex items-center gap-1 bg-mist text-forest rounded-full pl-2.5 pr-1 py-1 text-xs font-bold">{x}<button onClick={() => setExtra(extra.filter(e => e !== x))}><Icon name="x" size={12} /></button></span>)}
              </div>
            )}
            <Segmented value={matchMode} onChange={setMatchMode} options={[{ value: 'any', label: 'Minstens 1 match' }, { value: 'full', label: 'Volledig in huis' }]} />
            <div className="text-[11px] text-stone-400">Zout, peper, olie, boter en water tellen we als altijd in huis.</div>
          </Card>
          {!sources.length ?<EmptyState emoji="🧺" title="Nog niets om mee te zoeken" text="Zet eerst wat in je voorraad of typ hierboven wat je hebt." />
            : results.length === 0 ? <EmptyState emoji="🤷" title="Geen passende recepten" text={matchMode === 'full' ? 'Geen enkel recept kan je volledig maken — probeer "Minstens 1 match".' : 'Geen enkel recept gebruikt deze ingrediënten.'} />
            : (
              <Card className="divide-y divide-line/70 overflow-hidden">
                {results.slice(0, 40).map(({ recipe, matched, total, missing, pct }) => (
                  <button key={recipe.id} onClick={() => onOpenRecipe(recipe.id)} className="w-full text-left px-3.5 py-3 active:bg-mist">
                    <div className="flex items-center gap-2">
                      <span className="text-base">{catMeta(recipe.category).emoji}</span>
                      <span className="flex-1 text-sm font-extrabold text-ink truncate">{recipe.title}</span>
                      <span className={cx('text-[11px] font-black rounded-full px-2 py-0.5', missing.length === 0 ? 'bg-sage text-white' : 'bg-amber-100 text-amber-800')}>{missing.length === 0 ? 'Alles ✓' : `${matched}/${total}`}</span>
                    </div>
                    <div className="h-1.5 rounded-full bg-mist mt-2 overflow-hidden"><div className="h-full bg-sage rounded-full" style={{ width: `${Math.round(pct * 100)}%` }} /></div>
                    {missing.length > 0 && <div className="text-[11px] text-stone-400 mt-1.5 truncate">Nog nodig: {missing.join(', ')}</div>}
                  </button>
                ))}
              </Card>
            )}
        </div>
      )}
    </div>
  );
}

function FamilySheet({ members, onAdd, onUpdate, onDelete, onClose }) {
  const [newName, setNewName] = useState('');
  return (
    <Sheet title="👨‍👩‍👧‍👦 Gezin & voorkeuren" subtitle="Allergie = de AI kiest het nooit · Lust niet = liefst vermijden" onClose={onClose} full>
      <div className="space-y-3">
        {members.map(m => <MemberCard key={m.id} member={m} onUpdate={(patch) => onUpdate(m.id, patch)}
          onDelete={() => { if (window.confirm(`${m.name} verwijderen?`)) onDelete(m.id); }} />)}
        {members.length === 0 && <div className="text-center text-sm text-stone-500 py-3">Voeg de gezinsleden toe en noteer wat ze niet lusten of niet mogen eten.</div>}
        <div className="flex gap-2">
          <input value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="Naam gezinslid…" className={inputCls}
            onKeyDown={(e) => { if (e.key === 'Enter' && newName.trim()) { onAdd(newName); setNewName(''); } }} />
          <Btn icon="plus" onClick={() => { if (newName.trim()) { onAdd(newName); setNewName(''); } }}>Voeg toe</Btn>
        </div>
      </div>
    </Sheet>
  );
}

function MemberCard({ member, onUpdate, onDelete }) {
  const [name, setName] = useState(member.name);
  const [term, setTerm] = useState('');
  const [kind, setKind] = useState('lust_niet');
  const list = member.restrictions || [];
  function addTerm() {
    const parts = term.split(',').map(s => s.trim()).filter(Boolean)
      .filter(t => !list.some(r => normalize(r.term) === normalize(t)));
    if (!parts.length) { setTerm(''); return; }
    onUpdate({ restrictions: [...list, ...parts.map(t => ({ term: t, kind }))] });
    setTerm('');
  }
  return (
    <Card className="p-3.5">
      <div className="flex items-center gap-2 mb-2.5">
        <input value={name} onChange={(e) => setName(e.target.value)} onBlur={() => { if (name.trim() && name.trim() !== member.name) onUpdate({ name: name.trim() }); }}
          className={cx(inputCls, 'font-extrabold')} />
        <IconBtn name="trash" title="Verwijderen" onClick={onDelete} className="text-stone-400" />
      </div>
      <div className="flex flex-wrap gap-1.5 mb-2.5">
        {list.length === 0 && <span className="text-xs text-stone-400">Eet alles 👍</span>}
        {list.map((r, i) => (
          <span key={i} className={cx('inline-flex items-center rounded-full text-xs font-bold', r.kind === 'allergie' ? 'bg-red-100 text-red-800' : 'bg-amber-100 text-amber-900')}>
            <button onClick={() => onUpdate({ restrictions: list.map((x, k) => k === i ? { ...x, kind: x.kind === 'allergie' ? 'lust_niet' : 'allergie' } : x) })}
              className="pl-2.5 pr-1 py-1" title="Tik om te wisselen tussen allergie en lust niet">
              {r.kind === 'allergie' ? '⚠️' : '🙅'} {r.term}
            </button>
            <button onClick={() => onUpdate({ restrictions: list.filter((_, k) => k !== i) })} className="pr-2 pl-0.5 py-1 opacity-60" aria-label="Verwijderen"><Icon name="x" size={12} /></button>
          </span>
        ))}
      </div>
      <div className="flex gap-1.5">
        <input value={term} onChange={(e) => setTerm(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') addTerm(); }}
          placeholder="bv. champignons, vis" className={cx(inputBase, 'flex-1 min-w-0 py-2')} />
        <select value={kind} onChange={(e) => setKind(e.target.value)} className="bg-mist rounded-xl px-2 text-xs font-bold text-forest border-0">
          <option value="lust_niet">Lust niet</option>
          <option value="allergie">Allergie</option>
        </select>
        <button onClick={addTerm} className="w-10 rounded-xl bg-forest text-white flex items-center justify-center shrink-0"><Icon name="plus" size={16} /></button>
      </div>
    </Card>
  );
}

function AccessSheet({ myEmail, onClose }) {
  const [rows, setRows] = useState(null);
  const [email, setEmail] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  const me = (myEmail || '').toLowerCase();
  async function load() {
    try { setRows(throwIfError(await sb.from('allowed_emails').select('*').order('email')) || []); setError(''); }
    catch (e) { setRows([]); setError(/does not exist|schema cache|relation/i.test(e.message) ? 'De database is nog niet bijgewerkt — voer eerst migratie-mealio-v2.sql uit.' : e.message); }
  }
  useEffect(() => { load(); }, []);
  async function add() {
    const v = email.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) { setError('Dat lijkt geen geldig e-mailadres.'); return; }
    setBusy(true); setError('');
    try { throwIfError(await sb.from('allowed_emails').insert({ email: v, added_by: me })); setEmail(''); await load(); }
    catch (e) { setError(/duplicate|unique/i.test(e.message) ? 'Dat adres staat al op de lijst.' : e.message); }
    finally { setBusy(false); }
  }
  async function remove(addr) {
    if (!window.confirm(`${addr} verwijderen? Die persoon kan dan niet meer inloggen in Mealio.`)) return;
    setError('');
    try { throwIfError(await sb.from('allowed_emails').delete().eq('email', addr)); await load(); }
    catch (e) { setError(e.message); }
  }
  return (
    <Sheet title="🔐 Toegang beheren" subtitle="Wie met Google mag inloggen in Mealio" onClose={onClose}>
      <div className="space-y-3">
        {rows === null ? <div className="text-sm text-stone-400 py-3 text-center">Laden…</div> : (
          <Card className="divide-y divide-line/70 overflow-hidden">
            {rows.map(r => (
              <div key={r.email} className="flex items-center gap-2 px-3.5 py-2.5">
                <span className="flex-1 min-w-0 truncate text-sm font-bold text-ink">{r.email}</span>
                {r.email === me ? <span className="text-[11px] font-black text-sage">jij</span>
                  : <IconBtn name="trash" size={15} title="Verwijderen" onClick={() => remove(r.email)} className="text-stone-400" />}
              </div>
            ))}
          </Card>
        )}
        <div className="flex gap-2">
          <input value={email} onChange={(e) => setEmail(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') add(); }}
            type="email" inputMode="email" autoCapitalize="none" placeholder="naam@gmail.com" className={inputCls} />
          <Btn onClick={add} disabled={busy}>Voeg toe</Btn>
        </div>
        {error && <div className="text-xs text-red-700 bg-red-50 border border-red-200 rounded-xl px-3 py-2">{error}</div>}
        <p className="text-[11px] text-stone-400">Iemand toevoegen geeft volledige toegang tot jullie weekmenu, recepten en boodschappen. Je eigen adres kan je niet verwijderen.</p>
      </div>
    </Sheet>
  );
}

// Kookmodus: eerst ingrediënten klaarzetten, dan stap per stap met timers.
let audioCtx = null;
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.35, 0.7].forEach(t => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.25, audioCtx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t + 0.28);
      o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.3);
    });
  } catch (e) {}
  try { if (navigator.vibrate) navigator.vibrate([400, 150, 400, 150, 400]); } catch (e) {}
}

function CookMode({ recipe, persons: startPersons, onClose }) {
  useBackClose(true, onClose);
  const [persons, setPersons] = useState(startPersons || recipe.basePortions || 1);
  const [phase, setPhase] = useState(-1);     // -1 = ingrediënten, 0..n-1 = stappen
  const [have, setHave] = useState({});
  const [timers, setTimers] = useState([]);   // { id, label, endsAt, total, rung }
  const [now, setNow] = useState(Date.now());
  const touch = useRef(null);
  useWakeLock(true);
  useEffect(() => {
    const prev = document.body.style.overflow; document.body.style.overflow = 'hidden';
    return () => { document.body.style.overflow = prev; };
  }, []);
  useEffect(() => {
    if (!timers.some(t => !t.rung)) return;
    const id = setInterval(() => setNow(Date.now()), 500);
    return () => clearInterval(id);
  }, [timers]);
  useEffect(() => {
    const due = timers.filter(t => !t.rung && t.endsAt <= now);
    if (due.length) { beep(); setTimers(ts => ts.map(t => due.some(d => d.id === t.id) ? { ...t, rung: true } : t)); }
  }, [now]); // eslint-disable-line

  const steps = (recipe.steps || []).map(s => s.replace(/^\d+[\.\)]\s*/, ''));
  const ratio = recipe.basePortions ? persons / recipe.basePortions : 1;
  const ings = recipe.ingredients || [];
  const last = steps.length - 1;
  function go(d) { setPhase(p => Math.max(-1, Math.min(last, p + d))); }
  function startTimer(seconds, label) {
    try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) {}
    setTimers(ts => [...ts, { id: Date.now() + Math.random(), label, total: seconds, endsAt: Date.now() + seconds * 1000, rung: false }]);
    setNow(Date.now());
  }

  return (
    <Portal>
      <div className="fixed inset-0 bg-cream flex flex-col" style={{ zIndex: 80 }}
        onTouchStart={(e) => { touch.current = e.touches[0].clientX; }}
        onTouchEnd={(e) => { if (touch.current == null) return; const dx = e.changedTouches[0].clientX - touch.current; touch.current = null; if (Math.abs(dx) > 70) go(dx < 0 ? 1 : -1); }}>
        <div className="pt-safe bg-forest text-white">
          <div className="max-w-lg mx-auto px-4 py-3 flex items-center gap-3">
            <div className="flex-1 min-w-0">
              <div className="text-[11px] font-bold text-white/70">{phase < 0 ? 'Klaarzetten' : `Stap ${phase + 1} van ${steps.length}`}</div>
              <div className="text-lg font-black truncate">👩‍🍳 {recipe.title}</div>
            </div>
            <button onClick={onClose} className="rounded-xl bg-white text-forest font-black text-sm px-4 py-2">Sluiten</button>
          </div>
          <div className="h-1.5 bg-white/15"><div className="h-full bg-mint transition-all" style={{ width: `${steps.length ? ((phase + 1) / steps.length) * 100 : 0}%` }} /></div>
        </div>

        <div className="flex-1 overflow-y-auto">
          <div className="max-w-lg mx-auto px-4 py-5">
            {phase < 0 ? (
              <div>
                <div className="flex items-center justify-between mb-3">
                  <span className="text-base font-black text-deep">Ingrediënten</span>
                  <Stepper value={persons} onChange={setPersons} label="pers." />
                </div>
                <div className="bg-white rounded-2xl border border-line divide-y divide-line/70 overflow-hidden">
                  {ings.length === 0 && <div className="px-4 py-3 text-sm text-stone-400">Geen ingrediënten.</div>}
                  {ings.map((ing, i) => (
                    <button key={i} onClick={() => setHave({ ...have, [i]: !have[i] })} className="w-full flex items-center gap-3 px-4 py-3.5 text-left active:bg-mist">
                      <span className={cx('w-7 h-7 rounded-full border-2 flex items-center justify-center shrink-0', have[i] ? 'bg-sage border-sage text-white' : 'border-stone-300')}>{have[i] && <Icon name="check" size={16} stroke={3} />}</span>
                      <span className={cx('flex-1 text-[17px] font-bold', have[i] ? 'line-through text-stone-300' : 'text-ink')}>{ing.name}</span>
                      <span className="text-sm font-bold text-stone-400 shrink-0">{ing.amount != null ? `${fmtAmount(ing.amount * ratio)} ${ing.unit || ''}` : (ing.unit || 'naar smaak')}</span>
                    </button>
                  ))}
                </div>
              </div>
            ) : (
              <div className="text-[24px] leading-relaxed font-bold text-ink">
                {splitDurations(steps[phase]).map((p, i) => p.seconds ? (
                  <button key={i} onClick={() => startTimer(p.seconds, `Stap ${phase + 1}: ${p.text}`)}
                    className="inline-flex items-center gap-1 mx-0.5 px-2.5 py-0.5 rounded-xl bg-amber-100 text-amber-900 border border-amber-300 align-baseline">
                    <Icon name="timer" size={18} />{p.text}
                  </button>
                ) : <span key={i}>{p.text}</span>)}
                {splitDurations(steps[phase]).some(p => p.seconds) && <div className="text-xs font-bold text-stone-400 mt-4">Tik op een tijd om een timer te starten.</div>}
              </div>
            )}
            {phase < 0 && steps.length === 0 && <div className="text-sm text-stone-400 mt-4">Dit recept heeft nog geen bereidingsstappen.</div>}
          </div>
        </div>

        {timers.length > 0 && (
          <div className="max-w-lg w-full mx-auto px-4 space-y-1.5 pb-2">
            {timers.map(t => {
              const left = Math.max(0, (t.endsAt - now) / 1000);
              return (
                <div key={t.id} className={cx('flex items-center gap-3 rounded-2xl px-3.5 py-2.5 shadow-card', t.rung ? 'bg-red-600 text-white animate-pulse' : 'bg-white border border-line')}>
                  <Icon name="timer" size={18} />
                  <span className="flex-1 min-w-0 truncate text-sm font-bold">{t.rung ? `⏰ Klaar — ${t.label}` : t.label}</span>
                  <span className="text-lg font-black tabular-nums">{t.rung ? '0:00' : fmtClock(left)}</span>
                  <button onClick={() => setTimers(ts => ts.filter(x => x.id !== t.id))} className={cx('rounded-lg px-2 py-1 text-xs font-black', t.rung ? 'bg-white text-red-700' : 'bg-mist text-forest')}>{t.rung ? 'OK' : <Icon name="x" size={14} />}</button>
                </div>
              );
            })}
          </div>
        )}

        <div className="border-t border-line bg-white pb-safe">
          <div className="max-w-lg mx-auto px-4 py-3 flex gap-2">
            <Btn variant="secondary" size="lg" className="flex-1" icon="left" disabled={phase < 0} onClick={() => go(-1)}>Vorige</Btn>
            {phase < last
              ? <Btn size="lg" className="flex-[2]" onClick={() => go(1)}>{phase < 0 ? 'Start met koken' : 'Volgende stap'}</Btn>
              : <Btn size="lg" className="flex-[2]" icon="check" onClick={onClose}>Smakelijk! Klaar</Btn>}
          </div>
        </div>
      </div>
    </Portal>
  );
}

// Na een koelkast-/kastfoto: aanvinken wat klopt, dan in de kast zetten.
function PantryScanSheet({ items, pantryStock, onAdd, onClose }) {
  const inStock = new Set(pantryStock.filter(p => p.inStock).map(p => normalize(p.name)));
  const [sel, setSel] = useState(() => Object.fromEntries(items.map(n => [n, !inStock.has(normalize(n))])));
  const chosen = items.filter(n => sel[n]);
  return (
    <Sheet title="📸 Herkend op de foto" subtitle="Vink aan wat klopt — dat komt in je kast" onClose={onClose}
      footer={<Btn size="lg" className="w-full" icon="check" disabled={!chosen.length} onClick={() => { chosen.forEach(onAdd); onClose(); }}>In de kast ({chosen.length})</Btn>}>
      {items.length === 0 ? <div className="text-center text-sm text-stone-500 py-6">Er werd niets herkend. Probeer een scherpere foto met meer licht.</div> : (
        <Card className="divide-y divide-line/70 overflow-hidden">
          {items.map(n => {
            const already = inStock.has(normalize(n));
            return (
              <button key={n} onClick={() => setSel({ ...sel, [n]: !sel[n] })} className="w-full flex items-center gap-3 px-3.5 py-3 text-left active:bg-mist">
                <span className={cx('w-6 h-6 rounded-md border-2 flex items-center justify-center shrink-0', sel[n] ? 'bg-sage border-sage text-white' : 'border-stone-300')}>{sel[n] && <Icon name="check" size={14} stroke={3} />}</span>
                <span className="flex-1 text-sm font-bold text-ink">{n}</span>
                {already && <span className="text-[10px] font-black text-sage">al in kast</span>}
              </button>
            );
          })}
        </Card>
      )}
    </Sheet>
  );
}
